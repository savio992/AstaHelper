<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Un campo visto dall'alto: a quaranta pixel sulla schermata Home un pallone diventa
       una macchia bianca, le linee di un campo restano riconoscibili. -->
  <defs>
    <linearGradient id="prato" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#128b4c"/>
      <stop offset="1" stop-color="#0b6236"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#prato)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="14" stroke-linejoin="round">
    <!-- Le linee stanno dentro l'80% centrale: le icone mascherate di Android ritagliano il resto. -->
    <rect x="104" y="72" width="304" height="368" rx="8"/>
    <path d="M104 256h304"/>
    <circle cx="256" cy="256" r="66"/>
    <path d="M186 72v44h140V72"/>
    <path d="M186 440v-44h140v44"/>
  </g>
  <circle cx="256" cy="256" r="17" fill="#ffffff"/>
</svg>
