# Pubblica l'app su GitHub Pages a ogni push.
#
# L'unico requisito e' che il repository sia pubblico: Pages sui repository privati richiede un
# piano a pagamento. Attivare Pages non serve farlo a mano — ci pensa `enablement` piu' sotto.
#
# L'app vive su https://savio992.github.io/AstaHelper/ e si aggiorna da sola.

name: Pubblica su GitHub Pages

on:
  push:
    branches:
      - main
      - claude/fantacalcio-auction-app-m0u47u
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta, senza annullare quello gia' partito.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Nessuna dipendenza da installare: il progetto usa solo Node e le API del browser.
      - name: Test
        run: node --test 'test/*.test.js'

      - name: Build
        run: node scripts/build.js

      # `enablement` accende Pages via API se non lo e' gia': senza, il primo push su un
      # repository dove Pages non e' mai stato configurato fallisce qui con "Not Found", e
      # l'unico rimedio sarebbe andare a mano nelle impostazioni.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
