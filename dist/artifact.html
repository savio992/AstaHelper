<script type="module">
'use strict';
// ===== src/domain/model.js =====
const __m_src_domain_model_js = (() => {
// Impostazioni della lega e valori di default.

const ROLES = ['P', 'D', 'C', 'A'];

const ROLE_LABEL = { P: 'Portieri', D: 'Difensori', C: 'Centrocampisti', A: 'Attaccanti' };
const ROLE_LABEL_SHORT = { P: 'Por', D: 'Dif', C: 'Cen', A: 'Att' };
// Il reparto, non il ruolo al plurale: "gli ultimi due big in attacco" si legge, "in
// attaccanti" no. Serve ovunque si parli del reparto invece che dei giocatori.
const ROLE_REPARTO = { P: 'porta', D: 'difesa', C: 'centrocampo', A: 'attacco' };

// Scala unica di qualita' delle fasce: piu' basso = fascia migliore.
// Serve solo a proporre un ordinamento automatico all'import; resta tutto modificabile a mano.
const NAMED_TIERS = [
  [/^(top|top player|fuoriclasse|campione)/, 0],
  [/^(semi ?top|quasi top)/, 0.5],
  [/^(jolly)/, 90],
  [/^(sorpresa|rivelazione)/, 91],
  [/^(scommessa|scommesse)/, 92],
  [/^(low ?cost|occasione)/, 93],
  [/^(riserva|riserve|panchina)/, 94],
  [/^(terzo portiere|terzi portieri)/, 95],
  [/^(da evitare|evitare|sconsigliat)/, 99],
];

const ORDINAL_WORDS = { prima: 1, seconda: 2, terza: 3, quarta: 4, quinta: 5, sesta: 6, settima: 7, ottava: 8 };

function tierSortKey(label) {
  const n = String(label)
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
  for (const [re, value] of NAMED_TIERS) {
    if (re.test(n)) return [value, n];
  }
  for (const [word, value] of Object.entries(ORDINAL_WORDS)) {
    if (n.includes(word)) return [value, n];
  }
  const num = n.match(/(\d+)/);
  if (num) return [Number(num[1]), n];
  // Etichetta sconosciuta: la mettiamo a meta' classifica, l'utente potra' spostarla.
  return [50, n];
}

/**
 * Ordine delle fasce dedotto dai dati, non dai nomi.
 * I creators usano vocabolari incompatibili ("Terza", "SOPRA AI LOW COST", "JOLLY 2a FASCIA"):
 * il prezzo mediano dei giocatori di una fascia dice molto piu' chiaramente quanto vale.
 * Si ripiega sull'euristica sui nomi solo quando i prezzi mancano.
 */
function inferTierOrder(players, role) {
  const groups = new Map();
  for (const p of players) {
    if (p.role !== role || !p.tier) continue;
    if (!groups.has(p.tier)) groups.set(p.tier, []);
    const v = p.price ?? p.pma ?? p.quo ?? null;
    if (Number.isFinite(v)) groups.get(p.tier).push(v);
  }
  if (!groups.size) return [];

  const withPrice = [];
  const withoutPrice = [];
  for (const [tier, values] of groups) {
    if (!values.length) {
      withoutPrice.push(tier);
      continue;
    }
    const sorted = [...values].sort((a, b) => a - b);
    const median = sorted[Math.floor(sorted.length / 2)];
    withPrice.push({ tier, median });
  }
  withPrice.sort((a, b) => b.median - a.median);
  return [...withPrice.map((t) => t.tier), ...sortTierLabels(withoutPrice)];
}

/**
 * Assegna a ogni giocatore la sua posizione relativa nella scala delle fasce del proprio ruolo
 * (0 = fascia migliore, 1 = peggiore). E' l'unico modo di confrontare due creators che usano
 * vocabolari diversi: "Terza" di uno e "FASCIA ALTA" dell'altro diventano numeri comparabili.
 */
function annotateTierPct(players) {
  const orders = {};
  for (const role of ROLES) orders[role] = inferTierOrder(players, role);
  return players.map((p) => {
    const order = orders[p.role] || [];
    const idx = order.indexOf(p.tier);
    const pct = order.length > 1 && idx >= 0 ? idx / (order.length - 1) : idx === 0 ? 0 : null;
    return { ...p, tierPct: pct };
  });
}

/**
 * Normalizza la colonna PMA in quote di mercato confrontabili fra creators.
 *
 * PMA e' il prezzo medio pagato per quel giocatore nelle altre aste, in percentuale del budget
 * di squadra: e' un dato osservato, non un'opinione. Ma ogni creator lo calcola sul proprio
 * campione di aste, e i totali non coincidono (in questi listoni 1009% contro 810%, cioe' aste
 * da dieci squadre contro aste da otto). Mediare le percentuali grezze mescolerebbe due scale
 * diverse: si mediano le quote sul totale di ciascuna fonte.
 */
function annotatePmaShare(players) {
  let total = 0;
  for (const p of players) if (Number.isFinite(p.pma) && p.pma > 0) total += p.pma;
  return players.map((p) => ({
    ...p,
    pmaShare: total > 0 && Number.isFinite(p.pma) && p.pma > 0 ? p.pma / total : null,
  }));
}

/**
 * Normalizza anche il prezzo consigliato in quote confrontabili fra creators.
 *
 * Stesso problema della PMA, ma per un motivo diverso: la PMA misura lo stesso mercato e i
 * creators concordano (Lautaro pagato 164 e 156), mentre il prezzo consigliato e' un giudizio
 * personale e le scale divergono (Lautaro consigliato a 150 e a 195). Mediare i valori grezzi
 * mescolerebbe un creator prudente con uno generoso; mediare le quote confronta invece quanto
 * ciascuno dei due lo valuta rispetto a tutti gli altri giocatori del suo listone.
 */
function annotatePriceShare(players) {
  let total = 0;
  for (const p of players) if (Number.isFinite(p.price) && p.price > 0) total += p.price;
  return players.map((p) => ({
    ...p,
    priceShare: total > 0 && Number.isFinite(p.price) && p.price > 0 ? p.price / total : null,
  }));
}

/** Ordina un elenco di etichette di fascia dalla migliore alla peggiore, con euristica sui nomi. */
function sortTierLabels(labels) {
  return [...labels].sort((a, b) => {
    const ka = tierSortKey(a);
    const kb = tierSortKey(b);
    if (ka[0] !== kb[0]) return ka[0] - kb[0];
    return ka[1] < kb[1] ? -1 : ka[1] > kb[1] ? 1 : 0;
  });
}

function defaultSettings() {
  return {
    budget: 500,
    // Lega da otto: modificabile dalla scheda Lega.
    participants: 8,
    slots: { P: 3, D: 8, C: 8, A: 6 },
    // Quanti giocatori per ruolo schieri di solito (modulo di riferimento, default 3-4-3).
    // Serve a non far spendere crediti su panchinari: in porta ne gioca uno solo.
    starters: { P: 1, D: 3, C: 4, A: 3 },

    picks = improveWithSynergy({ picks, ...ctx });

    : picks;

    ok: true,
    picks: daComprare,
    owned: davveroMiei,
    all: full,
    cost,

    budgetCurve,

  // e' cieca alla sinergia, che dipende da quali giocatori stanno insieme e non si puo' scrivere

  // massimizza la somma e perda un blocco che varrebbe di piu': sui listoni di prova escludere

  const out = { P: 0, D: 0, C: 0, A: 0 };
  for (const p of ownedPlayers) out[p.role] += p.paid || 0;
  for (const p of picks) out[p.role] += p.plannedPrice || 0;
  return out;
}

 * tre difensori dello stesso club valgono piu' di tre difensori sparsi quando c'e' il

  const hasSynergy = settings.defenseModifier || settings.cleanSheetModifier || Number(settings.maxPerClub) > 0;

  const inRoster = new Set([...current.map((p) => p.id), ...ownedPlayers.map((p) => p.id)]);

  const priceOf = (p) => Math.max(1, Math.round(priceOverride.get(p.id) ?? p.expectedPrice ?? 1));
  const poolByRole = {};
  for (const role of ROLES) {
    poolByRole[role] = players
      .filter((p) => p.role === role && !owned.has(p.id) && !unavailable.has(p.id))
      .sort((a, b) => b.score - a.score)
      .slice(0, 120);
  }

  const roleSpend = (list, role, owned) =>
    list.filter((p) => p.role === role).reduce((a, p) => a + p.plannedPrice, 0) +
    owned.filter((p) => p.role === role).reduce((a, p) => a + (p.paid || 0), 0);

  const evaluate = (list) => rosterScore([...ownedPlayers.map((p) => ({ ...p, score: p.score })), ...list], settings);
  const spend = (list) => list.reduce((s, p) => s + p.plannedPrice, 0);

  let improved = true;
  let sweeps = 0;
  const maxSweeps = hasSynergy ? 5 : 2;
  while (improved && sweeps++ < maxSweeps) {
    improved = false;
    for (let i = 0; i < current.length; i++) {
      const out = current[i];
      const budgetForSlot = budgetLeft - (spend(current) - out.plannedPrice);
      // Il tetto di spesa del ruolo vale anche qui: il DP lo rispettava, uno scambio
      // conveniente ma fuori budget di reparto lo violerebbe in silenzio.
      const cap = settings.roleBudget?.[out.role];
      const roleCapLeft =
        cap === null || cap === undefined || cap === ''
          ? Infinity
          : Math.max(0, Number(cap) - roleSpend(current, out.role, ownedPlayers) + out.plannedPrice);
      let bestList = null;
      let bestScore = evaluate(current);
      const clubCap = Number(settings.maxPerClub) || 0;
      const exposure = clubCap > 0 ? clubExposure([...ownedPlayers, ...current], settings) : null;
      // Se sto togliendo un top e il reparto e' gia' al minimo, il sostituto deve essere un top.
      const minTop = Math.max(0, Math.round(settings.minTop?.[out.role] ?? 0));
      const topInRuolo = [...current, ...ownedPlayers].filter((p) => p.role === out.role && p.isTop).length;
      const serveTop = out.isTop && topInRuolo <= minTop;
      for (const cand of poolByRole[out.role]) {
        if (inRoster.has(cand.id)) continue;
        if (serveTop && !cand.isTop) continue;
        const cost = priceOf(cand);
        if (cost > budgetForSlot || cost > roleCapLeft) continue;
        // Non riportare dentro un club gia' al limite: il tetto e' appena stato rispettato.
        if (exposure && cand.team !== out.team && (exposure.get(cand.team)?.effettivi ?? 0) >= clubCap) continue;

        const sc = evaluate(trial);

          bestScore = sc;
          bestList = trial;
        }
      }
      if (bestList) {
        inRoster.delete(out.id);
        inRoster.add(bestList[i].id);

      }

}) {
  const byId = new Map(players.map((p) => [p.id, p]));
  const target = byId.get(playerId);
  if (!target) return { alternatives: [], planB: null };

  // Il piano B arriva da fuori quando c'e' (aprire una scheda ne calcolava tre identici),
  // ma l'insieme "senza di lui" serve lo stesso per valutare ogni candidato: costruirlo non
  // costa niente, e' risolverlo che costava.
  const withoutSet = new Set(unavailable);
  withoutSet.add(playerId);
  const planB = pianoB?.ok ? pianoB : pianoSenza({ players, settings, owned, unavailable, obbligati, playerId });
  const planWith = (() => {
    const o = new Map(owned);
    o.set(playerId, Math.max(1, Math.round(target.expectedPrice ?? 1)));
    return optimizeRoster({ players, settings, owned: o, unavailable, ...FAST, obbligati });
  })();

  const budgetNow = maxSpendableNow(settings, owned);
  const lambda = creditShadowPrice(planB.budgetCurve, planB.budgetLeft ?? budgetNow);

  // Pre-selezione economica: valore netto dei crediti spesi. Poi valutazione esatta dei migliori.
  const pool = players
    .filter(
      (p) =>
        p.role === target.role &&
        p.id !== playerId &&
        !owned.has(p.id) &&
        !unavailable.has(p.id) &&
        Math.round(p.expectedPrice ?? 1) <= budgetNow
    )
    .map((p) => ({ p, net: (p.score || 0) - lambda * Math.max(1, Math.round(p.expectedPrice ?? 1)) }))
    .sort((a, b) => b.net - a.net)
    .slice(0, shortlist);

  const inPlanB = planB.ok ? new Set(planB.picks.map((x) => x.id)) : new Set();

  const results = [];
  for (const { p } of pool) {
    const price = Math.max(1, Math.round(p.expectedPrice ?? 1));
    if (price > budgetNow) continue;
    // Chi e' gia' scelto dal piano B al suo prezzo atteso da' esattamente il piano B: forzarlo
    // dentro non cambia una virgola. Risolvere di nuovo costerebbe un'ottimizzazione intera per
    // riottenere lo stesso identico risultato, ed erano la maggioranza dei candidati.
    const plan = inPlanB.has(p.id)
      ? planB
      : optimizeRoster({ players, settings, owned: new Map([...owned, [p.id, price]]), unavailable: withoutSet, ...FAST, obbligati });
    if (!plan.ok) continue;
    results.push({
      player: p,
      price,
      score: plan.score,
      // Se e' gia' fra gli obiettivi della rosa senza il giocatore perso, non e' un'alternativa:
      // quello lo prendi comunque, e proporlo come sostituto fa credere a uno scambio che non
      // esiste. Perdere un attaccante da centosessanta e sentirsi rispondere "prendi quello da
      // ventiquattro" e' esattamente questo caso: quello da ventiquattro era gia' in rosa.
      giaNelPiano: inPlanB.has(p.id),
      // Quanto perdo (o guadagno) rispetto ad avere il giocatore che sto perdendo al suo prezzo atteso.
      deltaVsTarget: planWith.ok ? Math.round((plan.score - planWith.score) * 10) / 10 : null,
      // Quanto guadagno rispetto a non fare nulla e ridistribuire i crediti.
      deltaVsPlanB: planB.ok ? Math.round((plan.score - planB.score) * 10) / 10 : null,
      inPlanB: planB.ok ? planB.picks.some((x) => x.id === p.id) : false,
    });
  }

  results.sort((a, b) => b.score - a.score);
  return {
    alternatives: results.slice(0, limit),
    planB,
    planWith,
    lambda: Math.round(lambda * 1000) / 1000,
  };
}

/** Differenza fra due piani: chi entra e chi esce. */
function planDiff(before, after) {
  const a = new Map((before?.picks || []).map((p) => [p.id, p]));
  const b = new Map((after?.picks || []).map((p) => [p.id, p]));
  const removed = [...a.values()].filter((p) => !b.has(p.id));
  const added = [...b.values()].filter((p) => !a.has(p.id));
  return { added, removed };
}

/**
 * Budget pianificato per ruolo e per fascia, piu' quanto ho gia' speso davvero.
 * E' la bussola che mi tiene dentro il piano durante l'asta.
 */
function tierBudgetReport({ plan, settings, players, owned = new Map() }) {
  const byId = new Map(players.map((p) => [p.id, p]));
  const rows = new Map();

  const touch = (role, tier) => {
    const key = tierKey(role, tier);
    if (!rows.has(key)) rows.set(key, { key, role, tier: tier || '—', planned: 0, plannedCount: 0, spent: 0, spentCount: 0 });
    return rows.get(key);
  };

  for (const p of plan?.picks || []) {
    const row = touch(p.role, p.tier);
    row.planned += p.plannedPrice || 0;
    row.plannedCount += 1;
  }
  for (const [id, price] of owned) {
    const p = byId.get(id);
    if (!p) continue;
    const row = touch(p.role, p.tier);
    row.spent += price;
    row.spentCount += 1;
    // Un giocatore gia' preso fa parte del piano a tutti gli effetti.
    row.planned += price;
    row.plannedCount += 1;
  }

  const list = [...rows.values()];
  const roleOrder = { P: 0, D: 1, C: 2, A: 3 };
  list.sort((a, b) => {
    if (roleOrder[a.role] !== roleOrder[b.role]) return roleOrder[a.role] - roleOrder[b.role];
    const oa = settings.tierOrder?.[a.role]?.indexOf(a.tier) ?? 99;
    const ob = settings.tierOrder?.[b.role]?.indexOf(b.tier) ?? 99;
    return (oa < 0 ? 99 : oa) - (ob < 0 ? 99 : ob);
  });
  return list;
}

/**
 * Il piano d'azione del reparto in corso.
 *
 * Non basta sapere chi voglio: durante la chiamata serve gia' deciso fin dove arrivo e cosa
 * faccio se salta, perche' quei dieci secondi non bastano a ricalcolare niente. Qui il ramo e'
 * pronto prima: obiettivo, tetto, primo ripiego, secondo ripiego. E in fondo lo scenario nero,
 * quello in cui saltano tutti gli obiettivi del reparto, con la destinazione dei crediti.
 */
function pianoDiReparto({ players, settings, owned = new Map(), unavailable = new Set(), obbligati = new Set(), plan, role = null, rami = 2 }) {
  const fase = role || faseCorrente(settings, players, owned);
  if (!fase) return null;
  const budget = budgetDiFase({ settings, players, owned, plan, role: fase });
  const args = { players, settings, owned, unavailable, obbligati };

  const scelti = (plan?.picks || [])
    .filter((p) => p.role === fase)
    .sort((a, b) => b.plannedPrice - a.plannedPrice)
    .slice(0, 4);
  // Un altro obiettivo dello stesso reparto non e' un ripiego: lo sto gia' cercando comunque.
  const altriObiettivi = new Set(scelti.map((p) => p.id));

  const obiettivi = scelti.map((p) => {
    const { maxBid: tetto } = maxBid({ ...args, playerId: p.id });
    const { alternatives: alt } = alternatives({ ...args, playerId: p.id, limit: rami + altriObiettivi.size });
    return {
      player: p,
      prezzoPiano: p.plannedPrice,
      massimo: tetto,
      // Il piano lo compra al prezzo di mercato, ma il pareggio dice di meno: significa che
      // il primo che capita fa quasi lo stesso, e su di lui non vale la pena rilanciare.
      sostituibile: tetto < p.plannedPrice,
      ripieghi: alt
        .filter((a) => !altriObiettivi.has(a.player.id))
        .slice(0, rami)
        .map((a) => ({ player: a.player, price: a.price, delta: a.deltaVsTarget })),
    };
  });

  // Scenario nero: saltano tutti gli obiettivi del reparto.
  let senzaNessuno = null;
  if (obiettivi.length) {
    const persi = new Set(unavailable);
    for (const o of obiettivi) persi.add(o.player.id);
    const dopo = optimizeRoster({ players, settings, owned, unavailable: persi, ...FAST, obbligati });
    if (dopo.ok) {
      const nuovi = dopo.picks.filter((p) => p.role === fase).sort((a, b) => b.plannedPrice - a.plannedPrice).slice(0, 3);
      const spesaPrima = (plan?.picks || []).filter((p) => p.role === fase).reduce((a, p) => a + p.plannedPrice, 0);
      const spesaDopo = dopo.picks.filter((p) => p.role === fase).reduce((a, p) => a + p.plannedPrice, 0);
      senzaNessuno = {
        picks: nuovi,
        spesaPrima,
        spesaDopo,
        liberati: spesaPrima - spesaDopo,
        costo: plan?.ok ? Math.round((plan.score - dopo.score) * 10) / 10 : null,
        // Dove finiscono i crediti risparmiati.
        destinazione: ROLES.filter((r) => r !== fase)
          .map((r) => ({
            role: r,
            delta:
              dopo.picks.filter((p) => p.role === r).reduce((a, p) => a + p.plannedPrice, 0) -
              (plan?.picks || []).filter((p) => p.role === r).reduce((a, p) => a + p.plannedPrice, 0),
          }))
          .filter((d) => d.delta > 2)
          .sort((a, b) => b.delta - a.delta),
      };
    }
  }

  return { fase, etichetta: ROLE_LABEL[fase], budget, obiettivi, senzaNessuno };
}

/**
 * L'abbinamento dei portieri, il consiglio che i creators ripetono a ogni guida.
 *
 * In Classic se ne schiera uno solo ma se ne possiedono tre: il secondo non serve a giocare,
 * serve a non restare mai senza. Prenderlo nella stessa squadra del titolare significa che
 * qualunque cosa succeda in quella porta il voto arriva, e con l'imbattibilita' arriva anche
 * il clean sheet della stessa difesa su cui si e' investito.
 */
function abbinamentoPortiere({ players, settings, plan, owned = new Map(), unavailable = new Set() }) {
  if (!plan?.ok) return null;
  const miei = [...plan.owned.filter((p) => p.role === 'P'), ...plan.picks.filter((p) => p.role === 'P')];
  if (!miei.length) return null;
  const titolare = miei.slice().sort((a, b) => (b.scelto ? 1 : 0) - (a.scelto ? 1 : 0) || (b.score || 0) - (a.score || 0))[0];
  if (!titolare.team) return null;
  const gia = miei.some((p) => p.id !== titolare.id && p.team === titolare.team);
  if (gia) return { titolare, coppia: null, fatto: true };

  const candidati = players
    .filter(
      (p) =>
        p.role === 'P' &&
        p.team === titolare.team &&
        p.id !== titolare.id &&
        !owned.has(p.id) &&
        !unavailable.has(p.id)
    )
    .sort((a, b) => (b.score || 0) - (a.score || 0));
  if (!candidati.length) return { titolare, coppia: null, fatto: false };
  return { titolare, coppia: candidati[0], fatto: false };
}


/**
 * Cosa succede davvero quando perdi un giocatore.
 *
 * Elencare dei sostituti non basta e a volte inganna: la risposta giusta quasi mai e' "compra
 * quest'altro al posto suo", e' "la rosa si riorganizza cosi'". Perdere un attaccante da
 * centosessanta crediti non significa comprare un altro attaccante da centosessanta ne' ripiegare
 * su uno da venti: significa che quei crediti si ridistribuiscono, e il piano puo' rifare
 * l'attacco intero e portarsi dietro difesa e centrocampo.
 */
function spiegaPerdita({ players, settings, owned = new Map(), unavailable = new Set(), obbligati = new Set(), playerId, piano = null, limite = 4, alternative = null, planB: pianoB = null }) {
  const perso = players.find((p) => p.id === playerId);
  if (!perso) return null;

  const prima = piano?.ok ? piano : optimizeRoster({ players, settings, owned, unavailable, ...FAST, obbligati });
  const dopo = pianoB?.ok ? pianoB : pianoSenza({ players, settings, owned, unavailable, obbligati, playerId });
  if (!dopo.ok) {
    return { perso, dopo, impossibile: true, frasi: ['Senza di lui non si chiude una rosa valida: e\' incedibile.'] };
  }

  const idsPrima = new Set(prima.picks.map((p) => p.id));
  const idsDopo = new Set(dopo.picks.map((p) => p.id));
  const entrati = dopo.picks.filter((p) => !idsPrima.has(p.id));
  const usciti = prima.picks.filter((p) => !idsDopo.has(p.id) && p.id !== playerId);

  const spostamenti = ROLES.map((r) => ({
    role: r,
    delta: (dopo.spentByRole[r] || 0) - (prima.spentByRole[r] || 0),
  })).filter((x) => Math.abs(x.delta) >= 3);

  // Chi prende il suo posto nel reparto: il piu' caro fra chi entra nello stesso ruolo.
  const sostituto = entrati
    .filter((p) => p.role === perso.role)
    .sort((a, b) => b.plannedPrice - a.plannedPrice)[0] || null;

  const prezzoPiano = prima.picks.find((p) => p.id === playerId)?.plannedPrice ?? perso.expectedPrice ?? 0;
  const costo = Math.max(0, Math.round((prima.score - dopo.score) * 10) / 10);
  // Le alternative arrivano gia' calcolate da chi ci chiama. Il parametro c'era da tempo e non
  // veniva letto: si ricalcolavano da capo a ogni apertura di scheda, ed erano il pezzo piu'
  // caro dei tre.
  const tutte = alternative?.length
    ? alternative
    : alternatives({ players, settings, owned, unavailable, obbligati, playerId, limit: 12, planB: dopo }).alternatives;

  const frasi = [];
  if (sostituto) {
    frasi.push(`Al suo posto entra ${sostituto.name} a ${sostituto.plannedPrice}.`);
  } else {
    frasi.push(`Nessuno lo sostituisce uno a uno: il reparto si rifa' con quello che resta.`);
  }
  const liberati = prezzoPiano - (sostituto?.plannedPrice ?? 0);
  const altrove = spostamenti.filter((x) => x.role !== perso.role && x.delta > 0);
  if (liberati > 5 && altrove.length) {
    frasi.push(
      `I ${liberati} crediti che si liberano vanno su ${elenco(
        altrove.map((x) => `${ROLE_LABEL[x.role].toLowerCase()} (+${x.delta})`)
      )}.`
    );
  }
  if (entrati.length >= 3) {
    frasi.push(`Non e' un cambio secco: si riorganizzano ${entrati.length} scelte su quattro reparti.`);
  }
  frasi.push(costo > 0 ? `Ti costa ${costo} punti attesi.` : `Non ti costa niente: il piano vale quanto prima.`);

  return {
    perso,
    prezzoPiano,
    prima,
    dopo,
    costo,
    entrati,
    usciti,
    spostamenti,
    sostituto,
    riorganizzazione: entrati.length >= 3,
    // Le vere alternative: chi non era gia' destinato a entrare comunque.
    alternative: tutte.filter((a) => !a.giaNelPiano).slice(0, limite),
    giaTuoi: tutte.filter((a) => a.giaNelPiano).slice(0, limite),
    frasi,
  };
}


/**
 * Perche' l'offerta massima e' cosi' lontana dal prezzo di mercato.
 *
 * Un numero senza motivo non si usa: leggere "il mercato lo paga 43, tu fermati a 5" fa pensare
 * a un errore, e a quel punto o si ignora il consiglio o si perde tempo a discuterci. Qui si
 * cerca la ragione vera, e quasi sempre e' una di tre: gioca troppo poco, esiste qualcuno che
 * rende uguale per molto meno, oppure il posto da titolare in quel reparto e' gia' occupato.
 */
function spiegaOfferta({ players, settings, owned = new Map(), unavailable = new Set(), playerId, offerta, piano = null }) {
  const p = players.find((x) => x.id === playerId);
  if (!p) return null;
  const atteso = Math.max(1, Math.round(p.expectedPrice ?? 1));
  const frasi = [];

  // Chi rende almeno quanto lui e costa meno: e' la ragione piu' convincente di tutte.
  const equivalenti = players
    .filter(
      (x) =>
        x.role === p.role &&
        x.id !== p.id &&
        !owned.has(x.id) &&
        !unavailable.has(x.id) &&
        (x.score || 0) >= (p.score || 0) &&
        Math.round(x.expectedPrice ?? 1) < atteso
    )
    .sort((a, b) => (a.expectedPrice ?? 0) - (b.expectedPrice ?? 0));

  // Quante partite ci si aspetta da lui, contro i titolari veri del suo ruolo.
  const presenze = Math.round(expectedShare(p) * 38);
  const riferimento = players
    .filter((x) => x.role === p.role && !unavailable.has(x.id))
    .map((x) => Math.round(expectedShare(x) * 38))
    .sort((a, b) => b - a);
  const tipico = riferimento.length ? riferimento[Math.min(riferimento.length - 1, (settings.participants || 8) - 1)] : presenze;

  // Il posto da titolare e' gia' occupato da qualcuno di piu' forte?
  const titolari = Math.max(1, settings.starters?.[p.role] ?? 1);
  const miei = piano?.ok
    ? [...piano.owned.filter((x) => x.role === p.role), ...piano.picks.filter((x) => x.role === p.role && x.id !== p.id)]
        .sort((a, b) => (b.score || 0) - (a.score || 0))
    : [];
  const davanti = miei.filter((x) => (x.score || 0) > (p.score || 0));
  const panchina = davanti.length >= titolari;

  if (offerta <= 0) {
    frasi.push(`Il mercato lo paga ${atteso}, ma alla tua rosa non serve: anche a un credito il piano peggiora.`);
  } else if (offerta < atteso * 0.65) {
    frasi.push(`Il mercato lo paga ${atteso}, per la tua rosa ne vale ${offerta}.`);
  } else if (offerta > atteso * 1.15) {
    // La pastiglia in alto confronta la valutazione dei creators col prezzo di mercato; questa
    // riga confronta il prezzo di mercato con quanto serve alla tua rosa. Sono due cose diverse
    // e chiamarle entrambe "occasione" le faceva sembrare in contraddizione.
    frasi.push(`Il mercato lo paga ${atteso}, ma alla tua rosa serve al punto che ne varrebbe ${offerta}.`);
    return { frasi, atteso, offerta, presenze, equivalente: equivalenti[0] || null, panchina };
  } else {
    return { frasi: [], atteso, offerta, presenze, equivalente: equivalenti[0] || null, panchina };
  }

  if (panchina && titolari === 1) {
    frasi.push(`In ${p.role === 'P' ? 'porta' : 'quel ruolo'} ne giochi uno solo, e il tuo titolare e' gia' ${davanti[0].name}: lui andrebbe in panchina.`);
  } else if (panchina) {
    frasi.push(`Sarebbe una riserva: davanti a lui hai gia' ${davanti.slice(0, titolari).map((x) => x.name).join(', ')}.`);
  }

  if (presenze < tipico - 5) {
    frasi.push(`Ci si aspettano ${presenze} partite da lui, contro le ${tipico} di un titolare del ruolo.`);
  }

  const eq = equivalenti[0];
  if (eq) {
    const meglio = (eq.score || 0) > (p.score || 0) * 1.1;
    frasi.push(
      `${eq.name} rende ${meglio ? 'di piu' + "'" : 'quanto lui'} e il mercato lo paga ${Math.round(eq.expectedPrice ?? 1)}.`
    );
  }

  return { frasi, atteso, offerta, presenze, equivalente: eq || null, panchina };
}

/**
 * Il tetto di spesa su una lista scelta a mano.
 *
 * In modalita' automatica l'offerta massima e' un punto di pareggio: il prezzo oltre il quale
 * conviene la rosa alternativa. Su una lista decisa dall'utente quell'alternativa non esiste —
 * la rosa e' quella, l'ha scelta lui — e la domanda cambia: quanto posso pagarlo continuando a
 * permettermi tutti gli altri che ho messo in lista.
 *
 * E' aritmetica, non ottimizzazione: si mette da parte il prezzo di mercato di ogni altro nome
 * ancora da comprare, piu' un credito per ogni casella che la lista lascia vuota.
 */
function tettoSullaLista({ players, settings, owned = new Map(), lista = new Set(), playerId }) {
  const byId = new Map(players.map((p) => [p.id, p]));
  const budget = settings.budget || 500;
  const speso = [...owned.values()].reduce((a, b) => a + (Number(b) || 0), 0);

  const inLista = [...lista].map((id) => byId.get(id)).filter(Boolean);
  const daComprare = inLista.filter((p) => !owned.has(p.id) && p.id !== playerId);
  const riservatoLista = daComprare.reduce((a, p) => a + Math.max(1, Math.round(p.expectedPrice ?? 1)), 0);

  // Quante caselle restano scoperte dopo la lista: ognuna costa almeno un credito.
  const presiPerRuolo = { P: 0, D: 0, C: 0, A: 0 };
  for (const id of owned.keys()) {
    const p = byId.get(id);
    if (p && p.role in presiPerRuolo) presiPerRuolo[p.role] += 1;
  }
  for (const p of inLista) {
    if (!owned.has(p.id) && p.role in presiPerRuolo) presiPerRuolo[p.role] += 1;
  }
  let scoperte = 0;
  const mancanti = {};
  for (const role of ROLES) {
    mancanti[role] = Math.max(0, (settings.slots?.[role] || 0) - presiPerRuolo[role]);
    scoperte += mancanti[role];
  }
  // La casella del giocatore che sto valutando non va contata due volte.
  const target = byId.get(playerId);
  const suoPosto = target && !lista.has(playerId) && !owned.has(playerId) ? Math.min(1, mancanti[target.role] || 0) : 0;

  const residuo = budget - speso - riservatoLista - Math.max(0, scoperte - suoPosto);
  return {
    massimo: Math.max(0, residuo),
    riservatoLista,
    scoperte,
    mancanti,
    costoLista: riservatoLista + (owned.size ? speso : 0),
  };
}

/** Quanto costa in punti attesi giocare la propria lista invece del piano libero. */
function costoDellaLista({ players, settings, owned = new Map(), unavailable = new Set(), lista = new Set() }) {
  const libero = optimizeRoster({ players, settings, owned, unavailable, ...FAST });
  const mia = optimizeRoster({ players, settings, owned, unavailable, obbligati: lista, ...FAST });
  if (!libero.ok || !mia.ok) return null;

  // Dove costa, non solo quanto. Un totale di centosettanta punti non dice niente: sapere che
  // centocinquanta arrivano dalla porta si', perche' e' li' che c'e' una scelta da rivedere.
  // Un'ottimizzazione per reparto in cui ci sia qualcosa di scelto, e non di piu'.
  const byId = new Map(players.map((p) => [p.id, p]));
  const perRuolo = [];
  for (const role of ROLES) {
    const suoi = [...lista].filter((id) => byId.get(id)?.role === role);
    if (!suoi.length) continue;
    const senzaQuelReparto = new Set([...lista].filter((id) => !suoi.includes(id)));
    const alt = optimizeRoster({ players, settings, owned, unavailable, obbligati: senzaQuelReparto, ...FAST });
    if (!alt.ok) continue;
    perRuolo.push({
      role,
      scelti: suoi.length,
      differenza: Math.round((alt.score - mia.score) * 10) / 10,
      spesaTua: mia.spentByRole[role] || 0,
      spesaMia: alt.spentByRole[role] || 0,
    });
  }

  return {
    libero,
    mia,
    differenza: Math.round((libero.score - mia.score) * 10) / 10,
    percentuale: libero.score > 0 ? Math.round(((libero.score - mia.score) / libero.score) * 1000) / 10 : 0,
    perRuolo: perRuolo.sort((a, b) => b.differenza - a.differenza),
  };
}

// Sotto i cinque crediti si e' comprato un riempitivo, e un riempitivo in panchina ci sta:
// e' esattamente il suo mestiere. Sopra, si stanno pagando dei crediti per non giocare.

// La schermata che uso durante l'asta: crediti, offerta massima, alternative.

const { state, assign, release, undo, ownedMap, unavailableSet, takenMap, playerById, creditsLeft, rebuildPlan, pianoPrimaDellUltimaMossa, onReset, blocca, scarta, liberaScelta, statoScelta, obbligatiSet, contestoConsiglio, attribuisci } = __m_src_store_js;
const { ROLES, ROLE_LABEL, ROLE_LABEL_SHORT, totalSlots, elenco } = __m_src_domain_model_js;
const { maxBid, alternatives, maxSpendableNow, slotsLeftByRole, budgetDiFase, pianoDiReparto, abbinamentoPortiere, spiegaPerdita, spiegaOfferta, tettoSullaLista, pianoSenza } = __m_src_domain_advisor_js;
const { concorrenza, concorrenzaPerRuolo, verdettoConcorrenza, nomiSquadre, disponibilita } = __m_src_domain_mercato_js;
const { spiegaMossa, ultimaOccasione } = __m_src_domain_strategia_js;
const { optimizeRoster, CONFIG_SOLUTORE } = __m_src_domain_optimizer_js;
const { esc, roleChip, matches, playerRow, emptyState, toast, edgeBadge, altVerdict } = __m_src_ui_common_js;

// I calcoli d'asta costano piu' di un secondo a scheda: si tengono finche' il piano non cambia.
//
// Ne teniamo alcuni, non uno solo. Durante un rilancio si salta avanti e indietro fra due o tre
// nomi — quello chiamato, il suo sostituto, quello che si stava seguendo prima — e con una
// casella sola ogni ritorno ricalcolava tutto da capo. Le voci valgono per una revisione del
// piano; quando il piano cambia sono tutte scadute insieme, quindi si buttano invece di
// invecchiare una per una.
const MAX_SCHEDE = 6;
const schede = new Map();
// A quale piano appartengono le schede in cache. Quando il piano cambia scadono tutte
// insieme, perche' tutte lo usano come termine di paragone.
let schedeRev = null;
let cache = vuota();
let pending = false;

function vuota() {
  return { key: null, bid: null, alts: null, perdita: null, escluso: false, pianoRif: null };
}

/** Riporta in cima la voce appena usata, cosi' a buttarne una si butta la piu' vecchia. */
function ricorda(key, voce) {
  schede.delete(key);
  schede.set(key, voce);
  while (schede.size > MAX_SCHEDE) schede.delete(schede.keys().next().value);
}

// La revisione del piano, non la lunghezza del registro: mettere un lucchetto dalla scheda
// Piano cambia l'offerta massima senza aggiungere una riga al registro, e per due versioni
// l'asta ha continuato a mostrare il consiglio di prima. Annullare una mossa aveva lo stesso
// difetto al contrario, perche' faceva tornare la lunghezza a un valore gia' visto.
function cacheKey() {
  return `${state.ui.selectedId}|${state.revisione}`;
}

onReset(() => {
  invalidate();
  chiediChiuso = null;
});

function invalidate() {
  mossaChiusa = null;
  mossaRicostruita = null;

  schede.clear();
  schedeRev = null;
  cache = vuota();
  reparto = null;
}

function ensureAdvice(rerender) {
  const key = cacheKey();
  if (cache.key === key || !state.ui.selectedId || pending) return;
  if (schedeRev !== state.revisione) {
    schede.clear();
    schedeRev = state.revisione;
  }
  const gia = schede.get(key);
  if (gia) {
    cache = gia;
    return;
  }
  pending = true;
  // Un frame di respiro cosi' lo spinner viene disegnato prima del calcolo.
  setTimeout(() => {
    try {
      // Se il giocatore e' stato scartato, tutti i numeri vanno calcolati sul mondo in cui non
      // lo e': altrimenti si finisce a dire "puoi spendere nove" perche' il piano non mette
      // crediti in porta, e il piano non ce li mette perche' il portiere l'hai scartato tu.
      // E' un cerchio, e la cifra che ne esce non dice niente.
      const { escluso, unavailable } = contestoConsiglio(state.ui.selectedId);
      const args = {
        players: state.players,
        settings: state.settings,
        owned: ownedMap(),
        unavailable,
        obbligati: obbligatiSet(),
        playerId: state.ui.selectedId,
      };
      const pianoRif = escluso
        ? optimizeRoster({ players: args.players, settings: args.settings, owned: args.owned, unavailable, obbligati: args.obbligati, ...CONFIG_SOLUTORE })
        : state.plan;
      // Un piano B solo per tutti e tre: e' il termine di paragone dell'offerta massima,
      // delle alternative e del racconto della perdita, e ognuno se lo ricalcolava uguale.
      const planB = pianoSenza(args);
      const alts = alternatives({ ...args, limit: 12, planB });
      cache = {
        key,
        escluso,
        pianoRif,
        bid: maxBid({ ...args, planB }),
        alts,
        // Le stesse alternative, non ricalcolate: il parametro c'era e non veniva letto.
        perdita: spiegaPerdita({ ...args, piano: pianoRif, alternative: alts.alternatives, planB }),
      };
      ricorda(key, cache);
    } catch (err) {
      console.error(err);
      cache = { ...vuota(), key };
    } finally {
      pending = false;
      rerender();
    }
  }, 16);
}

// L'ultima mossa raccontata: si azzera quando la si chiude o quando ne arriva un'altra.
let mossaChiusa = null;
let mossaRicostruita = null;

/**
 * Cosa e' appena successo al piano.
 *
 * Dopo ogni assegnazione il piano si rifa' da capo, ma il ricalcolo restava invisibile: un
 * avviso di due secondi e la lista che cambiava sotto gli occhi. Qui la mossa viene raccontata
 * per intero, ed e' l'unico momento in cui serve davvero: quando il piano si muove.
 */
function mossaCard() {
  const log = state.auction.log;
  const ultimo = log[log.length - 1];
  if (!ultimo || ultimo.kind === 'release' || mossaChiusa === log.length) return '';
  // Dopo una riapertura dell'app il piano precedente non c'e' piu': si ricostruisce dal registro.
  if (!state.prevPlan?.ok) {
    if (mossaRicostruita?.chiave !== log.length) {
      mossaRicostruita = { chiave: log.length, piano: pianoPrimaDellUltimaMossa() };
    }
  }
  const sp = spiegaMossa({
    prima: state.prevPlan?.ok ? state.prevPlan : mossaRicostruita?.piano,
    dopo: state.plan,
    players: state.players,
    settings: state.settings,
    evento: ultimo,
  });
  if (!sp) return '';

  const colore = sp.mio ? 'accent' : sp.eraObiettivo ? 'danger' : 'line';
  return `
  <div class="card" style="border-left:3px solid var(--${colore})">
    <div class="row between" style="align-items:flex-start;margin-bottom:6px">
      <b>${esc(sp.titolo)}</b>
      <button class="btn ghost" style="padding:2px 8px" data-action="chiudi-mossa" aria-label="Chiudi">✕</button>
    </div>
    <div class="small" style="line-height:1.6">${sp.frasi.map((f) => esc(f)).join(' ')}</div>
    ${
      sp.mosse.length
        ? `<div class="row wrap" style="gap:6px;margin-top:10px">
             ${sp.mosse
               .map(
                 (m) =>
                   `<span class="chip">${esc(ROLE_LABEL[m.role])} <b class="mono" style="color:var(--${
                     m.delta > 0 ? 'accent' : 'danger'
                   })">${m.delta > 0 ? '+' : ''}${m.delta}</b></span>`
               )
               .join('')}
           </div>`
        : ''
    }
    ${
      sp.entrati.length
        ? `<details style="margin-top:10px">
             <summary class="tiny muted">Il piano in dettaglio (${sp.entrati.length} entrano, ${sp.usciti.length} escono)</summary>
             <div class="tiny muted" style="margin-top:6px;line-height:1.7">
               <div><b style="color:var(--accent)">entrano</b> ${sp.entrati.map((x) => `${esc(x.name)} ${x.plannedPrice}`).join(' · ')}</div>
               ${sp.usciti.length ? `<div><b style="color:var(--danger)">escono</b> ${sp.usciti.map((x) => `${esc(x.name)} ${x.plannedPrice}`).join(' · ')}</div>` : ''}
             </div>
           </details>`
        : ''
    }
  </div>`;
}

/**
 * "A chi e' andato?", chiesto dopo, non prima.
 *
 * La corsia veloce e' un tocco solo e deve restarlo: durante una chiamata non si sta a
 * scegliere da un elenco. Ma senza sapere l'acquirente il tabellone degli avversari non
 * impara niente, ed e' li' che nascono i consigli che valgono di piu'. Quindi la domanda si
 * fa qui, sulla card di cosa e' appena successo, che resta a schermo finche' non arriva la
 * mossa dopo: se c'e' un attimo si risponde con un tocco, altrimenti si ignora.
 */
function chiediChiCard() {
  const log = state.auction.log;
  const ultimo = log[log.length - 1];
  if (!ultimo || ultimo.kind !== 'other' || ultimo.by != null) return '';
  if (chiediChiuso === log.length) return '';
  const p = playerById(ultimo.id);
  const nomi = nomiSquadre(state.settings);
  return `
  <div class="card" style="border-left:3px solid var(--warn)">
    <div class="row between" style="align-items:flex-start;margin-bottom:8px">
      <div class="small"><b>${esc(p?.name || 'Il giocatore')}</b> a chi e' andato?</div>
      <button class="btn ghost" style="padding:2px 8px" data-action="chiudi-chi" aria-label="Lascia perdere">✕</button>
    </div>
    <div class="row wrap" style="gap:6px">
      ${nomi
        .map((nome, i) =>
          i === 0
            ? ''
            : `<button class="btn" style="flex:1 1 28%;min-width:84px;padding:9px 6px" data-action="attribuisci" data-id="${esc(ultimo.id)}" data-idx="${i}">${esc(nome)}</button>`
        )
        .join('')}
    </div>
    <div class="tiny muted" style="margin-top:8px">Un tocco, e so fin dove possono spingersi gli altri. Se non lo sai, chiudi pure.</div>
  </div>`;
}

let chiediChiuso = null;

function hud() {
  const left = creditsLeft();
  const budget = state.settings.budget || 500;
  const owned = ownedMap();
  const slots = slotsLeftByRole(state.settings, state.players, owned);
  const filled = owned.size;
  const pct = Math.max(0, Math.min(100, (left / budget) * 100));
  const fase = budgetDiFase({ settings: state.settings, players: state.players, owned, plan: state.plan });
  const sforato = fase.spesoFase > fase.pianificatoFase && fase.pianificatoFase > 0;
  return `
  <div class="card">
    <div class="hud">
      <div class="credits mono">${left}<small>crediti liberi</small></div>
      <div>
        <div class="bar"><i style="width:${pct}%" class="${left < 0 ? 'over' : ''}"></i></div>
        <div class="row between small muted" style="margin-top:6px">
          <span>${filled}/${totalSlots(state.settings)} slot</span>
          <span>max su un giocatore: <b class="mono">${fase.massimoOra}</b></span>
        </div>
      </div>
    </div>
    <div class="slotbar" style="margin-top:12px">
      ${ROLES.map(
        (r) =>
          `<div style="${r === fase.fase ? 'outline:2px solid var(--accent);outline-offset:-2px' : ''}"><b class="mono">${slots[r]}</b><span>${
            r === 'P' ? 'POR' : r === 'D' ? 'DIF' : r === 'C' ? 'CEN' : 'ATT'
          }</span></div>`
      ).join('')}
    </div>
    <div class="row between small" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
      <span class="muted">si gioca sui <b style="color:var(--text)">${esc(fase.etichetta.toLowerCase())}</b></span>
      <span class="muted"><b class="mono" style="color:var(--${sforato ? 'danger' : 'text'})">${fase.perLaFase}</b> per il reparto ·
        <b class="mono">${fase.riservatoDopo}</b> riservati al resto</span>
    </div>
    ${climaCard(fase)}
  </div>`;
}

/**
 * La riga che dice com'e' l'aria nel reparto in corso.
 *
 * Sono due conteggi che e' facilissimo confondere e che decidono il prezzo: quanti posti
 * restano in palio in tutta la lega, e quanti giocatori restano liberi fra cui scegliere.
 * Possono essere due posti e quaranta nomi: vuol dire che quei posti sono miei e nessuno
 * me li contende, ed e' il momento di prenderli per un credito invece di rilanciare.
 */
function climaCard(fase) {
  if (!state.mercato) return '';
  const owned = ownedMap();
  const c = concorrenza({
    settings: state.settings,
    players: state.players,
    owned,
    taken: takenMap(),
    role: fase.fase,
    tabellone: state.tabellone,
  });
  const d = disponibilita({ settings: state.settings, players: state.players, owned, mercato: state.mercato })[fase.fase];
  if (!d.servono) return '';

  let frase;
  let colore;
  if (!c.quanti) {
    frase =
      d.servono === 1
        ? `Nessuno te lo contende piu': l'ultimo lo prendi a un credito.`
        : `Nessuno te li contende piu': i tuoi ${d.servono} li prendi a un credito l'uno.`;
    colore = 'accent';
  } else if (d.critico) {
    frase = `Restano ${d.liberi} nomi liberi e te ne servono ${d.servono}: non puoi permetterti di perderne.`;
    colore = 'danger';
  } else {
    frase =
      `${c.quanti} avversari ne cercano ancora, il piu' ricco puo' arrivare a ${c.massimo}. Nomi liberi: ${d.liberi}.` +
      (c.attendibile ? '' : ` (so a chi sono andati ${c.attribuiti} su ${c.venduti}: il tetto vero e' piu' basso)`);
    colore = 'text';
  }
  return `<div class="small" style="margin-top:8px;color:var(--${colore})">${frase}</div>`;
}

/**
 * Riepilogo di cosa e' impostato, prima che l'asta cominci.
 * Atterrare su una schermata con una casella di ricerca vuota non dice cosa fare:
 * qui si vede a colpo d'occhio se manca qualcosa e dove andare a metterlo.
 */
function readyCard() {
  const s = state.settings;
  const plan = state.plan;
  const passi = [
    {
      fatto: state.sources.length > 0,
      titolo: state.sources.length
        ? `Listone: ${state.sources.map((x) => esc(x.name)).join(' + ')}`
        : 'Carica il listone del creator',
      tab: 'listone',
    },
    {
      fatto: true,
      titolo: `${s.participants} squadre · ${s.budget} crediti · ${s.slots.P}-${s.slots.D}-${s.slots.C}-${s.slots.A}`,
      nota: [s.defenseModifier ? 'mod. difesa' : null, s.cleanSheetModifier ? 'imbattibilita' : null]
        .filter(Boolean)
        .join(' + ') || 'nessun modificatore',
      tab: 'setup',
    },
    {
      fatto: !!plan?.ok,
      titolo: plan?.ok ? `Piano pronto: ${plan.cost} crediti impegnati` : 'Piano non ancora calcolato',
      tab: 'piano',
    },
  ];
  return `
  <div class="card">
    <h2>Prima di cominciare</h2>
    ${passi
      .map(
        (x) => `<div class="switch" data-action="goto" data-tab="${x.tab}">
          <div class="grow">
            <div class="lbl">${x.fatto ? '✓' : '○'} ${x.titolo}</div>
            ${x.nota ? `<div class="tiny muted">${esc(x.nota)}</div>` : ''}
          </div>
          <span class="muted">›</span>
        </div>`
      )
      .join('')}
  </div>`;
}

function verdictFor(price, bid) {
  if (!bid) return '';
  if (bid.maxBid <= 0) return `<div class="verdict stop">Lascialo andare: non migliora la rosa.</div>`;
  if (price > bid.maxBid) return `<div class="verdict stop">Fermati. Oltre ${bid.maxBid} conviene il piano B.</div>`;
  if (price >= bid.maxBid - Math.max(1, Math.round(bid.maxBid * 0.08)))
    return `<div class="verdict edge">Sei al limite: puoi arrivare a ${bid.maxBid}, non oltre.</div>`;
  return `<div class="verdict go">Rilancia pure: hai margine fino a ${bid.maxBid}.</div>`;
}

function detail(p) {
  const owned = ownedMap();
  const status = state.auction.owned[p.id] !== undefined ? 'mine' : state.auction.taken[p.id] !== undefined ? 'other' : null;
  const bid = cache.key === cacheKey() ? cache.bid : null;
  const alts = cache.key === cacheKey() ? cache.alts : null;
  const inPlan = state.plan?.picks?.some((x) => x.id === p.id);
  const planned = state.plan?.picks?.find((x) => x.id === p.id)?.plannedPrice;
  const current = state.ui.bidPrice ?? Math.round(p.expectedPrice ?? 1);
  const spendable = maxSpendableNow(state.settings, owned);
  // Il tetto di reparto va letto sul piano che puo' contenerlo: su un piano che lo esclude
  // direbbe soltanto che quel piano non lo vuole, cosa che si sa gia'.
  const pianoRif = (cache.key === cacheKey() && cache.pianoRif) || state.plan;
  const fase = budgetDiFase({ settings: state.settings, players: state.players, owned, plan: pianoRif, role: p.role });

  const paid = status === 'mine' ? state.auction.owned[p.id] : status === 'other' ? state.auction.taken[p.id] : null;

  return `
  <div class="card">
    <div class="row between" style="align-items:flex-start">
      <div class="grow">
        <h3 style="margin-bottom:4px">${esc(p.name)}</h3>
        <div class="row wrap" style="gap:6px">
          ${roleChip(p.role)}
          <span class="chip">${esc(p.team || '—')}</span>
          ${p.tier ? `<span class="chip">${esc(p.tier)}</span>` : ''}
          ${inPlan ? '<span class="chip plan">In piano</span>' : ''}
          ${edgeBadge(p)}
          ${status === 'mine' ? `<span class="chip mine">Mio a ${paid}</span>` : ''}
          ${status === 'other' ? `<span class="chip gone">Preso da altri a ${paid}</span>` : ''}
        </div>
      </div>
      <button class="btn ghost" data-action="close-detail" aria-label="Chiudi">✕</button>
    </div>

    ${statoScelta(p.id) ? sceltaRiga(p) : ''}
    ${creatorInfo(p)}

    ${
      status
        ? `<div style="margin-top:14px"><button class="btn block" data-action="release" data-id="${esc(p.id)}">Annulla assegnazione</button></div>`
        : `
    <div class="maxbid">
      ${
        bid
          ? (() => {
              // Due numeri, non uno che cambia significato di nascosto. Quanto vale per la
              // rosa e quanto il reparto puo' permettersi sono due cose diverse: schiacciarle
              // in una cifra sola costringe a indovinare quale delle due si sta leggendo.
              const tettoFase = fase.slotMancanti > 0 ? fase.massimoOra : null;

              // In modalita' "scelgo io" la domanda e' un'altra. Il punto di pareggio confronta
              // con la rosa alternativa che il solutore costruirebbe, ma chi ha scelto la
              // propria lista non vuole quell'alternativa: vuole sapere fin dove puo' spingersi
              // continuando a permettersi tutti gli altri nomi che ha messo in lista.
              const miaLista = state.settings.modalita === 'mia';
              const conto = miaLista
                ? tettoSullaLista({ players: state.players, settings: state.settings, owned, lista: obbligatiSet(), playerId: p.id })
                : null;
              const cifra = miaLista ? conto.massimo : bid.maxBid;
              const frena = !miaLista && tettoFase !== null && bid.maxBid > tettoFase;
              return `<div class="n mono ${cifra <= 0 ? 'zero' : ''}">${cifra <= 0 ? '—' : cifra}</div>
             <div class="lbl">${cifra <= 0 ? 'non fa per te' : miaLista ? 'puoi arrivare a questo' : 'vale fino a questo'}</div>
             ${
               miaLista
                 ? `<div class="small muted" style="margin-top:8px">
                      Restano ${conto.riservatoLista} crediti impegnati sugli altri nomi della tua lista
                      e ${conto.scoperte} caselle da riempire. Il valore di mercato dice ${bid.maxBid}.
                    </div>`
                 : ''
             }
             ${
               !miaLista && tettoFase !== null && bid.maxBid > 0
                 ? `<div class="small" style="margin-top:8px;color:var(--${frena ? 'warn' : 'muted'})">
                      ${
                        frena
                          ? `Ma per i ${esc(fase.etichetta.toLowerCase())} ti restano <b>${tettoFase}</b>: oltre, devi togliere crediti agli altri reparti.`
                          : `Per i ${esc(fase.etichetta.toLowerCase())} ti restano ${tettoFase}: ci stai dentro.`
                      }
                    </div>`
                 : ''
             }
             ${ripiego(alts, bid)}
             ${bid.reason ? `<div class="small muted" style="margin-top:6px">${esc(bid.reason)}</div>` : ''}
             ${perche(p, bid)}
             ${concorrenzaBox(p, bid)}`;
            })()
          : `<div class="n mono"><span class="spinner"></span></div><div class="lbl">calcolo in corso</div>`
      }
    </div>

    <div class="row between small muted" style="margin-bottom:10px">
      <span>prezzo atteso <b class="mono">${Math.round(p.expectedPrice ?? 0)}</b></span>
      ${planned ? `<span>a piano <b class="mono">${planned}</b></span>` : ''}
      <span>ti resta per il reparto <b class="mono">${fase.perLaFase}</b></span>
    </div>

    <div class="stepper">
      <button class="btn" data-action="bid-minus">−</button>
      <input type="number" inputmode="numeric" class="mono" id="bidprice" value="${current}" min="0" max="${spendable}" data-action="bid-input">
      <button class="btn" data-action="bid-plus">+</button>
    </div>
    <div style="margin-top:10px">${
      current > fase.massimoOra && fase.slotMancanti > 0
        ? `<div class="verdict stop">A ${current} sfori il reparto: resteresti senza crediti per ${esc(
elenco((state.settings.auctionOrder || ROLES).slice((state.settings.auctionOrder || ROLES).indexOf(p.role) + 1).map((r) => ROLE_LABEL[r].toLowerCase()))
          ) || 'il resto'}.</div>`
        : verdictFor(current, bid)
    }</div>
    ${scarsitaBox(p)}

    ${
      state.ui.chiediSquadra === p.id
        ? `<div style="margin-top:12px">
             <div class="small muted" style="margin-bottom:8px">A chi e' andato? Serve a sapere fin dove possono spingersi gli altri.</div>
             <div class="row wrap" style="gap:6px">
               ${nomiSquadre(state.settings)
                 .map((nome, i) =>
                   i === 0
                     ? ''
                     : `<button class="btn" style="flex:1 1 30%;min-width:88px" data-action="assign-to" data-id="${esc(p.id)}" data-idx="${i}">${esc(nome)}</button>`
                 )
                 .join('')}
               <button class="btn ghost" style="flex:1 1 100%" data-action="assign-to" data-id="${esc(p.id)}" data-idx="">non lo so</button>
             </div>
           </div>`
        : `<div class="grid2" style="margin-top:12px">
             <button class="btn primary" data-action="take-mine" data-id="${esc(p.id)}">L'ho preso io</button>
             <button class="btn danger" data-action="take-other" data-id="${esc(p.id)}">Preso da altri</button>
           </div>
           ${statoScelta(p.id) ? '' : sceltaRiga(p)}`
    }`
    }
  </div>

  ${status === 'other' || !status ? perditaCard(p, cache.key === cacheKey() ? cache.perdita : null, alts) : ''}
  `;
}

/**
 * Chi puo' ancora contendermelo, e fino a quanto.
 * Un giocatore non costa quello che vale: costa un credito piu' di quanto puo' pagare il
 * secondo miglior offerente. Se quel numero e' sotto la mia offerta massima, l'asta e' gia'
 * decisa e ogni credito speso oltre quella soglia e' buttato.
 */
/**
 * "Dopo di lui non ce ne sono altri".
 *
 * Il tetto d'offerta e' calcolato sul piano B: quanto puoi pagare prima che convenga
 * l'alternativa. Ma quando l'alternativa non esiste piu' quel numero, pur restando esatto,
 * risponde a una domanda che non e' piu' quella giusta — e sulla schermata dell'asta era
 * l'unica cosa scritta. Questo riquadro dice quando siamo in quel caso.
 */
function scarsitaBox(p) {
  const avviso = ultimaOccasione({
    players: state.players,
    settings: state.settings,
    owned: ownedMap(),
    unavailable: unavailableSet(),
    playerId: p.id,
  });
  if (!avviso) return '';
  return `
  <div class="verdict ${avviso.gravita === 'ultima' ? 'stop' : 'edge'}" style="margin-top:10px;text-align:left">
    <div class="small" style="font-weight:700">${esc(avviso.titolo)}</div>
    <div class="small" style="font-weight:500;margin-top:4px">${esc(avviso.testo)}</div>
  </div>`;
}

function concorrenzaBox(p, bid) {
  if (!bid || bid.maxBid <= 0) return '';
  const conc = concorrenza({
    settings: state.settings,
    players: state.players,
    owned: ownedMap(),
    taken: takenMap(),
    role: p.role,
    tabellone: state.tabellone,
  });
  const v = verdettoConcorrenza({ mioMassimo: bid.maxBid, conc });
  const classe = v.esito === 'tuo' || v.esito === 'nessuno' ? 'go' : v.esito === 'conteso' ? 'edge' : '';
  return `<div class="verdict ${classe}" style="margin-top:10px;text-align:left">
    <div class="small" style="font-weight:600">${esc(v.testo)}</div>
    ${v.nota ? `<div class="tiny" style="font-weight:500;margin-top:5px;opacity:.75">${esc(v.nota)}</div>` : ''}
  </div>`;
}

/**
 * Un numero da solo non basta: si dice a chi si ripiega, con nome e prezzo.
 *
 * Chi e' gia' negli obiettivi anche senza di lui non e' un ripiego, e nominarlo fa credere a
 * uno scambio che non esiste: "fermati a 5, meglio Falcone a 9" e' incomprensibile finche' non
 * si scopre che Falcone lo prendi comunque.
 */
function ripiego(alts, bid) {
  const first = (alts?.alternatives || []).find((a) => !a.giaNelPiano);
  if (!first) return '';
  // Con offerta zero non c'e' niente da superare: la frase deve dire cosa fare, non a che
  // soglia fermarsi.
  const testo =
    bid && bid.maxBid <= 0
      ? `lascialo andare: se ti serve il ruolo, <b>${esc(first.player.name)}</b> a ${first.price}`
      : `se lo superi, meglio <b>${esc(first.player.name)}</b> a ${first.price}`;
  return `<div class="small muted" style="margin-top:8px">${testo}</div>`;
}

/**
 * Imporre o scartare un giocatore.
 *
 * Il piano e' una proposta, non un verdetto: qui si dice al solutore che quel portiere lo si
 * vuole comunque, e lui ricalcola tutto il resto con i crediti che restano. Il contrario vale
 * per chi non si vuole vedere proposto mai piu'.
 */
function sceltaRiga(p) {
  const stato = statoScelta(p.id);
  if (stato === 'bloccato') {
    return `<div class="verdict edge" style="margin-top:10px;text-align:left">
      <div class="small" style="font-weight:600">Lo vuoi comunque: il piano e' costruito attorno a lui.</div>
      <button class="btn ghost block" style="margin-top:8px" data-action="libera" data-id="${esc(p.id)}">Lascia decidere al piano</button>
    </div>`;
  }
  if (stato === 'escluso') {
    return `<div class="verdict stop" style="margin-top:10px;text-align:left">
      <div class="small" style="font-weight:600">L'hai scartato: il piano non lo propone.</div>
      <div class="small" style="font-weight:500;margin-top:4px">
        I numeri qui sotto valgono se cambiassi idea: sono calcolati sul piano che lo comprerebbe,
        non su quello che lo esclude.
      </div>
      <button class="btn ghost block" style="margin-top:8px" data-action="libera" data-id="${esc(p.id)}">Rimettilo in gioco</button>
    </div>`;
  }
  return `<div class="grid2" style="margin-top:8px">
    <button class="btn ghost" data-action="blocca" data-id="${esc(p.id)}">🔓 Lo voglio comunque</button>
    <button class="btn ghost" data-action="scarta" data-id="${esc(p.id)}">✕ Non lo voglio</button>
  </div>`;
}

/** Perche' l'offerta massima e' cosi' distante dal prezzo di mercato. */
function perche(p, bid) {
  if (!bid) return '';
  const sp = spiegaOfferta({
    players: state.players,
    settings: state.settings,
    owned: ownedMap(),
    unavailable: unavailableSet(),
    playerId: p.id,
    offerta: bid.maxBid,
    piano: state.plan,
  });
  if (!sp?.frasi.length) return '';
  const occasione = bid.maxBid > (sp.atteso || 0) * 1.15;
  return `<div class="verdict ${occasione ? 'go' : 'edge'}" style="margin-top:10px;text-align:left">
    <div class="small" style="font-weight:600">${esc(sp.frasi[0])}</div>
    ${sp.frasi.length > 1 ? `<div class="small" style="font-weight:500;margin-top:4px">${sp.frasi.slice(1).map((f) => esc(f)).join(' ')}</div>` : ''}
  </div>`;
}

/** Quello che i creators dicono di lui: giudizi, etichette, disaccordo sul prezzo. */
function creatorInfo(p) {
  const bits = [];
  if (Number.isFinite(p.titolarita)) bits.push(`titolarita' ${'●'.repeat(Math.round(p.titolarita))}${'○'.repeat(5 - Math.round(p.titolarita))}`);
  if (Number.isFinite(p.integrita)) bits.push(`integrita' ${'●'.repeat(Math.round(p.integrita))}${'○'.repeat(5 - Math.round(p.integrita))}`);
  if (Number.isFinite(p.expShare)) bits.push(`~${Math.round(p.expShare * 38)} presenze attese`);

  // Quanto costa davvero contro quanto dicono che valga, creator per creator.
  const fonti = p.consigliatoBySource ? Object.entries(p.consigliatoBySource) : [];
  const valutazioni = fonti.length
    ? `<div class="small" style="margin-top:10px">
         <div class="muted">pagato in media <b class="mono" style="color:var(--text)">${Math.round(p.expectedPrice)}</b> nelle altre aste</div>
         <div class="muted" style="margin-top:2px">lo valutano: ${fonti
           .map(([src, v]) => `${esc(src)} <b class="mono" style="color:var(--${v > p.expectedPrice ? 'accent' : v < p.expectedPrice ? 'danger' : 'text'})">${v}</b>`)
           .join(' · ')}</div>
       </div>`
    : '';

  const disagreement =
    fonti.length > 1 && Math.max(...fonti.map((f) => f[1])) > Math.min(...fonti.map((f) => f[1])) * 1.35
      ? `<div class="verdict edge" style="margin-top:10px;text-align:left">
           I creators non sono d'accordo su di lui. Se va via vicino alla valutazione piu' bassa, e' un affare.
         </div>`
      : '';

  const tiers = p.tiersBySource
    ? Object.entries(p.tiersBySource).map(([src, tier]) => `<span class="chip">${esc(src)}: ${esc(tier)}</span>`).join(' ')
    : '';

  if (!bits.length && !p.tags?.length && !valutazioni && !p.notes) return '';

  return `
  <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
    ${bits.length ? `<div class="small muted mono">${bits.join(' · ')}</div>` : ''}
    ${p.tags?.length ? `<div class="row wrap" style="gap:5px;margin-top:8px">${p.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}
    ${tiers ? `<div class="row wrap" style="gap:5px;margin-top:8px">${tiers}</div>` : ''}
    ${valutazioni}
    ${disagreement}
    ${
      p.notes
        ? `<details style="margin-top:10px" ${p.notes.length < 320 ? 'open' : ''}>
             <summary class="small muted">Cosa dicono i creators di lui</summary>
             <div class="small" style="margin-top:6px;white-space:pre-wrap;line-height:1.55">${esc(p.notes)}</div>
           </details>`
        : ''
    }
  </div>`;
}

/**
 * Cosa succede davvero se lo perdo.
 *
 * Un elenco di sostituti non basta e sa ingannare: perdere un attaccante da centosessanta
 * crediti non significa comprarne un altro da centosessanta ne' ripiegare su uno da venti,
 * significa che quei crediti si ridistribuiscono e il piano puo' rifare il reparto intero
 * portandosi dietro gli altri. Qui si vede prima il ragionamento e poi, semmai, i nomi.
 */
function perditaCard(p, sp, alts) {
  if (!sp) {
    return `<div class="card"><h2>Se lo perdo</h2><div class="small muted"><span class="spinner"></span> Ricalcolo la rosa senza di lui…</div></div>`;
  }
  if (sp.impossibile) {
    return `<div class="card"><h2>Se lo perdo</h2><div class="verdict stop" style="text-align:left">${esc(sp.frasi[0])}</div></div>`;
  }

  const dopoRuolo = sp.dopo.picks
    .filter((x) => x.role === p.role)
    .sort((a, b) => b.plannedPrice - a.plannedPrice);
  const spostati = sp.spostamenti.filter((x) => x.role !== p.role);

  return `
  <div class="card">
    <h2>Se lo perdo</h2>

    <div class="small" style="margin-bottom:12px;line-height:1.6">${sp.frasi.map((f) => esc(f)).join(' ')}</div>

    <div style="padding-top:12px;border-top:1px solid var(--line)">
      <div class="tiny muted" style="margin-bottom:6px">${esc(ROLE_LABEL[p.role].toLowerCase())} senza di lui</div>
      <div class="row wrap" style="gap:6px">
        ${dopoRuolo
          .map(
            (x) =>
              `<span class="chip ${sp.entrati.some((e) => e.id === x.id) ? 'plan' : ''}" data-action="select" data-id="${esc(x.id)}">${esc(
                x.name
              )} <b class="mono">${x.plannedPrice}</b></span>`
          )
          .join('')}
      </div>
      <div class="tiny muted" style="margin-top:6px">in evidenza chi entra al posto suo</div>
    </div>

    ${
      spostati.length
        ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
             <div class="tiny muted" style="margin-bottom:6px">dove finiscono i crediti</div>
             ${spostati
               .map(
                 (x) => `<div class="row between small">
                   <span>${roleChip(x.role)} ${esc(ROLE_LABEL[x.role])}</span>
                   <span class="mono" style="color:var(--${x.delta > 0 ? 'accent' : 'muted'})">${x.delta > 0 ? '+' : ''}${x.delta}</span>
                 </div>`
               )
               .join('')}
             ${
               sp.entrati.filter((e) => e.role !== p.role).length
                 ? `<div class="tiny muted" style="margin-top:6px">entrano ${sp.entrati
                     .filter((e) => e.role !== p.role)
                     .map((e) => `${esc(e.name)} (${e.plannedPrice})`)
                     .join(', ')}</div>`
                 : ''
             }
           </div>`
        : ''
    }

    ${
      sp.alternative.length
        ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
             <div class="tiny muted" style="margin-bottom:8px">se invece vuoi restare su questo reparto</div>
             ${sp.alternative
               .map((a) => {
                 const v = altVerdict(a.deltaVsTarget, p.score);
                 return `
               <div class="alt" data-action="select" data-id="${esc(a.player.id)}">
                 ${roleChip(a.player.role)}
                 <div class="grow">
                   <div class="nm">${esc(a.player.name)} ${edgeBadge(a.player)}</div>
                   <div class="sub small muted">${esc(a.player.team || '—')}${a.player.tier ? ' · ' + esc(a.player.tier) : ''}</div>
                 </div>
                 <div style="text-align:right">
                   <div class="mono" style="font-weight:800">${a.price}<span class="tiny muted"> cr</span></div>
                   <div class="tiny" style="color:var(--${v.classe === 'pos' ? 'accent' : v.classe === 'neg' ? 'danger' : 'muted'})">${v.parola}</div>
                 </div>
               </div>`;
               })
               .join('')}
           </div>`
        : ''
    }

    ${
      sp.giaTuoi.length
        ? `<details style="margin-top:12px">
             <summary class="tiny muted">Questi li prendi comunque (${sp.giaTuoi.length})</summary>
             <div class="tiny muted" style="margin-top:6px;line-height:1.7">
               ${sp.giaTuoi.map((a) => `${esc(a.player.name)} ${a.price}`).join(' · ')}
               <div style="margin-top:4px">Erano gia' nel piano anche senza di lui: non sono sostituti, sono la tua rosa in ogni caso.</div>
             </div>
           </details>`
        : ''
    }
  </div>`;
}

// Il piano del reparto costa una decina di ottimizzazioni complete: si prepara su richiesta
// e vale finche' non cambia nulla.
let reparto = null;
let repartoInCorso = false;

function buildReparto(rerender) {
  repartoInCorso = true;
  setTimeout(() => {
    try {
      const args = { players: state.players, settings: state.settings, owned: ownedMap(), unavailable: unavailableSet(), obbligati: obbligatiSet() };
      const piano = pianoDiReparto({ ...args, plan: state.plan });
      reparto = piano
        ? {
            ...piano,
            chiave: cacheKey(),
            portiere: piano.fase === 'P' ? abbinamentoPortiere({ ...args, plan: state.plan }) : null,
          }
        : null;
    } catch (err) {
      console.error(err);
      reparto = null;
    } finally {
      repartoInCorso = false;
      rerender();
    }
  }, 30);
}

/**
 * Il piano d'azione del reparto in corso.
 *
 * Durante la chiamata non c'e' tempo di ricalcolare niente: il ramo deve essere gia' deciso.
 * Per ogni obiettivo il tetto oltre il quale si lascia perdere e i due ripieghi in ordine, e
 * in fondo lo scenario in cui saltano tutti, con la destinazione dei crediti che si liberano.
 */
function repartoCard() {
  if (!state.plan?.ok) return '';
  if (repartoInCorso) {
    return `<div class="card"><h2>Piano del reparto</h2><div class="small muted"><span class="spinner"></span> Preparo obiettivi, tetti e ripieghi…</div></div>`;
  }
  if (!reparto || reparto.chiave !== cacheKey()) {
    const fase = budgetDiFase({ settings: state.settings, players: state.players, owned: ownedMap(), plan: state.plan });
    return `
    <div class="card">
      <h2>Piano del reparto</h2>
      <p class="small muted" style="margin-top:0">
        Si gioca sui <b>${esc(fase.etichetta.toLowerCase())}</b>. Preparo obiettivi, tetto massimo su ciascuno,
        ripieghi in ordine e cosa fare se saltano tutti.
      </p>
      <button class="btn primary block" data-action="reparto">Prepara il piano dei ${esc(fase.etichetta.toLowerCase())}</button>
    </div>`;
  }

  const r = reparto;
  return `
  <div class="card">
    <div class="row between" style="margin-bottom:4px">
      <h2 style="margin:0">Piano · ${esc(r.etichetta)}</h2>
      <button class="btn ghost small" data-action="reparto">Rifai</button>
    </div>
    <div class="tiny muted" style="margin-bottom:12px">
      ${r.budget.perLaFase} crediti per il reparto · ${r.budget.slotMancanti} slot da riempire ·
      ${r.budget.riservatoDopo} riservati ai reparti dopo
    </div>

    ${r.obiettivi
      .map(
        (o, i) => `
      <div style="padding:10px 0;${i ? 'border-top:1px solid var(--line)' : ''}">
        <div class="row between">
          <div class="grow" data-action="select" data-id="${esc(o.player.id)}">
            <div><b>${i + 1}. ${esc(o.player.name)}</b> ${edgeBadge(o.player)}</div>
            <div class="tiny muted">${esc(o.player.team || '—')}${o.player.tier ? ' · ' + esc(o.player.tier) : ''} · a piano ${o.prezzoPiano}</div>
          </div>
          <div class="mono" style="text-align:right">
            <b style="font-size:19px;color:var(--${o.sostituibile ? 'muted' : 'accent'})">${o.massimo}</b>
            <div class="tiny muted">non oltre</div>
          </div>
        </div>
        ${o.sostituibile ? `<div class="tiny muted" style="margin-top:4px">Sostituibile: sopra ${o.massimo} conviene chiunque altro, non insistere.</div>` : ''}
        ${
          o.ripieghi.length
            ? `<div class="tiny muted" style="margin-top:6px">se salta → ${o.ripieghi
                .map((x) => `<b style="color:var(--text)">${esc(x.player.name)}</b> ${x.price}`)
                .join(' , poi ')}</div>`
            : ''
        }
      </div>`
      )
      .join('')}

    ${
      r.portiere && !r.portiere.fatto && r.portiere.coppia
        ? `<div class="verdict edge" style="margin-top:12px;text-align:left">
             <div>Abbinamento: prendi anche ${esc(r.portiere.coppia.name)}.</div>
             <div class="small" style="font-weight:500;margin-top:4px">
               E' il secondo portiere ${esc(r.portiere.titolare.team || '')}, la stessa porta di ${esc(r.portiere.titolare.name)}.
               In Classic ne schieri uno solo: averli entrambi significa non restare mai senza voto,
               e con l'imbattibilita' il clean sheet arriva comunque da quella difesa.
             </div>
           </div>`
        : r.portiere && r.portiere.fatto
          ? `<div class="tiny muted" style="margin-top:12px">Abbinamento portieri a posto: hai due porte della stessa squadra.</div>`
          : ''
    }

    ${
      r.senzaNessuno
        ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
             <div class="tiny muted" style="margin-bottom:4px">se li perdi tutti</div>
             <div class="small">
               Vai su <b>${r.senzaNessuno.picks.map((x) => esc(x.name) + ' (' + x.plannedPrice + ')').join(', ')}</b>
               ${
                 r.senzaNessuno.liberati > 5
                   ? `e sposti ${r.senzaNessuno.liberati} crediti ${
                       r.senzaNessuno.destinazione.length
                         ? 'su ' + elenco(r.senzaNessuno.destinazione.map((d) => `${ROLE_LABEL[d.role].toLowerCase()} (+${d.delta})`))
                         : 'sugli altri reparti'
                     }`
                   : ''
               }.
             </div>
             <div class="tiny muted" style="margin-top:6px">costo del cambio di piano: ${r.senzaNessuno.costo} punti</div>
           </div>`
        : ''
    }
  </div>`;
}

function targetsCard() {
  const plan = state.plan;
  if (!plan?.ok) return '';
  const pending = plan.picks.filter((p) => !state.auction.owned[p.id] && !state.auction.taken[p.id]);
  if (!pending.length) return '';
  const fase = budgetDiFase({ settings: state.settings, players: state.players, owned: ownedMap(), plan });
  const adesso = pending.filter((p) => p.role === fase.fase).sort((a, b) => b.plannedPrice - a.plannedPrice);
  const dopo = ROLES.filter((r) => r !== fase.fase).flatMap((r) =>
    pending.filter((p) => p.role === r).sort((a, b) => b.plannedPrice - a.plannedPrice)
  );

  const riga = (p) => `<li>
    ${roleChip(p.role)}
    <div class="grow" data-action="select" data-id="${esc(p.id)}">
      <div class="nm">${esc(p.name)}</div>
      <div class="sub">${esc(p.team || '—')}${p.tier ? ' · ' + esc(p.tier) : ''}</div>
    </div>
    <div class="pr mono" data-action="select" data-id="${esc(p.id)}">${p.plannedPrice}<small>a piano</small></div>
    <button class="btn danger" style="min-width:46px;padding:10px" data-action="quick-gone" data-id="${esc(p.id)}" aria-label="Preso da un avversario">✕</button>
  </li>`;

  return `
  <div class="card">
    <div class="row between" style="margin-bottom:8px">
      <h2 style="margin:0">Obiettivi · ${esc(fase.etichetta.toLowerCase())}</h2>
      <span class="tiny muted">${adesso.length}</span>
    </div>
    ${
      adesso.length
        ? `<div class="tiny muted" style="margin-bottom:10px">
             Tocca <b>✕</b> quando uno di questi va a un avversario: un solo tocco, senza prezzo.
           </div>
           <div class="listwrap"><ul class="plist">${adesso.map(riga).join('')}</ul></div>`
        : `<div class="small muted" style="padding:6px 0">Nessun obiettivo scoperto in questo reparto.</div>`
    }
    ${
      dopo.length
        ? `<details style="margin-top:12px">
             <summary class="small muted">Gli obiettivi dei reparti dopo (${dopo.length})</summary>
             <div class="listwrap" style="margin-top:8px"><ul class="plist">${dopo.map(riga).join('')}</ul></div>
           </details>`
        : ''
    }
  </div>`;
}

/**
 * Chi sta per essere chiamato.
 *
 * Digitare mentre il banditore urla un nome e' il vero attrito di questa schermata, e quasi
 * sempre e' inutile: in un'asta per reparto si chiamano i piu' cari del ruolo in corso, che
 * l'app conosce gia'. La ricerca resta li' per le sorprese.
 */
function prossimeChiamate() {
  if (!state.plan?.ok) return '';
  const owned = ownedMap();
  const fase = budgetDiFase({ settings: state.settings, players: state.players, owned, plan: state.plan });
  const obiettivi = new Set((state.plan.picks || []).map((p) => p.id));
  // Il filtro in alto vale anche qui: se scelgo un ruolo voglio vedere quello, non la fase.
  const ruolo = state.ui.roleFilter === 'ALL' ? fase.fase : state.ui.roleFilter;
  const lista = state.players
    .filter(
      (p) =>
        p.role === ruolo &&
        state.auction.owned[p.id] === undefined &&
        state.auction.taken[p.id] === undefined
    )
    .sort((a, b) => (b.expectedPrice ?? 0) - (a.expectedPrice ?? 0))
    .slice(0, 6);
  if (!lista.length) return '';
  return `
  <div style="margin-top:12px">
    <div class="tiny muted" style="margin-bottom:6px">${

      state.ui.bidPrice = null;
      state.ui.chiediSquadra = null;
      rerender();
      return true;
    case 'close-detail':

      state.ui.bidPrice = null;
      state.ui.chiediSquadra = null;
      rerender();
      return true;
    case 'rolefilter':

      return true;

    case 'bid-plus': {

      rerender();
      return true;

      const p = playerById(id);

      if (price > spendable) {

      assign(id, 'mine', price);
      invalidate();
      state.ui.selectedId = null;
      state.ui.bidPrice = null;
      state.ui.query = '';

      rerender();
      return true;
    }
    case 'take-other': {
      // Il prezzo lo prendo adesso, perche' il campo sparisce quando chiedo la squadra.
      state.ui.prezzoAltri = Number(document.getElementById('bidprice')?.value) || 0;
      state.ui.chiediSquadra = id;
      rerender();
      return true;
    }
    case 'assign-to': {
      const idx = target.dataset.idx === '' ? null : Number(target.dataset.idx);
      const p = playerById(id);
      const prezzo = state.ui.prezzoAltri ?? 0;
      assign(id, 'other', prezzo, idx);
      invalidate();
      state.ui.chiediSquadra = null;
      state.ui.prezzoAltri = null;
      state.ui.selectedId = null;
      state.ui.bidPrice = null;
      state.ui.query = '';
      const nome = idx ? nomiSquadre(state.settings)[idx] : 'un avversario';
      toast(`${p?.name} a ${nome}${prezzo ? ' per ' + prezzo : ''}.`);
      rerender();
      return true;

    case 'reparto':

      return true;
    case 'blocca':
    case 'scarta':
    case 'libera': {

      invalidate();

        // prima di rilanciare invece di scoprirlo guardando il piano.
        const costo = prima?.ok && state.plan?.ok ? Math.round(prima.score - state.plan.score) : 0;
        const nome = playerById(id)?.name || '';
        toast(
          action === 'libera'
            ? 'Decide di nuovo il piano.'
            : action === 'blocca'
              ? `Il piano si costruisce attorno a ${nome}${costo > 0 ? `: ti costa ${costo} punti` : ''}.`
              : `${nome} scartato${costo > 0 ? `: ti costa ${costo} punti` : ', senza perdite'}.`

      return true;

    case 'chiudi-mossa':
      mossaChiusa = state.auction.log.length;
      rerender();
      return true;
    case 'chiudi-chi':
      chiediChiuso = state.auction.log.length;
      rerender();
      return true;
    case 'goto':
      state.ui.tab = target.dataset.tab;
      rerender();
      return true;
    case 'attribuisci': {
      const idx = Number(target.dataset.idx);
      const p = playerById(id);
      if (attribuisci(id, idx)) toast(`${p?.name} a ${nomiSquadre(state.settings)[idx]}.`);
      rerender();
      return true;
    }
    case 'quick-gone': {
      const p = playerById(id);
      // La corsia veloce: un tocco, nessuna domanda. Il prezzo resta ignoto e il conto dei
      // crediti lo imputa dalla stima, dichiarando la copertura. Serve a non perdere un
      // rilancio per stare a digitare: gli slot residui restano comunque esatti.
      assign(id, 'other', 0, null);
      invalidate();
      toast(`${p?.name} va via.`);
      rerender();
      return true;
    }
    case 'release':
      release(id);
      invalidate();
      rerender();
      return true;
    case 'undo':
      undo();
      invalidate();
      state.ui.selectedId = null;
      rerender();
      return true;
    default:
      return false;
  }
}

function onInput(action, target, rerender) {
  if (action === 'query') {
    state.ui.query = target.value;
    rerender({ keepFocus: 'astaQuery' });
    return true;
  }
  if (action === 'bid-input') {
    state.ui.bidPrice = Number(target.value) || 0;
    rerender({ keepFocus: 'bidprice' });
    return true;
  }
  return false;
}

return { invalidate, render, onAction, onInput };
})();

//

// attaccanti da trenta" — e quell'idea o regge o muore a seconda di chi riesci a prendere.

// un nome o se e' saltata la strada.

// Qui le strade si rendono esplicite: se ne generano alcune davvero diverse, si salvano, e a
// ogni assegnazione si guarda quali sono ancora percorribili. La domanda smette di essere
// "chi prendo al posto di Svilar" e diventa "quale delle mie strade e' ancora viva".
//
// Il motore c'era gia' e buttava via il lavoro: le ripartenze dell'ottimizzatore rifanno il

// solo la migliore. Qui si tengono tutte.

// perche' le scelte piu' care sono anche quelle che cambiano di piu' il resto della rosa.

// strada con un riempitivo scambiato.
const DIVERSITA_MINIMA = 2;

// Quanto punteggio si perde per scendere di una stella. Sui listoni veri due piani sensati
// distano il 2-3%: con una scala piu' larga finirebbero tutti a cinque stelle e il voto non
// direbbe niente.
const PERDITA_PER_STELLA = 0.02;

/** Firma di una rosa: l'insieme dei suoi giocatori, per riconoscere i doppioni. */
function firma(piano) {
  return [...piano.picks, ...piano.owned].map((p) => p.id).sort().join('|');
}

/** Quanti giocatori distinguono due rose. */
function distanza(a, b) {
  const setB = new Set(b);
  let n = 0;
  for (const id of a) if (!setB.has(id)) n++;

}

/**
 * Il voto in stelle, da 1 a 5 a mezze stelle.
 *
 * Non e' un voto assoluto — una rosa "forte" in senso assoluto non esiste, dipende da quanto
 * e' ricco il listone e da quanto e' rimasto sul mercato. E' quanto questa rosa vale rispetto
 * alla migliore ancora ottenibile adesso: cinque stelle vuol dire "meglio di cosi' non si
 * puo' fare oggi". E' anche il motivo per cui il voto di una strada salvata scende da solo
 * mentre l'asta va avanti e i suoi giocatori se ne vanno.

  const perdita = Math.max(0, (riferimento - score) / riferimento);

 * Il nome della strada: cosa ha questa rosa che le altre non hanno.

 * sue sorelle: tre strade chiamate tutte "Con Lautaro" sarebbero tre nomi e nessuna
 * informazione.

  const nuovi = piano.picks
