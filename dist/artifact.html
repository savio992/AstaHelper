    .sort((a, b) => b.plannedPrice - a.plannedPrice);

    const nome = `Con ${p.name}`;
    if (!presi.has(nome)) return nome;

  const migliore = base?.ok ? base : optimizeRoster({ ...ctx, unavailable });
  if (!migliore.ok) return { base: migliore, scenari: [] };

  const perni = migliore.picks
    .filter((p) => !obbligati.has(p.id))
    .sort((a, b) => b.plannedPrice - a.plannedPrice)
    .slice(0, PERNI);

  const voce = (piano, perno) => ({
    perno,
    piano,
    score: piano.score,
    costo: piano.cost,
    ids: [...piano.picks, ...piano.owned].map((p) => p.id),
    // I prezzi previsti si salvano con la strada: sono il metro con cui, piu' avanti, si
    // misura quanto e' grave un giocatore perso. Perdere il perno da quarantaquattro crediti
    // e perdere cinque riempitivi da uno non e' la stessa cosa, e a contare le teste sembra.
    prezzi: Object.fromEntries([...piano.picks, ...piano.owned].map((p) => [p.id, p.plannedPrice ?? p.paid ?? 1])),
  });

  const viste = new Set([firma(migliore)]);
  const attuale = voce(migliore, null);
  attuale.attuale = true;
  const trovati = [];

    const senza = new Set(unavailable);
    senza.add(perno.id);
    const alt = optimizeRoster({ ...ctx, unavailable: senza });
    if (!alt.ok) continue;
    const f = firma(alt);
    if (viste.has(f)) continue;
    viste.add(f);

  // un riempitivo occuperebbe un posto senza offrire una scelta.

const chiaveValutazioni = () => `${state.revisione}|${state.scenari.map((s) => s.id).join(',')}`;
let valutando = false;
let apertaId = null;

onReset(() => invalidate());

function invalidate() {
  generate = null;
  generando = false;
  valutazioni = { rev: null, voci: [] };
  apertaId = null;
}

function contesto() {
  return {
    players: state.players,
    settings: state.settings,
    owned: ownedMap(),
    unavailable: unavailableSet(),
    obbligati: obbligatiSet(),
  };
}

function costruisci(rerender) {
  generando = true;
  setTimeout(() => {
    try {
      generate = generaScenari({ ...contesto(), base: state.plan, quante: 4 });
    } catch (err) {
      console.error(err);
      generate = null;
    } finally {
      generando = false;
      rerender();
    }
  }, 30);
}

function valuta(rerender) {
  const rev = chiaveValutazioni();
  valutando = true;
  setTimeout(() => {
    try {
      const ctx = contesto();
      // Il termine di paragone e' lo stesso per tutte: altrimenti le stelle di due strade non
      // sarebbero confrontabili, che e' l'unica cosa per cui servono.
      const riferimento = state.plan;
      valutazioni = {
        rev,
        voci: state.scenari.map((s) => ({ scenario: s, esito: valutaScenario({ scenario: s, ...ctx, riferimento }) })),
      };
    } catch (err) {
      console.error(err);
      valutazioni = { rev, voci: [] };
    } finally {
      valutando = false;
      rerender();
    }
  }, 30);
}

/** Le stelle disegnate, con la mezza. */
function stelline(v) {
  if (!(v > 0)) return '<span class="muted">—</span>';
  const piene = Math.floor(v);
  const mezza = v - piene >= 0.5;
  return `<span class="stelle" title="${v} su 5">${'★'.repeat(piene)}${mezza ? '½' : ''}${'☆'.repeat(5 - piene - (mezza ? 1 : 0))}</span>`;
}

const CLASSE_STATO = { viva: 'plan', completata: 'mine', ferita: 'warn', morta: 'gone' };
const ETICHETTA_STATO = { viva: 'Intatta', completata: 'Completata', ferita: 'Colpita', morta: 'Chiusa' };

function testa(piano, quanti = 4) {
  return piano.picks
    .slice()
    .sort((a, b) => b.plannedPrice - a.plannedPrice)
    .slice(0, quanti)
    .map((p) => `${roleChip(p.role)} ${esc(p.name)} <b class="mono">${p.plannedPrice}</b>`)
    .join(' · ');
}

function generateCard() {
  if (generando) {
    return `<div class="card"><h2>Genera le strade</h2>
      <div class="small muted"><span class="spinner"></span> Cerco rose diverse fra loro…</div></div>`;
  }
  if (!generate) {
    return `<div class="card">
      <h2>Genera le strade</h2>
      <div class="small muted" style="margin-bottom:10px">

  }
  if (!generate.scenari.length) {
    return `<div class="card"><h2>Genera le strade</h2>
      <div class="small">Non riesco a costruire nemmeno una rosa: ${esc(generate.base?.reason || 'il budget non basta.')}</div></div>`;
  }

  const salvati = new Set(state.scenari.map((s) => s.ids.join('|')));
  return `
  <div class="card">
    <div class="row between" style="align-items:center;margin-bottom:8px">
      <h2 style="margin:0">Le strade</h2>
      <button class="btn ghost" style="padding:2px 10px" data-action="genera-strade">Rigenera</button>
    </div>
    ${
      generate.migliorabile
        ? `<div class="verdict edge" style="text-align:left;margin-bottom:10px">
             <div class="small" style="font-weight:600">Cercando le strade ne ho trovata una migliore del piano attuale.</div>
             <div class="small" style="font-weight:500;margin-top:4px">
               Il piano si ferma a una ripartenza sola per restare veloce; qui ne provo sei e ogni tanto salta fuori
               una rosa che vale di piu'. Se ti convince, seguila: il piano si rifa' intorno a lei.
             </div>
           </div>`
        : ''
    }
    <ul class="strade">
      ${generate.scenari
        .map(
          (s, i) => `
        <li>
          <div class="row between" style="align-items:baseline">
            <div><b>${esc(s.nome)}</b> ${s.attuale ? '<span class="chip plan">piano attuale</span>' : ''}</div>
            <div>${stelline(s.stelle)}</div>

          <div class="tiny" style="margin:4px 0 6px;line-height:1.7">${testa(s.piano)}</div>

            ${
              salvati.has(s.ids.join('|'))
                ? '<span class="tiny muted">gia\' salvata</span>'
                : `<button class="btn ghost" style="padding:2px 10px" data-action="salva-strada" data-i="${i}">Salva</button>`
            }
          </div>

        .join('')}

function salvateCard() {
  if (!state.scenari.length) return '';
  const fresche = valutazioni.rev === chiaveValutazioni();
  const perId = new Map(valutazioni.voci.map((v) => [v.scenario.id, v.esito]));
  const seguendo = Object.keys(state.auction.bloccati || {}).length;

  return `
  <div class="card ${fresche ? '' : 'stantio'}">
    <div class="row between" style="align-items:center;margin-bottom:4px">

    <div class="small muted" style="margin-bottom:10px">

          </div>
          ${
            e
              ? `<div class="row" style="gap:6px;align-items:center;margin:6px 0 4px">
                   <span class="chip ${CLASSE_STATO[e.stato] || ''}">${ETICHETTA_STATO[e.stato] || e.stato}</span>
                   <span class="tiny muted">${e.presi.length}/${s.ids.length} presi${
                     e.costo !== null ? ` · ancora ${e.daSpendere} crediti` : ''
                   }</span>
                 </div>
                 <div class="tiny" style="line-height:1.65">${esc(descriviScenario(e))}</div>
                 ${e.mancanti.length ? `<div class="tiny muted" style="margin-top:4px">${e.mancanti.length} giocatori non sono piu' nel listone.</div>` : ''}`
              : '<div class="tiny muted" style="margin:6px 0">Calcolo…</div>'
          }
          <div class="row" style="gap:8px;margin-top:8px">
            <button class="btn ghost grow" style="padding:2px 10px" data-action="apri-strada" data-id="${esc(s.id)}">${aperta ? 'Nascondi' : 'Vedi la rosa'}</button>
            <button class="btn ghost" style="padding:2px 10px" data-action="segui-strada" data-id="${esc(s.id)}"
              ${e && e.stato === 'morta' ? 'disabled' : ''}>Segui</button>
            <button class="btn ghost" style="padding:2px 10px" data-action="elimina-strada" data-id="${esc(s.id)}" aria-label="Elimina">✕</button>
          </div>
          ${aperta && e?.piano?.ok ? dettaglio(s, e) : ''}
        </li>`;
        })
        .join('')}
    </ul>
    ${
      seguendo
        ? `<button class="btn ghost block" style="margin-top:10px" data-action="abbandona-strada">
             Abbandona la strada (${seguendo} lucchetti)
           </button>`
        : ''
    }
  </div>`;
}

function dettaglio(scenario, esito) {
  const per = (lista, etichetta, classe) =>
    lista.length
      ? `<div class="tiny" style="margin-top:6px"><span class="${classe}">${etichetta}</span> ${lista
          .map((p) => `${esc(p.name)} <span class="muted mono">${p.previsto ?? Math.round(p.plannedPrice ?? p.expectedPrice ?? 0)}</span>`)
          .join(' · ')}</div>`
      : '';
  return `
  <div class="dettaglio-strada">
    ${per(esito.presi, 'Presi:', 'pos')}
    ${per(esito.liberi, 'Ancora liberi:', '')}
    ${per(esito.persi, 'Persi:', 'neg')}
    ${per(esito.entrati, 'Al loro posto:', '')}
  </div>`;
}

function render() {
  if (!state.players.length) return '';
  // Le valutazioni si rifanno da sole quando il piano cambia: e' l'unico modo perche' le
  // stelle di una strada salvata scendano mentre l'asta va avanti, che e' tutto il punto.
  return `${generateCard()}${salvateCard()}`;
}

/** Va chiamata dopo aver disegnato, per far ripartire i calcoli in ritardo. */
function dopoIlDisegno(rerender) {
  if (state.scenari.length && valutazioni.rev !== chiaveValutazioni() && !valutando) valuta(rerender);
}

function onAction(action, target, ev, rerender) {
  if (action === 'genera-strade') {
    generate = null;
    costruisci(rerender);
    rerender();
    return true;
  }
  if (action === 'salva-strada') {
    const s = generate?.scenari?.[Number(target.dataset.i)];
    if (!s) return true;
    salvaScenario({ nome: s.nome, ids: s.ids, prezzi: s.prezzi, score: s.score });
    toast(`Strada salvata: ${s.nome}`);
    rerender();
    return true;
  }
  if (action === 'apri-strada') {
    apertaId = apertaId === target.dataset.id ? null : target.dataset.id;
    rerender();
    return true;
  }
  if (action === 'segui-strada') {
    const s = state.scenari.find((x) => x.id === target.dataset.id);
    if (!s) return true;
    const ok = adottaScenario(s.id, nucleoScenario(s));
    toast(ok ? `Seguo ${s.nome}: il piano si rifa' intorno a lei.` : 'Con questi lucchetti la rosa non si chiude piu\'.');
    rerender();
    return true;
  }
  if (action === 'elimina-strada') {
    eliminaScenario(target.dataset.id);
    if (apertaId === target.dataset.id) apertaId = null;
    rerender();
    return true;
  }
  if (action === 'abbandona-strada') {
    abbandonaStrada();
    toast('Lucchetti tolti: decide di nuovo il solutore.');
    rerender();
    return true;
  }
  return false;
}

function onInput(action, target, rerender) {
  if (action === 'rinomina-strada') {
    rinominaScenario(target.dataset.id, target.value);
    return true;
  }
  return false;
}

return { invalidate, render, dopoIlDisegno, onAction, onInput };
})();

          alts: alternatives({ ...args, playerId: p.id, limit: 3 }).alternatives,
        }));
    } catch (err) {
      console.error(err);
      scheda = [];
    } finally {
      schedaInCorso = false;
      rerender();
    }
  }, 30);
}

// Il confronto con la rosa automatica costa due ottimizzazioni: si calcola su richiesta.
let confronto = null;
let confrontoInCorso = false;

function buildConfronto(rerender) {
  confrontoInCorso = true;
  setTimeout(() => {
    try {
      confronto = costoDellaLista({

        unavailable: unavailableSet(),

}

function confrontoCard() {
  const lista = obbligatiSet();
  if (!lista.size) return '';
  if (confrontoInCorso) {
    return `<div class="small muted" style="margin-top:12px"><span class="spinner"></span> Confronto con la rosa automatica…</div>`;
  }
  if (!confronto) {
    return `<button class="btn ghost block" style="margin-top:12px" data-action="confronta">Quanto mi costa scegliere io?</button>`;

  <div class="verdict ${d > 0 ? 'edge' : 'go'}" style="margin-top:12px;text-align:left">

          ? `La tua lista vale ${d} punti in meno della rosa che costruirei io (−${confronto.percentuale}%).`
          : d < -0.5
            ? `La tua lista vale ${-d} punti in piu' della mia.`
            : `La tua lista vale quanto la rosa che costruirei io.`
      }
    </div>
    <div class="small" style="font-weight:500;margin-top:4px">

      (confronto.perRuolo || []).filter((r) => Math.abs(r.differenza) >= 1).length
        ? `<div class="tiny" style="margin-top:10px;line-height:1.7">
             ${confronto.perRuolo
               .filter((r) => Math.abs(r.differenza) >= 1)
               .map(
                 (r) =>
                   `${esc(ROLE_LABEL[r.role])}: <b>${r.differenza > 0 ? '−' : '+'}${Math.abs(r.differenza)}</b> punti` +

        : ''

}

function render(rerender) {
  if (!state.players.length) {
    return `<div class="view">${emptyState('📋', 'Nessun listone caricato', 'Importa prima il CSV delle fasce.')}</div>`;
  }
  if (!state.plan) rebuildPlan();
  const plan = state.plan;

  if (!plan?.ok) {
    return `<div class="view">
      <div class="card">
        <h3>Piano non calcolabile</h3>

  }

  const budget = state.settings.budget || 500;
  const filled = plan.owned.length;

  // diventata DOM: qui si dice solo che servono.
  if (rerender) strade.dopoIlDisegno(rerender);
  return `
  <div class="view">
    ${modalitaCard()}
    ${state.settings.modalita === 'mia' ? listaCard(plan) : ''}
    ${modificaCard()}
    <div class="card">
      <div class="row between">
        <div>
          <div class="credits mono" style="font-size:26px;font-weight:800">${plan.cost}<small style="font-size:11px;color:var(--muted)">crediti impegnati su ${budget}</small></div>
        </div>
        <button class="btn" data-action="replan">Rigenera</button>
      </div>
      <div class="bar" style="margin-top:12px"><i style="width:${Math.min(100, (plan.cost / budget) * 100)}%"></i></div>
      <div class="row between small muted" style="margin-top:8px">
        <span>${filled} presi · ${plan.picks.length} da prendere</span>
        <span>avanzo ${plan.leftover} cr</span>
      </div>
      <div class="grid4" style="margin-top:12px">
        ${ROLES.map(
          (r) => `<div class="slotbar"><div><b class="mono">${plan.spentByRole[r]}</b><span>${r}</span></div></div>`
        ).join('')}
      </div>
    </div>

    ${strade.render()}
    ${panchinaCard()}
    ${schedaCard()}
    ${ROLES.map((r) => roleBlock(r, plan)).join('')}
    ${tiersCard(plan)}
    ${scartatiCard()}
    ${exposureCard(plan)}

    <div class="card">
      <div class="small muted">
        Il piano tiene conto di chi hai gia' preso, di chi e' stato preso dagli altri e dei crediti che ti restano.
        Si aggiorna da solo dopo ogni assegnazione durante l'asta.
        Con <b>🔓</b> imponi un giocatore e il resto si ricalcola attorno a lui; con <b>✕</b> lo togli di mezzo.
      </div>
    </div>
  </div>`;
}

function onAction(action, target, ev, rerender) {
  if (strade.onAction(action, target, ev, rerender)) return true;
  if (action === 'blocca' || action === 'scarta' || action === 'libera') {
    const id = target.dataset.id;
    confronto = null;
    const ok = action === 'blocca' ? blocca(id) : action === 'scarta' ? scarta(id) : liberaScelta(id);
    if (ok === false) toast('Con questo scarto la rosa non si chiude piu\'.');
    scheda = null;
    modificaChiusa = null;
    rerender();
    return true;
  }
  if (action === 'chiudi-modifica') {
    modificaChiusa = state.ultimaModifica?.at ?? null;
    rerender();
    return true;
  }
  if (action === 'modalita') {
    updateSettings({ modalita: target.dataset.v });
    confronto = null;
    rerender();
    return true;
  }
  if (action === 'confronta') {
    confronto = null;
    buildConfronto(rerender);
    rerender();
    return true;
  }
  if (action === 'replan') {
    rebuildPlan();
    scheda = null;
    rerender();
    return true;
  }
  if (action === 'scheda') {
    scheda = null;
    buildScheda(rerender);
    rerender();
    return true;
  }
  return false;
}

function onInput(action, target, rerender) {
  if (strade.onInput(action, target, rerender)) return true;
  if (action === 'listaquery') {
    state.ui.listaQuery = target.value;
    rerender({ keepFocus: 'listaQuery' });
    return true;
  }
  return false;
}

return { render, onAction, onInput };
})();

// ===== src/domain/incolla.js =====
const __m_src_domain_incolla_js = (() => {
// Registrare a mano duecento aggiudicazioni durante un'asta non e' realistico. Se la piattaforma
// dove si gioca mostra l'elenco di chi e' gia' stato venduto, incollarlo qui e' molto piu' veloce
// che segnare un giocatore alla volta: il conto dei crediti torna esatto in un colpo.
//
// Il formato non si puo' sapere in anticipo, quindi il lettore non ne pretende nessuno: cerca in
// ogni riga un nome che assomigli a qualcuno del listone e, se c'e', un prezzo. Tutto il resto
// (numeri di riga, ruoli, sigle di squadra, separatori) viene ignorato.

const { ROLES } = __m_src_domain_model_js;

/** Toglie accenti, punteggiatura e maiuscole: due scritture dello stesso nome devono coincidere. */
function chiave(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9 ]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/** Il cognome, cioe' la prima parola: i listoni scrivono "Martinez L." dove altrove sta "Lautaro Martinez". */
function cognome(nome) {
  const k = chiave(nome);
  const parti = k.split(' ').filter((w) => w.length > 1);
  return parti[0] || k;
}

const RUOLI_PAROLA = /^(p|por|portiere|d|dif|difensore|c|cen|centrocampista|a|att|attaccante)$/;

/**
 * Indice di ricerca sul listone.
 * Un cognome puo' appartenere a piu' giocatori: in quel caso serve la squadra per decidere, e
 * senza squadra la riga resta ambigua invece di essere assegnata a caso.
 */
function indice(players) {
  const perNome = new Map();
  const perCognome = new Map();
  for (const p of players) {
    const n = chiave(p.name);
    if (!perNome.has(n)) perNome.set(n, []);
    perNome.get(n).push(p);
    const c = cognome(p.name);
    if (!perCognome.has(c)) perCognome.set(c, []);
    perCognome.get(c).push(p);
  }
  return { perNome, perCognome, players };
}

/**
 * Legge una riga: il prezzo e' l'ultimo numero intero della riga, il nome e' quello che resta
 * una volta tolti numeri, sigle di ruolo e separatori.
 */
function leggiRiga(riga) {
  const grezza = String(riga);
  // La riga compattata serve solo a cercare la squadra; per separare i campi si usa quella
  // originale, perche' schiacciare le tabulazioni in spazi cancella proprio il separatore.
  const testo = grezza.replace(/\s+/g, ' ').trim();
  if (!testo) return null;

  // Un prezzo credibile: intero, non attaccato a lettere, non una data.
  const numeri = [...testo.matchAll(/(?<![\w.,])(\d{1,3})(?![\w.,%])/g)].map((m) => Number(m[1]));
  const prezzo = numeri.length ? numeri[numeri.length - 1] : null;

  // Le parentesi separano quasi sempre la squadra dal nome: vanno trattate come un separatore.
  const parole = grezza
    .split(/[;,|\t()\[\]]|\s[-–—]\s|\s{2,}/)
    .map((x) => x.trim())
    .filter(Boolean);

  // Il pezzo con piu' lettere e' quasi sempre il nome.
  const candidati = parole
    .map((x) => x.replace(/(?<![\w.,])\d{1,3}(?![\w.,%])/g, '').trim())
    .filter((x) => chiave(x).replace(/ /g, '').length >= 3 && !RUOLI_PAROLA.test(chiave(x)));
  if (!candidati.length) return null;
  candidati.sort((a, b) => chiave(b).replace(/ /g, '').length - chiave(a).replace(/ /g, '').length);

  return { testo, nome: candidati[0], altri: candidati.slice(1), prezzo };
}

/**
 * Abbina una riga letta a un giocatore del listone.
 * Ritorna sempre un esito, anche negativo: chi incolla deve poter vedere cosa non e' passato,
 * non ritrovarsi con meta' elenco sparito in silenzio.
 */
function abbina(letta, idx, { escludi = new Set() } = {}) {
  const n = chiave(letta.nome);
  const diretti = (idx.perNome.get(n) || []).filter((p) => !escludi.has(p.id));
  if (diretti.length === 1) return { esito: 'trovato', player: diretti[0], ...letta };
  if (diretti.length > 1) {
    const perSquadra = filtraPerSquadra(diretti, letta);
    if (perSquadra.length === 1) return { esito: 'trovato', player: perSquadra[0], ...letta };
    return { esito: 'ambiguo', candidati: diretti, ...letta };
  }

  const perCognome = (idx.perCognome.get(cognome(letta.nome)) || []).filter((p) => !escludi.has(p.id));
  if (perCognome.length === 1) return { esito: 'trovato', player: perCognome[0], ...letta };
  if (perCognome.length > 1) {
    const perSquadra = filtraPerSquadra(perCognome, letta);
    if (perSquadra.length === 1) return { esito: 'trovato', player: perSquadra[0], ...letta };
    return { esito: 'ambiguo', candidati: perCognome, ...letta };
  }

  return { esito: 'sconosciuto', ...letta };
}

/**
 * Scioglie un'omonimia cercando la squadra nella riga.
 * Si guarda l'intera riga e non i soli pezzi avanzati, perche' spesso la squadra e' attaccata
 * al nome nella stessa cella ("Martinez L. INT") e ritagliarla in anticipo non e' affidabile.
 */
function filtraPerSquadra(candidati, letta) {
  const riga = chiave(letta.testo);
  const conSquadra = candidati.filter((p) => {
    const t = chiave(p.team);
    if (!t || t.length < 3) return false;
    return new RegExp(`(^| )${t}( |$)`).test(riga);
  });
  if (conSquadra.length) return conSquadra;
  // Ripiego sulle prime lettere: i listoni abbreviano ("INT" per Inter, "ROM" per Roma).
  return candidati.filter((p) => {
    const t = chiave(p.team);
    if (t.length < 3) return false;
    return new RegExp(`(^| )${t.slice(0, 3)}[a-z]*( |$)`).test(riga);
  });
}

/**
 * Legge un elenco incollato per intero.
 * `escludi` sono i giocatori gia' assegnati: una riga che ricade su uno di loro viene segnalata
 * come duplicato invece di riassegnarlo, cosi' incollare due volte non fa danni.
 */
function leggiElenco(testo, players, { gia = new Set() } = {}) {
  const idx = indice(players);
  const righe = String(testo || '').split(/\r?\n/);
  const esiti = [];
  const presi = new Set();

  for (const riga of righe) {
    const letta = leggiRiga(riga);
    if (!letta) continue;
    // L'abbinamento non esclude chi e' gia' preso: serve riconoscerlo per poterlo chiamare
    // duplicato. Escluderlo lo farebbe ricadere su un omonimo, o sparire come sconosciuto.
    const m = abbina(letta, idx);
    if (m.esito === 'trovato' && (gia.has(m.player.id) || presi.has(m.player.id))) {
      esiti.push({ ...m, esito: 'duplicato' });
      continue;
    }

const __m_src_domain_rose_js = (() => {
// Le rose esportate dalla piattaforma dove si gioca l'asta.
//
// E' il file che risolve il problema piu' grosso dell'assistente: il tabellone degli avversari
// deve sapere chi ha comprato chi e a quanto, e finche' quei due dati mancano puo' solo dare
// limiti superiori — "al massimo possono arrivare a 85" invece di "arrivano a 62". L'export li ha
// entrambi, si scarica anche a meta' asta, e contiene tutte le squadre della lega.
//
// Quindi qui non si ricostruisce un'asta finita: ci si riallinea durante, quando il banditore
// corre piu' di quanto si riesca a segnare.

const { parseCsv, normalizeHeader, parseNumber, normalizeRole, makePlayerId } = __m_src_domain_csv_js;
const { indice, abbina } = __m_src_domain_incolla_js;

// I nomi che le colonne possono avere. Il primo che combacia vince.
const COLONNE = {
  squadra: ['squadra', 'team', 'fantasquadra', 'squadra fantacalcio', 'proprietario', 'allenatore'],
  nome: ['nome', 'giocatore', 'calciatore', 'player'],
  club: ['squadra appartenenza', 'squadra serie a', 'club', 'squadra reale', 'sq'],
  ruolo: ['ruolo', 'r', 'ruolo classic'],
  prezzo: ['prezzo', 'costo', 'pagato', 'crediti', 'price'],
  quo: ['quotazione', 'quota', 'qt', 'qt a'],
};

/**
 * Quale colonna e' quale.
 *
 * `squadra` e `nome` si assomigliano parecchio ("Squadra" contro "Squadra_Appartenenza") e in
 * questo file convivono: si assegnano per corrispondenza esatta sul nome normalizzato, senza
 * ripieghi per sottostringa che le farebbero collidere.
 */
function mappaColonne(headers) {
  const norm = headers.map((h) => normalizeHeader(h));
  const usate = new Set();
  const out = {};
  for (const [campo, sinonimi] of Object.entries(COLONNE)) {
    for (const s of sinonimi) {
      const i = norm.findIndex((h, k) => h === s && !usate.has(k));
      if (i >= 0) {
        out[campo] = headers[i];
        usate.add(i);
        break;
      }
    }
  }
  return out;
}

/**
 * Legge l'export e abbina ogni riga al listone.
 *
 * L'abbinamento prova prima la strada esatta: l'id del listone e' costruito da nome, club e ruolo
 * (`makePlayerId`), e l'export ha tutti e tre. Quando combaciano non c'e' niente da indovinare.
 * Quando non combaciano — perche' una delle due parti abbrevia il club diversamente, o scrive
 * "Martinez L." dove l'altra scrive "Lautaro Martinez" — si ricade sul lettore dell'incolla, che
 * quella parte la sa gia' fare, e si usa il ruolo per sciogliere le omonimie che restano: e' il
 * dato in piu' che il testo incollato non aveva.
 */
function leggiRose(testo, players) {
  const { headers, rows } = parseCsv(testo);
  if (!rows.length) return { ok: false, motivo: 'Il file non contiene righe leggibili.' };

  const col = mappaColonne(headers);
  if (!col.squadra || !col.nome) {
    return {
      ok: false,
      motivo: `Non trovo le colonne della squadra e del giocatore. Le intestazioni lette sono: ${headers.join(', ')}.`,
      headers,
    };
  }

  const idx = indice(players);
  const byId = new Map(players.map((p) => [p.id, p]));
  const righe = [];
  const squadre = [];
  const visti = new Set();

  for (const r of rows) {
    const nome = String(r[col.nome] ?? '').trim();
    if (!nome) continue;
    const squadra = String(r[col.squadra] ?? '').trim();
    const club = col.club ? String(r[col.club] ?? '').trim() : '';
    const ruolo = col.ruolo ? normalizeRole(r[col.ruolo]) : null;
    const prezzo = col.prezzo ? parseNumber(r[col.prezzo]) : null;
    const quo = col.quo ? parseNumber(r[col.quo]) : null;

    if (squadra && !squadre.includes(squadra)) squadre.push(squadra);

    const base = { squadra, nome, club, ruolo, prezzo: Number.isFinite(prezzo) ? Math.max(0, Math.round(prezzo)) : null, quo };
    const player = trovaGiocatore({ nome, club, ruolo, quo }, byId, idx);
    if (!player) {
      righe.push({ ...base, esito: 'sconosciuto', player: null });
      continue;
    }
    if (player.ambigui) {
      righe.push({ ...base, esito: 'ambiguo', player: null, candidati: player.ambigui });
      continue;
    }
    // Lo stesso giocatore due volte nel file: la seconda riga si segnala invece di sovrascrivere
    // in silenzio, perche' vorrebbe dire che una delle due attribuzioni e' sbagliata.
    if (visti.has(player.id)) {
      righe.push({ ...base, esito: 'duplicato', player });
      continue;
    }
    visti.add(player.id);
    righe.push({ ...base, esito: 'trovato', player });
  }

  const conta = { trovato: 0, ambiguo: 0, sconosciuto: 0, duplicato: 0 };
  for (const r of righe) conta[r.esito] += 1;
  return { ok: true, righe, squadre, conta, colonne: col, headers };
}

function trovaGiocatore({ nome, club, ruolo, quo }, byId, idx) {
  // 1. La stessa ricetta con cui il listone costruisce i suoi id.
  if (club && ruolo) {
    const diretto = byId.get(makePlayerId(nome, club, ruolo));
    if (diretto) return diretto;
  }

  // 2. Il lettore dell'incolla: normalizza il nome, ripiega sul cognome, usa il club per le
  //    omonimie. Il club va dentro `testo` perche' e' li' che lo cerca.
  const m = abbina({ testo: `${nome} ${club}`.trim(), nome, altri: [], prezzo: null }, idx);
  if (m.esito === 'trovato') return m.player;
  if (m.esito !== 'ambiguo') return null;

  // 3. Quel che resta lo scioglie il ruolo, e se non basta la quotazione.
  let restano = m.candidati;
  if (ruolo) {
    const perRuolo = restano.filter((p) => p.role === ruolo);
    if (perRuolo.length === 1) return perRuolo[0];
    if (perRuolo.length) restano = perRuolo;
  }
  if (Number.isFinite(quo)) {
    const perQuo = restano.filter((p) => Number(p.quo) === Number(quo));
    if (perQuo.length === 1) return perQuo[0];
  }
  return { ambigui: restano };
}

return { mappaColonne, leggiRose };
})();

function strategiaCard() {
  const plan = state.plan;
  if (!plan?.ok) return '';
  const owned = ownedMap();
  const unavailable = unavailableSet();
  const consiglio = consiglioStrategico({ players: state.players, settings: state.settings, owned, unavailable, piano: plan });
  if (!consiglio) return '';

  const cambiamenti = state.prevPlan ? narrazione({ prima: state.prevPlan, dopo: plan, settings: state.settings }) : [];

  return `
  <div class="card">
    <h2>I big</h2>
    ${ROLES.map((r) => {
      const b = consiglio.big[r];
      const richiesti = Math.max(0, Math.round(state.settings.minTop?.[r] ?? 0));
      if (!b.miei && !b.liberi && !richiesti) return '';
      const restano = b.liberi === 1 ? 'ne resta 1 libero' : `ne restano ${b.liberi} liberi`;
      const frase = b.miei
        ? `Ne hai ${b.miei}${b.liberi ? `, e ${restano}` : ', e non ne restano altri'}.`
        : b.liberi
          ? `Non ne hai ancora, ${restano}${b.nomi?.length ? ': ' + b.nomi.slice(0, 3).join(', ') : ''}.`
          : `Finiti, e non ne hai preso nessuno.`;
      const colore = b.miei >= richiesti && richiesti > 0 ? 'accent' : !b.liberi && !b.miei ? 'danger' : 'text';
      return `
      <div style="padding:9px 0;border-top:1px solid var(--line)">
        <div>${roleChip(r)} <b class="small">${esc(ROLE_LABEL[r])}</b></div>
        <div class="small" style="color:var(--${colore});margin-top:3px">${esc(frase)}</div>
      </div>`;
    }).join('')}

    ${consiglio.avvisi
      .map(
        (a) => `<div class="verdict ${a.gravita === 'finiti' ? 'stop' : 'edge'}" style="margin-top:12px;text-align:left">
          <div>${esc(a.titolo)}</div>
          <div class="small" style="font-weight:500;margin-top:4px">${esc(a.testo)}</div>
        </div>`
      )
      .join('')}

    ${
      cambiamenti.length
        ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
             <div class="tiny muted" style="margin-bottom:4px">dopo l'ultima assegnazione</div>
             <div class="small">${cambiamenti.map((f) => esc(f)).join(' ')}</div>
           </div>`
        : ''
    }

    ${
      scenario
        ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
             <div class="row between" style="margin-bottom:6px">
               <b class="small">Se non prendi nessun big in ${esc(ROLE_REPARTO[scenario.role])}</b>
               <button class="btn ghost tiny" data-action="chiudi-scenario">chiudi</button>
             </div>
             <div class="small">${scenario.frasi.map((f) => esc(f)).join(' ') || 'Il piano non cambierebbe granche&#39;.'}</div>
             <div class="tiny muted" style="margin-top:6px">costo del cambio: ${scenario.costo} punti</div>
           </div>`
        : `<div class="segment" style="margin-top:12px">
             ${ROLES.filter((r) => consiglio.big[r].liberi > 0)
               .map((r) => `<button data-action="scenario" data-role="${r}">se perdo i big ${r}</button>`)
               .join('')}
           </div>`
    }
  </div>`;
}

function render() {
  if (!state.players.length) {
    return `<div class="view">${emptyState('📈', 'Nessun listone caricato', 'Importa prima il listone dalla scheda <b>Listone</b>.')}</div>`;
  }
  if (!state.mercato) {
    return `<div class="view">${emptyState('📈', 'Asta non ancora cominciata', 'Qui compare come sta andando il mercato appena assegni il primo giocatore.')}</div>`;
  }
  return `
  <div class="view">
    ${concorrenzaCard()}
    ${andamentoCard()}
    ${roseCard()}
    ${incollaCard()}
    ${strategiaCard()}
    ${tabelloneCard()}
  </div>`;
}

/** Da nomi nel file a posti in `settings.squadre`: io sempre allo zero, gli altri a seguire. */
function mappaSquadre(squadre, mia) {
  const altre = squadre.filter((_, i) => i !== mia);
  const ordine = [squadre[mia], ...altre];
  return { ordine, indice: new Map(ordine.map((n, i) => [n, i])) };
}

function preparaConfronto() {
  const { ordine, indice } = mappaSquadre(rose.lettura.squadre, rose.mia);
  rose.ordine = ordine;
  rose.confronto = confrontaRose(rose.lettura.righe, indice);
}

function onAction(action, target, ev, rerender) {
  if (action === 'rose-io') {
    rose.mia = Number(target.dataset.i);
    preparaConfronto();
    rerender();
    return true;
  }
  if (action === 'conferma-rose') {
    // I nomi veri delle squadre valgono piu' dei "Squadra 2" di partenza, e servono anche a
    // riconoscerle da soli al prossimo import.
    const squadre = [...rose.ordine];
    while (squadre.length < (state.settings.participants || 8)) squadre.push(`Squadra ${squadre.length + 1}`);
    updateSettings({ squadre: squadre.slice(0, state.settings.participants || 8) });
    const c = rose.confronto;
    applicaRose(c);
    rose = null;
    toast(`Sincronizzato: ${c.nuovi.length} nuovi, ${c.prezzi.length} corretti, ${c.tolti.length} tolti.`);
    rerender();
    return true;
  }
  if (action === 'annulla-rose') {
    rose = null;
    rerender();
    return true;
  }
  if (action === 'leggi-incolla') {
    const testo = document.getElementById('assegnati')?.value || '';
    if (!testo.trim()) {
      toast('Incolla prima l&#39;elenco.');
      return true;
    }
    const gia = new Set([...Object.keys(state.auction.owned), ...Object.keys(state.auction.taken)]);
    incollato = leggiElenco(testo, state.players, { gia });
    rerender();
    return true;
  }
  if (action === 'conferma-incolla') {
    const voci = incollato.esiti
      .filter((e) => e.esito === 'trovato')
      .map((e) => ({ id: e.player.id, kind: 'other', price: Number.isFinite(e.prezzo) ? e.prezzo : 0 }));
    const n = assegnaMolti(voci);
    incollato = null;
    toast(`${n} aggiudicazioni registrate.`);
    rerender();
    return true;
  }
  if (action === 'annulla-incolla') {
    incollato = null;
    rerender();
    return true;
  }
  if (action === 'scenario') {
    const role = target.dataset.role;
    const dopo = scenarioSenzaBig({
      players: state.players,
      settings: state.settings,
      owned: ownedMap(),
      unavailable: unavailableSet(),
      role,
    });
    scenario = {
      role,
      frasi: narrazione({ prima: state.plan, dopo, settings: state.settings }),
      costo: Math.max(0, Math.round(state.plan.score - dopo.score)),
    };
    rerender();
    return true;
  }
  if (action === 'chiudi-scenario') {
    scenario = null;
    rerender();
    return true;
  }
  return false;
}

function onInput(action, target, rerender) {
  if (action !== 'file-rose') return false;
  const file = target.files && target.files[0];
  if (!file) return true;
  file
    .text()
    .then((testo) => {
      const lettura = leggiRose(testo, state.players);
      if (!lettura.ok) {
        rose = { errore: lettura.motivo };
      } else if (lettura.squadre.length > (state.settings.participants || 8)) {
        rose = {
          errore: `Il file contiene ${lettura.squadre.length} squadre ma la lega ne ha ${state.settings.participants}. Correggi i partecipanti nella scheda Lega.`,
        };
      } else {
        // Se i nomi sono gia' quelli delle impostazioni, la domanda "quale sei tu" e' gia' stata
        // fatta una volta: non si rifa' a ogni import.
        const gia = nomiSquadre(state.settings);
        const mia = lettura.squadre.findIndex((n) => n === gia[0]);
        rose = { lettura, mia: mia >= 0 ? mia : null };
        if (rose.mia !== null) preparaConfronto();
      }
      rerender();
    })
    .catch(() => {
      rose = { errore: 'Non riesco a leggere il file.' };
      rerender();
    });
  return true;
}

return { invalidate, render, onAction, onInput };
})();

const __m_src_domain_xlsx_js = (() => {
// Lettore .xlsx minimale e senza dipendenze: apre lo zip con DecompressionStream
// e legge i fogli con una scansione mirata dell'XML.
// I listoni dei creators arrivano come xlsx con un foglio per ruolo: chiedere all'utente
// di convertirli in CSV sul telefono sarebbe una barriera assurda.

const EOCD_SIG = 0x06054b50;

function findEocd(view) {
  const max = Math.min(view.byteLength, 66000);
  for (let i = 22; i <= max; i++) {
    const off = view.byteLength - i;
    if (off < 0) break;
    if (view.getUint32(off, true) === EOCD_SIG) return off;
  }
  return -1;
}

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error("Questo browser non sa aprire i file .xlsx: esporta il listone in CSV.");
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/** Estrae i file di uno zip. Ritorna una mappa nome -> Uint8Array. */
async function unzip(arrayBuffer, wanted = null) {
  const view = new DataView(arrayBuffer);
  const bytes = new Uint8Array(arrayBuffer);
  const eocd = findEocd(view);
  if (eocd < 0) throw new Error('File non valido: non sembra un .xlsx.');

  const count = view.getUint16(eocd + 10, true);
  let ptr = view.getUint32(eocd + 16, true);
  const out = new Map();
  const decoder = new TextDecoder();

  for (let i = 0; i < count; i++) {
    if (view.getUint32(ptr, true) !== 0x02014b50) break;
    const method = view.getUint16(ptr + 10, true);
    const compSize = view.getUint32(ptr + 20, true);
    const nameLen = view.getUint16(ptr + 28, true);
    const extraLen = view.getUint16(ptr + 30, true);
    const commentLen = view.getUint16(ptr + 32, true);
    const localOff = view.getUint32(ptr + 42, true);
    const name = decoder.decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));
    ptr += 46 + nameLen + extraLen + commentLen;

    if (wanted && !wanted(name)) continue;
    if (view.getUint32(localOff, true) !== 0x04034b50) continue;
    const lNameLen = view.getUint16(localOff + 26, true);
    const lExtraLen = view.getUint16(localOff + 28, true);
    const start = localOff + 30 + lNameLen + lExtraLen;
    const raw = bytes.subarray(start, start + compSize);
    out.set(name, method === 0 ? raw : await inflateRaw(raw));
  }
  return out;
}

const decoder = new TextDecoder();

function unescapeXml(s) {
  return s.replace(/&(amp|lt|gt|quot|apos|#\d+|#x[0-9a-fA-F]+);/g, (m, g) => {
    switch (g) {
      case 'amp': return '&';
      case 'lt': return '<';
      case 'gt': return '>';
      case 'quot': return '"';
      case 'apos': return "'";
      default:
        return g[0] === '#'
          ? String.fromCodePoint(g[1] === 'x' ? parseInt(g.slice(2), 16) : parseInt(g.slice(1), 10))
          : m;
    }
  });
}

/** Testo di tutti i <t> dentro un frammento, concatenato (i testi ricchi sono spezzati in run). */
function textOf(fragment) {
  let out = '';
  const re = /<t[^>]*>([\s\S]*?)<\/t>/g;
  let m;
  while ((m = re.exec(fragment))) out += unescapeXml(m[1]);
  return out;
}

function parseSharedStrings(buf) {
  if (!buf) return [];
  const xml = decoder.decode(buf);
  const out = [];
  const re = /<si[^>]*>([\s\S]*?)<\/si>|<si[^>]*\/>/g;
  let m;
  while ((m = re.exec(xml))) out.push(m[1] ? textOf(m[1]) : '');
  return out;
}

function columnToIndex(ref) {
  let n = 0;
  for (const ch of ref) {
    const c = ch.charCodeAt(0);
    if (c < 65 || c > 90) break;
    n = n * 26 + (c - 64);
  }
  return n - 1;
}

/** Legge un foglio in una griglia di stringhe. */
function parseSheet(buf, shared) {
  const xml = decoder.decode(buf);
  const grid = [];
  const rowRe = /<row[^>]*\br="(\d+)"[^>]*>([\s\S]*?)<\/row>/g;
  const cellRe = /<c\b([^>]*)(?:\/>|>([\s\S]*?)<\/c>)/g;
  let rowMatch;
  while ((rowMatch = rowRe.exec(xml))) {
    const cells = [];
    let cellMatch;
    cellRe.lastIndex = 0;
    while ((cellMatch = cellRe.exec(rowMatch[2]))) {
      const attrs = cellMatch[1] || '';
      const body = cellMatch[2] || '';
      const refMatch = attrs.match(/\br="([A-Z]+)\d+"/);
      if (!refMatch) continue;
      const col = columnToIndex(refMatch[1]);
      const type = (attrs.match(/\bt="([^"]+)"/) || [])[1];
      let value = '';
      if (type === 'inlineStr') value = textOf(body);
      else {
        const v = body.match(/<v[^>]*>([\s\S]*?)<\/v>/);
        if (v) {
          const raw = unescapeXml(v[1]);
          value = type === 's' ? shared[Number(raw)] ?? '' : raw;
        }
      }
      cells[col] = value;
    }
    for (let i = 0; i < cells.length; i++) if (cells[i] === undefined) cells[i] = '';
    grid.push(cells);
  }
  return grid;
}

function parseWorkbook(buf) {
  if (!buf) return [];
  const xml = decoder.decode(buf);
  const out = [];
  const re = /<sheet\b([^>]*)\/?>/g;
  let m;
  while ((m = re.exec(xml))) {
    const attrs = m[1];
    const name = unescapeXml((attrs.match(/\bname="([^"]*)"/) || [])[1] || '');
    const rid = (attrs.match(/r:id="([^"]+)"/) || [])[1] || '';
    if (name) out.push({ name, rid });
  }
  return out;
}

function parseRels(buf) {
  const map = new Map();
  if (!buf) return map;
  const xml = decoder.decode(buf);
  const re = /<Relationship\b([^>]*)\/?>/g;
  let m;
  while ((m = re.exec(xml))) {
    const id = (m[1].match(/Id="([^"]+)"/) || [])[1];
    const target = (m[1].match(/Target="([^"]+)"/) || [])[1];
    if (id && target) map.set(id, target.replace(/^\/?xl\//, '').replace(/^\.\//, ''));
  }
  return map;
}

/**
 * Legge un .xlsx e restituisce i fogli come griglie di stringhe.
 * Ritorna [{ name, grid }] nell'ordine del file.
 */
async function readXlsx(arrayBuffer) {
  const files = await unzip(arrayBuffer, (n) => n.startsWith('xl/') || n === '[Content_Types].xml');
  const shared = parseSharedStrings(files.get('xl/sharedStrings.xml'));
  const rels = parseRels(files.get('xl/_rels/workbook.xml.rels'));
  const declared = parseWorkbook(files.get('xl/workbook.xml'));

  const sheets = [];
  for (const { name, rid } of declared) {
    const target = rels.get(rid);
    const buf = (target && files.get(`xl/${target}`)) || null;
    if (buf) sheets.push({ name, grid: parseSheet(buf, shared) });
  }
  if (!sheets.length) {
    // Nessuna relazione leggibile: ripieghiamo sull'ordine dei file dei fogli.
    const names = [...files.keys()].filter((n) => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort();
    names.forEach((n, i) => sheets.push({ name: `Foglio ${i + 1}`, grid: parseSheet(files.get(n), shared) }));
  }
  return sheets;
}

return { unzip, columnToIndex, readXlsx };
})();

// Import dei listoni (xlsx dei creators o CSV) e consultazione dei giocatori.

const { readXlsx } = __m_src_domain_xlsx_js;

const { ROLES } = __m_src_domain_model_js;
const { esc, matches, playerRow, emptyState, toast } = __m_src_ui_common_js;

// Import in corso: vive solo finche' l'utente conferma la mappatura delle colonne.
let draft = null;
let showMapping = false;
let tipoAtteso = 'listone';

onReset(() => {
  draft = null;
  showMapping = false;
  tipoAtteso = 'listone';
});

const FIELDS = [
  ['name', 'Nome', true],
  ['team', 'Squadra', false],
  ['role', 'Ruolo', true],
  ['tier', 'Fascia', false],
  ['price', 'Prezzo consigliato', false],
  ['fmvExp', 'Fantamedia attesa', false],
  ['titolarita', 'Titolarita', false],
  ['integrita', 'Integrita', false],
  ['notes', 'Commento', false],
];

function sourceName(fileName) {
  return String(fileName || 'listone')
    .replace(/\.(xlsx|xlsm|csv|tsv|txt)$/i, '')
    .replace(/[_-]+/g, ' ')
    .trim()
    .slice(0, 40);
}

/** Prende un file (o un testo incollato) e prepara l'anteprima dell'import. */
async function ingestFile(file) {
  const name = file.name || 'listone';
  try {
    let table;
    if (/\.(xlsx|xlsm)$/i.test(name)) {
      const sheets = await readXlsx(await file.arrayBuffer());
      table = sheetsToTable(sheets);
      table.origine = `${sheets.length} fogli`;
    } else {
      const parsed = parseCsv(await file.text());
      table = { ...parsed, origine: `separatore ${parsed.delimiter === '\t' ? 'tab' : parsed.delimiter}` };
    }
    if (!table.headers?.length) {
      toast('Non riesco a leggere questo file.');
      return;
    }
    if (tipoAtteso === 'voti') {
      const mapping = formMapping(table.headers);
      draft = { ...table, mapping, fileName: name, kind: 'voti' };
      showMapping = !mapping.name;
      return;
    }
    const mapping = refineMapping(table.rows, autoMap(table.headers));
    draft = { ...table, mapping, fileName: name, source: sourceName(name), kind: 'listone' };
    showMapping = !mapping.name || !mapping.role;
  } catch (err) {
    console.error(err);
    toast(err.message || 'Import non riuscito.');
  }
}

function ingestText(text) {
  const parsed = parseCsv(text);
  if (!parsed.headers.length) {
    toast('Non riesco a leggere il testo incollato.');
    return;
  }
  const mapping = refineMapping(parsed.rows, autoMap(parsed.headers));
  draft = { ...parsed, mapping, fileName: 'testo incollato', source: 'incollato', origine: `separatore ${parsed.delimiter}` };
  showMapping = !mapping.name || !mapping.role;
}

  const { players, warnings } = buildPlayers(draft.rows, draft.mapping, { source: draft.source });

  const withTier = players.filter((p) => p.tier).length;

function onAction(action, target, ev, rerender) {
  switch (action) {
    case 'pickfile':
      tipoAtteso = 'listone';
      document.getElementById('csvfile')?.click();
      return true;
    case 'pickvoti':
      tipoAtteso = 'voti';
      document.getElementById('votifile')?.click();
      return true;
    case 'clearvoti':
      clearForm();
      rerender();
      return true;
    case 'confirm-voti': {
      const giornate = Number(document.getElementById('giornate')?.value) || 1;
      setForm({ rows: draft.rows, mapping: draft.mapping, fileName: draft.fileName, giornate });
      draft = null;
      tipoAtteso = 'listone';
      toast('Valutazioni aggiornate con i voti.');
      rerender();
      return true;
    }
    case 'paste': {
      const text = document.getElementById('pastearea')?.value || '';
      if (!text.trim()) {
        toast('Incolla prima il contenuto.');
        return true;
      }
      ingestText(text);
      rerender();
      return true;
    }
    case 'togglemap':
      showMapping = !showMapping;
      rerender();
      return true;
    case 'cancel-import':
      draft = null;
      rerender();
      return true;
    case 'removesource':
      removeSource(target.dataset.name);
      rerender();
      return true;
    case 'confirm-import': {
      const { players, warnings } = preview();
      addSource({
        name: draft.source || 'listone',
        players,
        headers: draft.headers,
        mapping: draft.mapping,
        warnings,
        fileName: draft.fileName,
      });
      const n = players.length;
      draft = null;
      showMapping = false;
      toast(`${n} giocatori aggiunti.`);
      rerender();
      return true;
    }
    case 'listrole':
      state.ui.listRole = target.dataset.role;
      rerender();
      return true;
    case 'select':
      state.ui.selectedId = target.dataset.id;
      state.ui.tab = 'asta';
      rerender();
      return true;
    default:
      return false;
  }
}

function onInput(action, target, rerender) {
  if (action === 'map') {
    draft.mapping = { ...draft.mapping, [target.dataset.field]: target.value || undefined };
    rerender();
    return true;
  }
  if (action === 'srcname') {
    draft.source = target.value;
    return true;
  }
  if (action === 'listquery') {
    state.ui.listQuery = target.value;
    rerender({ keepFocus: 'listQuery' });
    return true;
  }
  if (action === 'onlyavail') {
    state.ui.onlyAvailable = target.checked;
    rerender();
    return true;
  }
  if (action === 'file') {
    const files = [...(target.files || [])];
    if (!files.length) return true;
    (async () => {
      for (const file of files) {
        await ingestFile(file);
        // Con piu' file in coda importiamo subito quelli riconosciuti senza chiedere nulla.
        if (draft && files.length > 1 && draft.mapping.name && draft.mapping.role) {
          const { players, warnings } = preview();
          addSource({ name: draft.source, players, headers: draft.headers, mapping: draft.mapping, warnings, fileName: draft.fileName });
          draft = null;
        }
      }
      rerender();
    })();
    return true;
  }
  return false;
}

return { ingestFile, ingestText, render, onAction, onInput };

      a.click();
      a.remove();
      // Revocare subito interrompe il download su alcuni browser: si lascia un attimo.
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast(`Salvato ${nome}.`);
      return true;
    }
    case 'importa-chiedi':
      chiedeImport = true;
      esitoImport = null;
      rerender();
      return true;
    case 'importa-annulla':
      chiedeImport = false;
      rerender();
      return true;
    case 'reset':
      chiedeConferma = true;
      rerender();
      return true;
    case 'reset-annulla':
      chiedeConferma = false;
      rerender();
      return true;
    case 'reset-conferma':
      chiedeConferma = false;
      resetAll();
      toast('Tutto azzerato.');
      rerender();
      return true;
    default:
      return false;
  }
}

/**
 * `kind` distingue il tasto premuto dall'uscita dal campo.
 *
 * Serve per i campi di testo: ridisegnare a ogni carattere costava un ricalcolo del piano e
 * una riscrittura dell'intero listone in memoria, e — non avendo i campi un id — il fuoco
 * finiva nel nulla dopo la prima lettera. Rinominare una squadra era di fatto impossibile.
 */
function onInput(action, target, rerender, kind = 'input') {
  const s = state.settings;
  switch (action) {
    case 'importa': {
      const file = target.files && target.files[0];
      if (!file) return true;
      file
        .text()
        .then((testo) => {
          const esito = importa(testo);
          chiedeImport = false;
          esitoImport = esito.ok
            ? {
                ok: true,
                testo: `Asta ripristinata: ${esito.giocatori} giocatori, ${esito.presi} gia' presi${
                  esito.salvatoIl ? ` (backup del ${new Date(esito.salvatoIl).toLocaleString('it-IT')})` : ''
                }.`,
              }
            : { ok: false, testo: esito.motivo };
          rerender();
        })
        .catch(() => {
          esitoImport = { ok: false, testo: 'Non riesco a leggere il file.' };
          rerender();
        });
      return true;
    }
    case 'set': {
      const v = Math.max(1, Number(target.value) || 0);
      updateSettings({ [target.dataset.key]: v });
      rerender({ keepFocus: target.id });
      return true;
    }
    case 'setslot': {
      const slots = { ...s.slots, [target.dataset.key]: Math.max(0, Number(target.value) || 0) };
      const starters = { ...s.starters };
      // I titolari non possono superare gli slot disponibili.
      for (const r of ROLES) starters[r] = Math.min(starters[r], Math.max(1, slots[r]));
      updateSettings({ slots, starters });
      rerender({ keepFocus: target.id });
      return true;
    }
    case 'setstarter': {
      const r = target.dataset.key;
      const v = Math.min(Math.max(1, Number(target.value) || 1), s.slots[r] || 1);
      updateSettings({ starters: { ...s.starters, [r]: v } });
      rerender({ keepFocus: target.id });
      return true;
    }
    case 'setcap': {
      const raw = target.value.trim();
      updateSettings({ roleBudget: { ...s.roleBudget, [target.dataset.key]: raw === '' ? null : Math.max(0, Number(raw) || 0) } });
      rerender({ keepFocus: target.id });
      return true;
    }
    case 'setmintop': {
      const r = target.dataset.key;
      const v = Math.min(Math.max(0, Number(target.value) || 0), s.slots[r] || 0);
      updateSettings({ minTop: { ...s.minTop, [r]: v } });
      rerender({ keepFocus: target.id });
      return true;
    }
    case 'topthreshold':
      updateSettings({ topThreshold: Number(target.value) });
      rerender({ keepFocus: target.id });
      return true;
    case 'setsquadra': {
      // Un nome di squadra non entra in nessun calcolo: si annota e si salva, senza rivalutare
      // il listone ne' rifare il piano. E mentre si scrive non si ridisegna niente — il
      // carattere e' gia' a schermo, e ridisegnare vuol dire perdere il cursore.
      const i = Number(target.dataset.i);
      const uscito = kind !== 'input';
      const squadre = nomiSquadre(s);
      squadre[i] = uscito ? target.value.trim() || (i === 0 ? 'Io' : `Squadra ${i + 1}`) : target.value;
      rinominaSquadre(squadre);
      if (uscito) rerender({ keepFocus: target.id });
      return true;
    }
    case 'setmaxclub': {
      const raw = target.value.trim();
      updateSettings({ maxPerClub: raw === '' ? 0 : Math.max(0, Number(raw) || 0) });
      rerender({ keepFocus: target.id });
      return true;
    }
    case 'toggle':
      updateSettings({ [target.dataset.key]: target.checked });
      rerender();
      return true;
    case 'aggr':
      updateSettings({ aggressiveness: Number(target.value) });
      rerender({ keepFocus: target.id });
      return true;
    default:
      return false;
  }
}

return { render, onAction, onInput };
})();
