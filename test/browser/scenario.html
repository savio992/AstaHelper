<!doctype html>
<meta charset="utf-8">
<title>scenario</title>
<pre id="out">in corso…</pre>
<script type="module">
import { readXlsx } from '../../src/domain/xlsx.js';
import { sheetsToTable, autoMap, buildPlayers } from '../../src/domain/csv.js';
import { defaultSettings, inferTierOrder, annotateTierPct, ROLES } from '../../src/domain/model.js';
import { valuePlayers } from '../../src/domain/valuation.js';
import { withExpectedPrices } from '../../src/domain/market.js';
import { optimizeRoster } from '../../src/domain/optimizer.js';
import { maxBid, alternatives } from '../../src/domain/advisor.js';

const lines = [];
const check = (name, ok, extra = '') => lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}${extra ? ' :: ' + extra : ''}`);

try {
  // 1. DecompressionStream deve esserci: e' cio' che permette di leggere gli .xlsx sul telefono.
  check('DecompressionStream disponibile', typeof DecompressionStream !== 'undefined');

  // 2. Un listone sintetico, generato qui per non dipendere da file esterni.
  const clubs = ['ROM','INT','MIL','NAP','ATA','LAZ','JUV','BOL','FIO','TOR','GEN','COM','CAG','LEC','UDI','PAR','VER','MON','EMP','VEN'];
  const perRole = { P: 3, D: 9, C: 9, A: 6 };
  const tiers = ['Top','Semi-Top','Terza','Quarta','Scomm.','Outsider'];
  const roster = [];
  for (const club of clubs) for (const role of ROLES) for (let i = 0; i < perRole[role]; i++) {
    const t = Math.min(tiers.length - 1, Math.floor(i * tiers.length / perRole[role]));
    roster.push({
      id: `${club}-${role}-${i}`, name: `${role}${i} ${club}`, team: club, role, tier: tiers[t], tags: [], notes: '',
      price: Math.max(1, Math.round((30 - t * 5) * (role === 'A' ? 2 : role === 'C' ? 1.4 : role === 'D' ? 0.9 : 0.5))),
      fmvExp: 5 + (role === 'P' ? 0 : 1.2) + (tiers.length - t) * 0.25,
      titolarita: Math.max(1, 5 - t), integrita: 4, fmvExp2: null,
    });
  }
  const settings = defaultSettings();
  const annotated = annotateTierPct(roster);
  for (const role of ROLES) settings.tierOrder[role] = inferTierOrder(annotated, role);
  const players = withExpectedPrices(valuePlayers(annotated, settings), settings);
  check('listone valutato', players.length === 540 && players.every((p) => Number.isFinite(p.score)));

  // 3. Il piano deve chiudere entro budget e con tutti gli slot.
  const t0 = performance.now();
  const plan = optimizeRoster({ players, settings });
  const planMs = performance.now() - t0;
  check('piano generato', plan.ok && plan.picks.length === 25 && plan.cost <= 500, `${plan.cost} crediti, ${planMs.toFixed(0)}ms`);
  check('piano abbastanza veloce', planMs < 1500, `${planMs.toFixed(0)}ms`);

  // 4. Offerta massima e alternative: e' quello che si usa dal vivo, deve stare sotto il secondo.
  const target = plan.picks.filter((p) => p.role === 'A').sort((a, b) => b.plannedPrice - a.plannedPrice)[0];
  const t1 = performance.now();
  const bid = maxBid({ players, settings, playerId: target.id });
  const bidMs = performance.now() - t1;
  check('offerta massima calcolata', bid.maxBid > 0 && bid.maxBid <= 476, `${bid.maxBid} crediti in ${bidMs.toFixed(0)}ms`);
  // Il solutore completo costa di piu' del vecchio, che pero' sbagliava l'offerta fino al 50%:
  // sotto il secondo va benissimo, il pannello mostra intanto lo spinner.
  check('offerta massima reattiva', bidMs < 1400, `${bidMs.toFixed(0)}ms`);

  const t2 = performance.now();
  const alts = alternatives({ players, settings, playerId: target.id });
  const altMs = performance.now() - t2;
  check('alternative trovate', alts.alternatives.length > 0 && alts.alternatives.every((a) => a.player.role === target.role), `${alts.alternatives.length} in ${altMs.toFixed(0)}ms`);
  check('alternative reattive', altMs < 1400, `${altMs.toFixed(0)}ms`);

  // 5. Lettura di un .xlsx vero costruito al volo con CompressionStream.
  const enc = new TextEncoder();
  async function deflateRaw(bytes) {
    const s = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  function crc32(buf) { let c = ~0; for (const b of buf) { c ^= b; for (let i = 0; i < 8; i++) c = (c >>> 1) ^ (0xedb88320 & -(c & 1)); } return ~c >>> 0; }
  async function makeZip(entries) {
    const locals = []; const central = []; let offset = 0;
    for (const [name, text] of entries) {
      const nb = enc.encode(name); const raw = enc.encode(text); const data = await deflateRaw(raw); const crc = crc32(raw);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(8, 8, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, raw.length, true); lh.setUint16(26, nb.length, true);
      locals.push(new Uint8Array(lh.buffer), nb, data);
      const cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true); cd.setUint16(6, 20, true); cd.setUint16(10, 8, true);
      cd.setUint32(16, crc, true); cd.setUint32(20, data.length, true); cd.setUint32(24, raw.length, true);
      cd.setUint16(28, nb.length, true); cd.setUint32(42, offset, true);
      central.push(new Uint8Array(cd.buffer), nb);
      offset += 30 + nb.length + data.length;
    }
    const cdBytes = central.reduce((a, b) => a + b.length, 0);
    const eo = new DataView(new ArrayBuffer(22));
    eo.setUint32(0, 0x06054b50, true); eo.setUint16(8, entries.length, true); eo.setUint16(10, entries.length, true);
    eo.setUint32(12, cdBytes, true); eo.setUint32(16, offset, true);
    const blob = new Blob([...locals, ...central, new Uint8Array(eo.buffer)]);
    return blob.arrayBuffer();
  }
  const sheet = (rows) => `<?xml version="1.0"?><worksheet><sheetData>${rows.map((r, i) =>
    `<row r="${i + 1}">${r.map((v, j) => `<c r="${String.fromCharCode(65 + j)}${i + 1}" t="inlineStr"><is><t>${v}</t></is></c>`).join('')}</row>`).join('')}</sheetData></worksheet>`;
  const ab = await makeZip([
    ['xl/workbook.xml', '<?xml version="1.0"?><workbook><sheets><sheet name="A" sheetId="1" r:id="rId1"/></sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels', '<?xml version="1.0"?><Relationships><Relationship Id="rId1" Target="worksheets/sheet1.xml"/></Relationships>'],
    ['xl/worksheets/sheet1.xml', sheet([['Fascia', 'Ruolo', 'Team', 'Nome', 'Prezzo'], ['Top', 'A', 'INT', 'Lautaro', '150']])],
  ]);
  const sheets = await readXlsx(ab);
  const table = sheetsToTable(sheets);
  const built = buildPlayers(table.rows, autoMap(table.headers), { source: 'x' });
  check('xlsx letto nel browser', built.players.length === 1 && built.players[0].name === 'Lautaro' && built.players[0].price === 150);

  // 6. La persistenza locale deve reggere un listone intero.
  try {
    localStorage.setItem('astahelper:test', JSON.stringify(roster));
    const back = JSON.parse(localStorage.getItem('astahelper:test'));
    localStorage.removeItem('astahelper:test');
    check('listone salvato in locale', back.length === roster.length);
  } catch (err) {
    check('listone salvato in locale', false, err.message);
  }
} catch (err) {
  lines.push(`FAIL eccezione :: ${err && err.stack ? err.stack.split('\n')[0] : err}`);
}

document.getElementById('out').textContent = lines.join('\n');
document.title = lines.some((l) => l.startsWith('FAIL')) ? 'ROSSO' : 'VERDE';
</script>
