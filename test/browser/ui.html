<!doctype html>
<meta charset="utf-8">
<title>ui</title>
<pre id="out">in corso…</pre>
<script type="module">
import * as store from '../../src/store.js';
import * as asta from '../../src/ui/asta.js';
import * as piano from '../../src/ui/piano.js';
import * as mercato from '../../src/ui/mercato.js';
import * as listone from '../../src/ui/listone.js';
import * as setup from '../../src/ui/setup.js';
import * as advisor from '../../src/domain/advisor.js';
import { leggiRose } from '../../src/domain/rose.js';
import { ROLES } from '../../src/domain/model.js';

const lines = [];
const check = (name, ok, extra = '') => lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}${extra ? ' :: ' + extra : ''}`);
const noop = () => {};

try {
  localStorage.clear();

  // Un listone credibile: fasce, prezzi, giudizi di titolarita'.
  const clubs = ['ROM','INT','MIL','NAP','ATA','LAZ','JUV','BOL','FIO','TOR','GEN','COM','CAG','LEC','UDI','PAR','VER','MON','EMP','VEN'];
  const perRole = { P: 3, D: 9, C: 9, A: 6 };
  const tiers = ['Top','Semi-Top','Terza','Quarta','Scomm.','Outsider'];
  const players = [];
  for (const club of clubs) for (const role of ROLES) for (let i = 0; i < perRole[role]; i++) {
    const t = Math.min(tiers.length - 1, Math.floor(i * tiers.length / perRole[role]));
    players.push({
      id: `${club}-${role}-${i}`, name: `${role}${i}${club}`, team: club, role, tier: tiers[t],
      tags: role === 'P' && t === 0 ? ['imbattibilità'] : [], notes: '', sources: ['prova'],
      price: Math.max(1, Math.round((30 - t * 5) * (role === 'A' ? 2 : role === 'C' ? 1.4 : role === 'D' ? 0.9 : 0.5))),
      fmvExp: 5 + (role === 'P' ? 0 : 1.2) + (tiers.length - t) * 0.25,
      titolarita: Math.max(1, 5 - t), integrita: 4,
    });
  }

  store.addSource({ name: 'prova', players, headers: [], mapping: {}, warnings: [], fileName: 'prova.xlsx' });
  check('import nello stato', store.state.players.length === 540 && store.state.sources.length === 1);
  check('ordine fasce dedotto', store.state.settings.tierOrder.A[0] === 'Top');

  const plan = store.state.plan;
  check('piano pronto dopo import', plan?.ok === true && plan.picks.length === 25, `${plan?.cost} crediti`);

  // --- schermata asta -------------------------------------------------------------
  store.state.ui.tab = 'asta';
  let html = asta.render(noop);
  check('la schermata asta mostra i crediti', html.includes('crediti liberi') && html.includes('500'));
  // Gli obiettivi sono ora tagliati sul reparto in corso, con gli altri piegati sotto.
  check('mostra gli obiettivi del reparto in corso', /Obiettivi · portieri/.test(html));
  check('gli obiettivi dei reparti dopo restano raggiungibili', html.includes('Gli obiettivi dei reparti dopo'));
  check('propone chi sta per essere chiamato', html.includes('i piu&#39; probabili adesso') || html.includes("i piu' probabili adesso"));
  check('ogni obiettivo ha il tocco singolo per dirlo perso', html.includes('data-action="quick-gone"'));

  // Seleziono un obiettivo: deve comparire il pannello con offerta massima e alternative.
  const target = plan.picks.filter((p) => p.role === 'A').sort((a, b) => b.plannedPrice - a.plannedPrice)[0];
  store.state.ui.selectedId = target.id;
  asta.render(noop); // primo giro: avvia il calcolo
  await new Promise((r) => setTimeout(r, 400));
  html = asta.render(noop);
  check('pannello del giocatore aperto', html.includes(target.name));
  check("mostra l'offerta massima", html.includes('vale fino a questo') || html.includes('non fa per te'));
  check('mostra le alternative se lo perdo', html.includes('Se lo perdo'));
  // Il divario fra prezzo di mercato e offerta massima va motivato, non lasciato li': un
  // portiere di riserva caro e' il caso tipico, e il ripiego non deve essere gia' in rosa.
  const titolare = store.state.plan.picks.filter((x) => x.role === 'P').sort((a, b) => b.score - a.score)[0];
  const riserva = store.state.players
    .filter((x) => x.role === 'P' && x.id !== titolare.id && x.expectedPrice > 8)
    .sort((a, b) => a.score - b.score)[0];
  if (riserva) {
    store.state.ui.selectedId = riserva.id;
    asta.render(noop);
    await new Promise((r) => setTimeout(r, 900));
    const conRiserva = asta.render(noop);
    check('il divario col mercato viene motivato', /mercato lo paga/.test(conRiserva), riserva.name);
    const rip = conRiserva.match(/(?:se lo superi, meglio|se ti serve il ruolo,) <b>([^<]+)<\/b>/);
    const inPiano = new Set(store.state.plan.picks.map((x) => x.name));
    check('il ripiego non e\' uno che prendo comunque', !rip || !inPiano.has(rip[1]), rip ? rip[1] : 'nessun ripiego');
    store.state.ui.selectedId = target.id;
    asta.render(noop);
    await new Promise((r) => setTimeout(r, 900));
  }

  check('mostra i pulsanti di assegnazione', html.includes('data-action="take-mine"') && html.includes('data-action="take-other"'));
  check('le alternative sono spiegate a parole, non con un delta', /praticamente uguale|poco sotto|sensibilmente sotto|ripiego|meglio di lui/.test(html));

  // La schermata iniziale deve dire cosa e' impostato e cosa manca.
  store.state.ui.selectedId = null;
  const home = asta.render(noop);
  check('la schermata iniziale riepiloga la configurazione', home.includes('Prima di cominciare'));
  check('riepiloga la lega impostata', home.includes(`${store.state.settings.participants} squadre`));
  check('i passi portano alle altre schede', home.includes('data-action="goto"'));
  store.state.ui.selectedId = target.id;

  // --- compro un giocatore ---------------------------------------------------------
  const prezzo = 40;
  store.assign(target.id, 'mine', prezzo);
  check('crediti scalati', store.creditsLeft() === 500 - prezzo, `restano ${store.creditsLeft()}`);
  // Ogni operazione deve essere raccontata: chi e' entrato, chi esce, dove vanno i crediti.
  // Nell'app il pannello del giocatore si chiude da solo dopo l'assegnazione: qui lo replichiamo,
  // altrimenti si sta guardando il dettaglio e non la schermata che vede l'utente.
  store.state.ui.selectedId = null;
  const dopoAcquisto = asta.render(noop);
  check('l\'acquisto viene raccontato', dopoAcquisto.includes(target.name) && /tuo a \d+/.test(dopoAcquisto), 'card della mossa');
  check('il racconto dice cosa ne consegue', /piano|crediti|obiettiv/i.test(dopoAcquisto));
  check('il giocatore entra in rosa', store.state.plan.owned.some((p) => p.id === target.id));
  check('il piano si ricalcola su 24 slot', store.state.plan.picks.length === 24);
  check('il budget totale resta rispettato', store.state.plan.cost <= 500, `${store.state.plan.cost}`);

  // --- un avversario mi soffia un obiettivo ----------------------------------------
  const perso = store.state.plan.picks.filter((p) => p.role === 'D').sort((a, b) => b.plannedPrice - a.plannedPrice)[0];
  const puntiPrima = store.state.plan.score;
  store.assign(perso.id, 'other', 0);
  store.state.ui.selectedId = null;
  const dopoPerdita = asta.render(noop);
  check('la perdita viene raccontata', /va a un avversario/.test(dopoPerdita), 'card della mossa');
  check('chi va agli altri esce dal piano', !store.state.plan.picks.some((p) => p.id === perso.id));
  check('il piano resta valido', store.state.plan.ok && store.state.plan.picks.length === 24);
  check('perdere un obiettivo non migliora la rosa', store.state.plan.score <= puntiPrima + 1e-6);

  // --- a chi e' andato ----------------------------------------------------------------
  // La corsia veloce non chiede l'acquirente, ma senza acquirente il tabellone non impara.
  // La domanda arriva dopo, e rispondere non deve costare un ricalcolo del piano.
  check('dopo una perdita l\'app chiede a chi e\' andato', /a chi e&#39; andato\?|a chi e' andato\?/.test(dopoPerdita), 'card di attribuzione');
  const primaDellAttribuzione = store.state.plan;
  const tettoPrima = store.state.tabellone.squadre[3].massimo;
  asta.onAction('attribuisci', { dataset: { id: perso.id, idx: '3' } }, null, noop);
  check('l\'acquisto finisce alla squadra giusta', store.state.auction.taken[perso.id].by === 3, `by=${store.state.auction.taken[perso.id].by}`);
  check('il tabellone impara', store.state.tabellone.squadre[3].massimo < tettoPrima, `${tettoPrima} → ${store.state.tabellone.squadre[3].massimo}`);
  check('il tabellone e\' completo', store.state.tabellone.attendibile === true);
  check('e il piano non e\' stato rifatto', store.state.plan === primaDellAttribuzione, 'stessa identica istanza');
  check('la domanda sparisce', !/a chi e&#39; andato\?|a chi e' andato\?/.test(asta.render(noop)));

  // --- annullo -----------------------------------------------------------------------
  store.undo();
  check("l'annulla riporta il giocatore disponibile", store.state.auction.taken[perso.id] === undefined);
  check('la rosa comprata resta', store.state.plan.owned.some((p) => p.id === target.id));

  // --- altre schermate ---------------------------------------------------------------
  store.state.ui.selectedId = null;
  store.state.ui.tab = 'piano';
  html = piano.render(noop);
  check('il piano elenca i quattro reparti', ['Portieri','Difensori','Centrocampisti','Attaccanti'].every((r) => html.includes(r)));
  check('il piano mostra il budget per fascia', html.includes('Budget per fascia'));
  check("il piano mostra l'esposizione per club", html.includes('Esposizione per club'));

  store.state.ui.tab = 'listone';
  html = listone.render(noop);
  check('il listone mostra la fonte caricata', html.includes('prova') && html.includes('Creators caricati'));

  store.state.ui.tab = 'setup';
  html = setup.render(noop);
  check('le impostazioni mostrano i modificatori', html.includes('Modificatore di difesa') && html.includes('Imbattibilita'));
  check('le impostazioni mostrano il tetto per club', html.includes('Concentrazione per club'));

  // --- rinominare una squadra ---------------------------------------------------------
  // Ogni campo in cui si scrive deve avere un id: il ridisegno rifa' tutto il DOM e senza id
  // il cursore finisce nel nulla dopo la prima lettera.
  const campi = [...html.matchAll(/<input[^>]*data-action="(?:set|setsquadra|setslot|setstarter|setcap|setmintop|setmaxclub)"[^>]*>/g)].map((m) => m[0]);
  check('ogni campo delle impostazioni ha un id', campi.length >= 10 && campi.every((c) => /\sid="/.test(c)), `${campi.length} campi`);

  let ridisegni = 0;
  const conta = () => { ridisegni++; };
  const campo = { value: '', dataset: { i: '2' }, id: 'cfg-squadra-2' };
  for (const c of 'Sasso FC') {
    campo.value += c;
    setup.onInput('setsquadra', campo, conta, 'input');
  }
  check('scrivere un nome non ridisegna la pagina', ridisegni === 0, `${ridisegni} ridisegni`);
  check('e il nome resta quello che ho scritto', store.state.settings.squadre[2] === 'Sasso FC', store.state.settings.squadre[2]);
  setup.onInput('setsquadra', campo, conta, 'change');
  check('uscendo dal campo il nome e\' salvato', JSON.parse(localStorage.getItem('astahelper:v1')).settings.squadre[2] === 'Sasso FC');
  check('e il ridisegno arriva alla fine', ridisegni === 1);
  const campoVuoto = { value: '   ', dataset: { i: '3' }, id: 'cfg-squadra-3' };
  setup.onInput('setsquadra', campoVuoto, noop, 'change');
  check('un nome svuotato torna al valore di partenza', store.state.settings.squadre[3] === 'Squadra 4', store.state.settings.squadre[3]);

  // --- persistenza -------------------------------------------------------------------
  const primaDelReload = store.creditsLeft();
  store.state.roster = [];
  store.state.players = [];
  store.state.plan = null;
  const ok = store.load();
  check('lo stato si ricarica dal telefono', ok && store.state.players.length === 540 && store.creditsLeft() === primaDelReload);
  check("l'asta in corso sopravvive alla chiusura", store.state.auction.owned[target.id] === prezzo);

  // --- il piano si puo' correggere a mano ------------------------------------------
  store.state.ui.tab = 'piano';
  // load() ricalcola i giocatori ma non il piano: e' rebuildPlan a farlo, come all'avvio.
  store.rebuildPlan();
  const pianoPrima = store.state.plan;
  const giaDentro = new Set(pianoPrima.picks.map((x) => x.id));
  const portiereVoluto = store.state.players
    .filter((x) => x.role === 'P' && !giaDentro.has(x.id) && !store.state.auction.taken[x.id])
    .sort((a, b) => b.expectedPrice - a.expectedPrice)[0];
  piano.onAction('blocca', { dataset: { id: portiereVoluto.id } }, null, noop);
  const scelto = store.state.plan.picks.find((x) => x.id === portiereVoluto.id);
  check('il portiere scelto a mano entra nel piano', !!scelto && scelto.bloccato === true, portiereVoluto.name);
  const idsPiano = store.state.plan.picks.map((x) => x.id);
  check('e non compare due volte', new Set(idsPiano).size === idsPiano.length);
  check('il piano resta completo', ROLES.every((r) => store.state.plan.picks.filter((x) => x.role === r).length === store.state.settings.slots[r] - Object.keys(store.state.auction.owned).filter((id) => store.state.players.find((p) => p.id === id)?.role === r).length));
  check('il piano lo mostra come scelta tua', piano.render(noop).includes('scelto da te'));

  piano.onAction('libera', { dataset: { id: portiereVoluto.id } }, null, noop);
  check('si puo\' restituire la scelta al solutore', !store.state.plan.picks.some((x) => x.id === portiereVoluto.id && x.bloccato));

  // Scartare il terzo portiere: il posto si deve riempire da solo, e l'app deve dirlo.
  const terzoPortiere = store.state.plan.picks.filter((x) => x.role === 'P').sort((a, b) => a.plannedPrice - b.plannedPrice)[0];
  piano.onAction('scarta', { dataset: { id: terzoPortiere.id } }, null, noop);
  const portieriDopo = store.state.plan.picks.filter((x) => x.role === 'P');
  const miei = Object.keys(store.state.auction.owned).filter((id) => store.state.players.find((p) => p.id === id)?.role === 'P').length;
  check('il posto lasciato libero si riempie', portieriDopo.length === store.state.settings.slots.P - miei, `${portieriDopo.length} portieri a piano`);
  check('lo scartato non c\'e\' piu\'', !portieriDopo.some((x) => x.id === terzoPortiere.id));
  const raccontoScarto = piano.render(noop);
  check('lo scarto viene raccontato', raccontoScarto.includes(terzoPortiere.name + ' scartato'), 'card della modifica');
  piano.onAction('libera', { dataset: { id: terzoPortiere.id } }, null, noop);

  // Un giocatore scartato: i numeri devono valere sul mondo in cui non lo e', altrimenti
  // dicono solo che il piano non ha budget per lui perche' l'hai tolto tu. La decisione sta in
  // una funzione a parte proprio per poterla verificare senza rifare tutti i calcoli.
  const portiereCaro = store.state.players
    .filter((x) => x.role === 'P' && !store.state.auction.taken[x.id] && !store.state.auction.owned[x.id])
    .sort((a, b) => b.expectedPrice - a.expectedPrice)[0];
  const primaDelloScarto = store.contestoConsiglio(portiereCaro.id);
  check('un giocatore normale si valuta com\'e\'', primaDelloScarto.escluso === false && !primaDelloScarto.unavailable.has(portiereCaro.id));

  piano.onAction('scarta', { dataset: { id: portiereCaro.id } }, null, noop);
  const dopoLoScarto = store.contestoConsiglio(portiereCaro.id);
  check('uno scartato resta escluso dal piano', !!store.state.auction.esclusi[portiereCaro.id]);
  check('ma si valuta come se non lo fosse', dopoLoScarto.escluso === true && !dopoLoScarto.unavailable.has(portiereCaro.id),
    'altrimenti il tetto direbbe solo che il piano non lo vuole');
  // Non si puo' usare `perso`: poche righe sopra il test annulla proprio quell'assegnazione.
  const venduto = Object.keys(store.state.auction.taken)[0];
  if (venduto) check('e chi e\' andato agli altri resta escluso davvero', dopoLoScarto.unavailable.has(venduto));

  store.state.ui.selectedId = portiereCaro.id;
  const schermata = asta.render(noop);
  check('lo scarto e\' dichiarato in cima', schermata.includes('L\'hai scartato'));
  check('e si dice che i numeri valgono se cambi idea', schermata.includes('se cambiassi idea'));
  piano.onAction('libera', { dataset: { id: portiereCaro.id } }, null, noop);
  store.state.ui.selectedId = null;
  asta.invalidate();

  const daScartare = store.state.plan.picks.filter((x) => x.role === 'C').sort((a, b) => b.plannedPrice - a.plannedPrice)[0];
  piano.onAction('scarta', { dataset: { id: daScartare.id } }, null, noop);
  check('lo scartato sparisce dal piano', !store.state.plan.picks.some((x) => x.id === daScartare.id), daScartare.name);
  check('e resta visibile per poterlo recuperare', piano.render(noop).includes('Scartati da te'));
  piano.onAction('libera', { dataset: { id: daScartare.id } }, null, noop);
  check('si puo\' recuperare', !piano.render(noop).includes('Scartati da te'));

  // --- le due modalita' ---------------------------------------------------------------
  store.state.ui.tab = 'piano';
  piano.onAction('modalita', { dataset: { v: 'mia' } }, null, noop);
  check('la modalita\' si puo\' cambiare', store.state.settings.modalita === 'mia');
  const inModalitaMia = piano.render(noop);
  check('la lista compare', inModalitaMia.includes('La tua lista'));
  check('e si puo\' cercare chi aggiungere', inModalitaMia.includes('Aggiungi alla lista'));

  const daMettere = store.state.players.filter((x) => x.role === 'A' && !store.state.auction.taken[x.id]).sort((a, b) => b.expectedPrice - a.expectedPrice)[0];
  piano.onAction('blocca', { dataset: { id: daMettere.id } }, null, noop);
  const conUnNome = piano.render(noop);
  check('il nome scelto entra in lista', conUnNome.includes('1 nomi') || conUnNome.includes('scelto da te'));

  // Il portiere scelto e' il portiere: il piano non deve comprarne uno piu' forte sopra di lui.
  const liberi = store.state.players.filter((x) => x.role === 'P' && !store.state.auction.taken[x.id] && !store.state.auction.owned[x.id]).sort((a, b) => b.score - a.score);
  const mioPortiere = liberi[Math.floor(liberi.length * 0.2)];
  piano.onAction('blocca', { dataset: { id: mioPortiere.id } }, null, noop);
  const inPorta = [...store.state.plan.owned, ...store.state.plan.picks].filter((x) => x.role === 'P');
  const sopra = inPorta.filter((x) => x.id !== mioPortiere.id && (x.score || 0) > (mioPortiere.score || 0));
  check('il portiere che scelgo io e\' il titolare', inPorta.some((x) => x.id === mioPortiere.id) && sopra.length === 0,
    `${mioPortiere.name} · in porta: ${inPorta.map((x) => x.name).join(' + ')}`);
  const conPortiere = piano.render(noop);
  check('e il piano dice chi di loro non gioca', conPortiere.includes('panchina'));
  piano.onAction('libera', { dataset: { id: mioPortiere.id } }, null, noop);

  // In modalita' "scelgo io" il numerone dell'asta cambia domanda.
  store.state.ui.tab = 'asta';
  store.state.ui.selectedId = daMettere.id;
  asta.invalidate();
  // Il primo disegno avvia il calcolo e restituisce la rotella; il secondo lo trova pronto.
  // Nell'app lo fa il rerender passato a ensureAdvice, qui il rerender e' un noop.
  asta.render(noop);
  await new Promise((r) => setTimeout(r, 4000));
  asta.render(noop);
  await new Promise((r) => setTimeout(r, 4000));
  const schedaMia = asta.render(noop);
  // Se il calcolo va in errore la scheda resta con la rotella: qui lo si fa emergere.
  let erroreConsiglio = '';
  try {
    const ctx = store.contestoConsiglio(daMettere.id);
    const a = { players: store.state.players, settings: store.state.settings, owned: store.ownedMap(), unavailable: ctx.unavailable, obbligati: store.obbligatiSet(), playerId: daMettere.id };
    const alts = advisor.alternatives({ ...a, limit: 12 });
    advisor.maxBid(a);
    advisor.spiegaPerdita({ ...a, piano: store.state.plan, alternative: alts.alternatives });
    advisor.tettoSullaLista({ players: a.players, settings: a.settings, owned: a.owned, lista: store.obbligatiSet(), playerId: daMettere.id });
  } catch (e) {
    erroreConsiglio = (e && e.message) || String(e);
  }
  check('i consigli non vanno in errore', !erroreConsiglio, erroreConsiglio || 'ok');
  const etichetta = (schedaMia.match(/class="lbl">([^<]*)</) || [])[1] || 'NESSUNA';
  check('l\'asta chiede quanto posso arrivare, non quanto vale', schedaMia.includes('puoi arrivare a questo'), `${daMettere.name} · ${etichetta}`);
  check('e dice quanto e\' impegnato sul resto della lista', schedaMia.includes('della tua lista'));

  piano.onAction('modalita', { dataset: { v: 'auto' } }, null, noop);
  store.state.ui.selectedId = null;
  asta.invalidate();

  // --- le strade: generare, salvare, seguire ------------------------------------------
  // Il punto non e' che il tasto disegni qualcosa: e' che una strada salvata sopravviva
  // all'asta, cambi voto quando le portano via un giocatore e sappia guidare il piano.
  store.state.ui.tab = 'piano';
  piano.onAction('genera-strade', { dataset: {} }, null, noop);
  await new Promise((r) => setTimeout(r, 2500));
  const conStrade = piano.render(noop);
  check('le strade si generano', conStrade.includes('Le strade') && conStrade.includes('★'), `${(conStrade.match(/data-action="salva-strada"/g) || []).length} salvabili`);

  piano.onAction('salva-strada', { dataset: { i: '0' } }, null, noop);
  piano.onAction('salva-strada', { dataset: { i: '1' } }, null, noop);
  check('le strade si salvano', store.state.scenari.length === 2, `${store.state.scenari.map((x) => x.nome).join(' | ')}`);

  const stradaA = store.state.scenari[0];
  check('la strada e\' una rosa intera con i suoi prezzi', stradaA.ids.length === 25 && Object.keys(stradaA.prezzi).length === 25);

  piano.render(noop);
  await new Promise((r) => setTimeout(r, 900));
  const conVoti = piano.render(noop);
  check('le strade salvate prendono un voto', conVoti.includes('Le mie strade') && conVoti.includes('Intatta'));

  // Il salvataggio deve sopravvivere alla chiusura dell'app: e' il senso di salvare.
  store.save();
  const dallaMemoria = JSON.parse(localStorage.getItem(Object.keys(localStorage).find((k) => k.includes('asta')) || 'astahelper') || '{}');
  check('le strade finiscono nel salvataggio', (dallaMemoria.scenari || []).length === 2);

  // Adesso gliene portano via il piu' caro: il voto deve scendere e lo stato cambiare.
  const pernoStrada = stradaA.ids.slice().sort((a, b) => stradaA.prezzi[b] - stradaA.prezzi[a])[0];
  store.assign(pernoStrada, 'other', stradaA.prezzi[pernoStrada] + 10, 2);
  piano.render(noop);
  await new Promise((r) => setTimeout(r, 900));
  const dopoLaPerdita = piano.render(noop);
  check('perdere il perno si vede nella strada', dopoLaPerdita.includes('Colpita') && dopoLaPerdita.includes('crediti su'));

  // Seguire una strada mette i lucchetti sul suo nucleo e rifa' il piano intorno.
  const revPrima = store.state.revisione;
  piano.onAction('segui-strada', { dataset: { id: stradaA.id } }, null, noop);
  const bloccatiOra = Object.keys(store.state.auction.bloccati || {});
  check('seguire una strada blocca il suo nucleo', bloccatiOra.length > 0 && bloccatiOra.length < 25, `${bloccatiOra.length} lucchetti`);
  check('e il piano si rifa\'', store.state.revisione > revPrima);
  check('il piano segue davvero la strada', bloccatiOra.every((id) => store.state.plan.picks.some((p) => p.id === id) || store.state.plan.owned.some((p) => p.id === id)));

  // Il difetto che questa scheda avrebbe potuto ereditare: mettere un lucchetto non tocca il
  // registro, quindi una cache basata sulle assegnazioni continuerebbe a mostrare l'offerta
  // massima calcolata sul piano di prima.
  // Si sceglie un attaccante e si blocca un giocatore di un altro reparto: il piano cambia,
  // quindi l'offerta massima deve cambiare con lui. Non si controlla la direzione — puo'
  // salire, perche' imporre un centrocampista peggiora anche il piano B e quindi perdere
  // l'attaccante costa di piu' — si controlla che il numero si rifaccia. Se restasse uguale
  // vorrebbe dire che la cache sta mostrando il consiglio di un piano che non esiste piu',
  // che e' esattamente il difetto per cui esiste il contatore di revisione.
  const cifra = (html) => Number((html.match(/class="n mono[^"]*">(\d+)</) || [])[1] ?? NaN);
  const mirino = store.state.plan.picks.filter((p) => p.role === 'A').sort((a, b) => b.plannedPrice - a.plannedPrice)[0];
  store.state.ui.selectedId = mirino.id;
  asta.invalidate();
  asta.render(noop);
  await new Promise((r) => setTimeout(r, 900));
  const offertaPrima = cifra(asta.render(noop));
  check('l\'asta dice un\'offerta massima', Number.isFinite(offertaPrima), `${mirino.name} vale fino a ${offertaPrima}`);

  const daBloccare = store.state.players
    .filter((p) => p.role !== 'A' && !store.state.auction.owned[p.id] && !store.state.auction.taken[p.id] && !store.state.auction.bloccati[p.id])
    .sort((a, b) => (b.expectedPrice || 0) - (a.expectedPrice || 0))[0];
  piano.onAction('blocca', { dataset: { id: daBloccare.id } }, null, noop);
  asta.render(noop);
  await new Promise((r) => setTimeout(r, 900));
  const offertaDopo = cifra(asta.render(noop));
  check(
    'un lucchetto in un altro reparto rifa\' subito l\'offerta massima',
    Number.isFinite(offertaDopo) && offertaDopo !== offertaPrima,
    `${offertaPrima} → ${offertaDopo} dopo aver bloccato ${daBloccare.name} (${daBloccare.expectedPrice} cr)`
  );

  piano.onAction('abbandona-strada', { dataset: {} }, null, noop);
  check('si puo\' abbandonare la strada', Object.keys(store.state.auction.bloccati || {}).length === 0);

  piano.onAction('elimina-strada', { dataset: { id: stradaA.id } }, null, noop);
  check('e si puo\' eliminare', store.state.scenari.length === 1);

  store.undo();
  store.state.ui.selectedId = null;
  asta.invalidate();

  // --- l'ultima occasione -------------------------------------------------------------
  // L'avviso sulla scarsita' dei big viveva nella scheda Mercato, che durante l'asta non
  // guarda nessuno. Deve comparire dove si sta puntando.
  // Serve che gliene manchi ancora uno: a questo punto dell'asta un attaccante top ce l'ha
  // gia', e con la soglia coperta l'avviso deve tacere — e infatti taceva.
  const giaMiei = Object.keys(store.state.auction.owned)
    .map((id) => store.state.players.find((x) => x.id === id))
    .filter((x) => x && x.role === 'A' && x.isTop).length;
  store.updateSettings({ minTop: { ...store.state.settings.minTop, A: giaMiei + 1 } });
  const topAttacco = store.state.players
    .filter((p) => p.role === 'A' && p.isTop && !store.state.auction.owned[p.id] && !store.state.auction.taken[p.id])
    .sort((a, b) => b.score - a.score);
  const superstite = topAttacco[0];
  const daBruciare = topAttacco.slice(1);
  store.assegnaMolti(daBruciare.map((p) => ({ id: p.id, kind: 'other', price: Math.round(p.expectedPrice || 1), by: 2 })));

  store.state.ui.tab = 'asta';
  store.state.ui.selectedId = superstite.id;
  asta.invalidate();
  asta.render(noop);
  await new Promise((r) => setTimeout(r, 900));
  const conAllarme = asta.render(noop);
  check(
    'l\'ultimo big lo dice la schermata d\'asta, non solo il mercato',
    conAllarme.includes('ultimo big in attacco') && conAllarme.includes('piano B'),
    `${superstite.name}, ${daBruciare.length} big bruciati, ne aveva gia' ${giaMiei}`
  );

  // E su un giocatore qualunque non deve comparire niente.
  const qualunque = store.state.players.find((p) => p.role === 'A' && !p.isTop && !store.state.auction.taken[p.id]);
  store.state.ui.selectedId = qualunque.id;
  asta.invalidate();
  asta.render(noop);
  await new Promise((r) => setTimeout(r, 900));
  check('e non compare su chi non e\' di prima fascia', !asta.render(noop).includes('ultimo big in attacco'));

  for (let i = 0; i < daBruciare.length; i++) store.undo();
  store.state.ui.selectedId = null;
  asta.invalidate();

  // --- la cache a piu' voci -----------------------------------------------------------
  // Durante un rilancio si salta avanti e indietro fra due o tre nomi. Con una casella sola
  // ogni ritorno rifaceva un secondo e mezzo di conti su un piano che non era cambiato.
  const primoBersaglio = store.state.plan.picks[0].id;
  const secondoBersaglio = store.state.plan.picks[1].id;
  asta.invalidate();
  store.state.ui.selectedId = primoBersaglio;
  asta.render(noop);
  await new Promise((r) => setTimeout(r, 1800));
  store.state.ui.selectedId = secondoBersaglio;
  asta.render(noop);
  await new Promise((r) => setTimeout(r, 1800));

  // Ritorno sul primo: deve essere gia' pronto senza aspettare niente.
  const tRitorno = performance.now();
  store.state.ui.selectedId = primoBersaglio;
  const alRitorno = asta.render(noop);
  const msRitorno = Math.round(performance.now() - tRitorno);
  check(
    'tornare su un giocatore gia\' aperto non ricalcola',
    !alRitorno.includes('calcolo in corso') && alRitorno.includes('vale fino a questo') && msRitorno < 120,
    `${msRitorno}ms, senza spinner`
  );

  // Ma se il piano cambia, la cache scade tutta insieme: un consiglio vecchio sarebbe peggio
  // di un'attesa.
  store.assign(store.state.plan.picks[3].id, 'other', 30, 2);
  store.state.ui.selectedId = primoBersaglio;
  const dopoIlCambio = asta.render(noop);
  check('ma se il piano cambia la cache scade', dopoIlCambio.includes('calcolo in corso'), 'ricalcola invece di mostrare il vecchio');
  await new Promise((r) => setTimeout(r, 1800));
  store.undo();
  store.state.ui.selectedId = null;
  asta.invalidate();

  // --- backup dell'asta ---------------------------------------------------------------
  // Tutto vive nella memoria del browser, che puo' sparire. Il file deve bastare da solo a
  // rimettere in piedi la stessa asta, listone compreso.
  store.state.ui.tab = 'setup';
  check('la scheda Lega offre il backup', setup.render(noop).includes('Backup dell\'asta'));

  // Il tasto non deve mai fingere: dentro un iframe il download e' inerte e non solleva
  // niente, quindi la scelta si fa guardando dove si gira, non aspettando un errore.
  const inCornice = window.self !== window.top;
  let salvato = null;
  const clipVera = navigator.clipboard && navigator.clipboard.writeText;
  if (navigator.clipboard) navigator.clipboard.writeText = (t) => { salvato = t; return Promise.resolve(); };
  const click = HTMLAnchorElement.prototype.click;
  let scaricato = null;
  HTMLAnchorElement.prototype.click = function () { if (this.download) scaricato = this.download; else click.call(this); };
  setup.onAction('esporta', { dataset: {} }, null, noop);
  HTMLAnchorElement.prototype.click = click;
  if (navigator.clipboard && clipVera) navigator.clipboard.writeText = clipVera;
  check(
    inCornice ? 'in una cornice l\'export passa dagli appunti' : 'in pagina piena l\'export scarica un file',
    inCornice ? typeof salvato === 'string' && salvato.length > 100 : /^astahelper-\d{8}-\d{4}\.json$/.test(scaricato || ''),
    inCornice ? `${Math.round((salvato || '').length / 1024)} KB negli appunti` : String(scaricato)
  );

  const backup = store.esporta();
  let payload = null;
  try { payload = JSON.parse(backup); } catch (e) { payload = null; }
  check('il backup e\' JSON valido e si dichiara', !!payload && payload.app === 'astahelper' && payload.formato >= 1);
  check('e contiene listone, impostazioni e asta',
    !!payload?.settings && !!payload?.auction && (payload?.sources || []).length === 1,
    `${(payload?.sources?.[0]?.players || []).length} giocatori nel file`);

  // Un file sbagliato non deve fare danni: e' il momento in cui si sta gia' rischiando.
  const primaDelDanno = { giocatori: store.state.players.length, crediti: store.creditsLeft() };
  const rifiuti = [
    ['testo che non e\' JSON', 'questo non e un file'],
    ['JSON senza asta dentro', '{"app":"astahelper","settings":{}}'],
    ['backup di una versione futura', JSON.stringify({ ...payload, formato: 99 })],
  ];
  for (const [nome, cattivo] of rifiuti) {
    const esito = store.importa(cattivo);
    check(`rifiuta ${nome}`, esito.ok === false && !!esito.motivo, esito.motivo || '');
  }
  check('e rifiutando non ha toccato niente',
    store.state.players.length === primaDelDanno.giocatori && store.creditsLeft() === primaDelDanno.crediti);

  // Andata e ritorno: si compra qualcuno, si ripristina, si deve tornare a prima.
  const cavia = store.state.plan.picks.filter((p) => p.role === 'C')[0];
  store.assign(cavia.id, 'mine', 33);
  check('lo stato e\' cambiato', store.creditsLeft() !== primaDelDanno.crediti);
  const tornato = store.importa(backup);
  check('il ripristino riesce', tornato.ok === true, tornato.motivo || `${tornato.giocatori} giocatori`);
  check('e riporta l\'asta esattamente a prima',
    store.creditsLeft() === primaDelDanno.crediti && store.state.auction.owned[cavia.id] === undefined,
    `${store.creditsLeft()} crediti`);
  check('il piano viene rifatto sul listone ripristinato', store.state.plan?.ok === true && store.state.players.length === 540);
  check('e il backup e\' finito anche nella memoria del telefono',
    JSON.parse(localStorage.getItem('astahelper:v1')).auction.owned[cavia.id] === undefined);

  // --- import delle rose ---------------------------------------------------------------
  // E' il file che porta chi ha comprato e a quanto: i due dati che al tabellone mancano e che lo
  // costringono a dare limiti superiori invece di misure.
  const nomiLega = ['Io', 'Marco', 'Luca', 'Giacomo', 'Paolo', 'Andrea', 'Ivan', 'Nico'];
  const daVendere = store.state.players.filter((p) => !store.state.auction.taken[p.id] && !store.state.auction.owned[p.id]).slice(0, 32);
  const csv = ['Squadra,Nome,Squadra_Appartenenza,Ruolo,Ruoli_Mantra,Prezzo,Quotazione,Quotazione_Mantra,Fantacalcio_Id']
    .concat(daVendere.map((p, i) => `"${nomiLega[i % 8]}","${p.name}","${p.team}","${p.role}","${p.role}",${4 + i},1,1,0`))
    .join('\r\n');

  const lettura = leggiRose(csv, store.state.players);
  check('l\'export si legge', lettura.ok === true && lettura.conta.trovato === 32, `${lettura.conta?.trovato} righe`);
  check('e riconosce tutte le squadre', lettura.squadre.length === 8, lettura.squadre.join(', '));

  const mappa = new Map(nomiLega.map((n, i) => [n, i]));
  const conf = store.confrontaRose(lettura.righe, mappa);
  check('il confronto dice cosa cambierebbe prima di toccare niente',
    conf.nuovi.length > 0 && store.state.auction.owned[daVendere[0].id] === undefined,
    `${conf.nuovi.length} nuovi, ${conf.prezzi.length} corretti, ${conf.tolti.length} tolti`);

  store.applicaRose(conf);
  check('i miei acquisti finiscono in rosa col prezzo del file', store.state.auction.owned[daVendere[0].id] === 4, `${store.state.auction.owned[daVendere[0].id]}`);
  check('quelli degli altri vanno alla squadra giusta',
    store.state.auction.taken[daVendere[1].id]?.by === 1 && store.state.auction.taken[daVendere[1].id]?.price === 5,
    JSON.stringify(store.state.auction.taken[daVendere[1].id]));
  check('e il tabellone smette di essere una stima', store.state.tabellone.attendibile === true,
    `${store.state.tabellone.attribuiti}/${store.state.tabellone.venduti} attribuiti, scarto ${store.state.tabellone.scarto}`);
  check('il piano si rifa\' su quello che resta', store.state.plan?.ok === true);

  // Sincronizzare due volte lo stesso file non deve cambiare niente: e' cio' che distingue una
  // sincronizzazione da un accodamento.
  const ancora = store.confrontaRose(leggiRose(csv, store.state.players).righe, mappa);
  check('reimportare lo stesso file non cambia niente', ancora.invariato === true,
    `${ancora.nuovi.length} nuovi, ${ancora.prezzi.length} corretti, ${ancora.tolti.length} tolti`);

  // Un'assegnazione fatta a mano che il file non conosce deve comparire fra i "tolti", non
  // sparire in silenzio: e' il danno peggiore che questa funzione possa fare.
  const aMano = store.state.players.find((p) => !store.state.auction.taken[p.id] && !store.state.auction.owned[p.id]);
  store.assign(aMano.id, 'other', 20, 2);
  const conTolti = store.confrontaRose(leggiRose(csv, store.state.players).righe, mappa);
  check('cio\' che il file non ha viene dichiarato prima di sparire',
    conTolti.tolti.some((x) => x.id === aMano.id), `${conTolti.tolti.length} tolti`);
  store.undo();

  // --- cancella tutto ----------------------------------------------------------------
  // Il tasto usava confirm(), che dentro un iframe con sandbox viene ignorato in silenzio:
  // la conferma deve stare nella pagina, e l'azzeramento deve ripulire anche le memorie
  // delle viste, che vivono fuori dallo stato.
  piano.render(noop);
  store.state.ui.tab = 'setup';
  setup.onAction('reset', { dataset: {} }, null, noop);
  const conConferma = setup.render(noop);
  check('la conferma sta dentro la pagina', conConferma.includes('reset-conferma') && conConferma.includes('Annulla'));

  setup.onAction('reset-annulla', { dataset: {} }, null, noop);
  check('si puo\' annullare', !setup.render(noop).includes('reset-conferma') && store.state.players.length === 540);

  setup.onAction('reset', { dataset: {} }, null, noop);
  setup.onAction('reset-conferma', { dataset: {} }, null, noop);
  check('il listone e\' sparito', store.state.players.length === 0 && store.state.sources.length === 0);
  check('l\'asta in corso e\' sparita', Object.keys(store.state.auction.owned).length === 0 && store.state.auction.log.length === 0);
  check('la memoria del telefono e\' vuota', localStorage.getItem('astahelper:v1') === null);
  check('non si ricarica piu\' niente', store.load() === false);
  const astaDopo = asta.render(noop);
  check('l\'asta torna alla schermata iniziale', astaDopo.includes('Nessun listone caricato'));
  check('il mercato e\' vuoto', mercato.render(noop).includes('Nessun listone caricato'));

  // Il caso che conta davvero per le memorie delle viste: azzero e reimporto un listone
  // diverso. Se la scheda d'asta calcolata prima sopravvive, restano a schermo giocatori
  // di un listone che non esiste piu'.
  store.addSource({ name: 'prova', players, headers: [], mapping: {}, warnings: [], fileName: 'prova.xlsx' });
  const nomeVecchio = target.name;
  piano.onAction('scheda', { dataset: {} }, null, noop);
  await new Promise((r) => setTimeout(r, 400));
  const conScheda = piano.render(noop);
  check('la scheda d\'asta si calcola', conScheda.includes("Scheda d'asta") && conScheda.includes('Ricalcola'));

  setup.onAction('reset', { dataset: {} }, null, noop);
  setup.onAction('reset-conferma', { dataset: {} }, null, noop);
  // Nomi che non contengono i vecchi nemmeno come sottostringa, altrimenti il controllo mente.
  store.addSource({
    name: 'altro',
    players: players.slice(0, 200).map((p, i) => ({ ...p, id: 'nuovo' + i, name: 'Nuovo' + i })),
    headers: [],
    mapping: {},
    warnings: [],
    fileName: 'altro.xlsx',
  });
  const dopoReimport = piano.render(noop);
  check(
    'la scheda del listone cancellato non sopravvive',
    !dopoReimport.includes('Ricalcola') && !dopoReimport.includes(nomeVecchio),
    'memoria della vista ripulita'
  );

  localStorage.clear();
} catch (err) {
  lines.push(`FAIL eccezione :: ${err && err.stack ? err.stack.split('\n').slice(0, 2).join(' | ') : err}`);
}

document.getElementById('out').textContent = lines.join('\n');
document.title = lines.some((l) => l.startsWith('FAIL')) ? 'ROSSO' : 'VERDE';
</script>
