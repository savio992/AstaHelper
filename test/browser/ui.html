<!doctype html>
<meta charset="utf-8">
<title>ui</title>
<pre id="out">in corso…</pre>
<script type="module">
import * as store from '../../src/store.js';
import * as asta from '../../src/ui/asta.js';
import * as piano from '../../src/ui/piano.js';
import * as mercato from '../../src/ui/mercato.js';
import * as listone from '../../src/ui/listone.js';
import * as setup from '../../src/ui/setup.js';
import { ROLES } from '../../src/domain/model.js';

const lines = [];
const check = (name, ok, extra = '') => lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}${extra ? ' :: ' + extra : ''}`);
const noop = () => {};

try {
  localStorage.clear();

  // Un listone credibile: fasce, prezzi, giudizi di titolarita'.
  const clubs = ['ROM','INT','MIL','NAP','ATA','LAZ','JUV','BOL','FIO','TOR','GEN','COM','CAG','LEC','UDI','PAR','VER','MON','EMP','VEN'];
  const perRole = { P: 3, D: 9, C: 9, A: 6 };
  const tiers = ['Top','Semi-Top','Terza','Quarta','Scomm.','Outsider'];
  const players = [];
  for (const club of clubs) for (const role of ROLES) for (let i = 0; i < perRole[role]; i++) {
    const t = Math.min(tiers.length - 1, Math.floor(i * tiers.length / perRole[role]));
    players.push({
      id: `${club}-${role}-${i}`, name: `${role}${i}${club}`, team: club, role, tier: tiers[t],
      tags: role === 'P' && t === 0 ? ['imbattibilità'] : [], notes: '', sources: ['prova'],
      price: Math.max(1, Math.round((30 - t * 5) * (role === 'A' ? 2 : role === 'C' ? 1.4 : role === 'D' ? 0.9 : 0.5))),
      fmvExp: 5 + (role === 'P' ? 0 : 1.2) + (tiers.length - t) * 0.25,
      titolarita: Math.max(1, 5 - t), integrita: 4,
    });
  }

  store.addSource({ name: 'prova', players, headers: [], mapping: {}, warnings: [], fileName: 'prova.xlsx' });
  check('import nello stato', store.state.players.length === 540 && store.state.sources.length === 1);
  check('ordine fasce dedotto', store.state.settings.tierOrder.A[0] === 'Top');

  const plan = store.state.plan;
  check('piano pronto dopo import', plan?.ok === true && plan.picks.length === 25, `${plan?.cost} crediti`);

  // --- schermata asta -------------------------------------------------------------
  store.state.ui.tab = 'asta';
  let html = asta.render(noop);
  check('la schermata asta mostra i crediti', html.includes('crediti liberi') && html.includes('500'));
  // Gli obiettivi sono ora tagliati sul reparto in corso, con gli altri piegati sotto.
  check('mostra gli obiettivi del reparto in corso', /Obiettivi · portieri/.test(html));
  check('gli obiettivi dei reparti dopo restano raggiungibili', html.includes('Gli obiettivi dei reparti dopo'));
  check('propone chi sta per essere chiamato', html.includes('i piu&#39; probabili adesso') || html.includes("i piu' probabili adesso"));
  check('ogni obiettivo ha il tocco singolo per dirlo perso', html.includes('data-action="quick-gone"'));

  // Seleziono un obiettivo: deve comparire il pannello con offerta massima e alternative.
  const target = plan.picks.filter((p) => p.role === 'A').sort((a, b) => b.plannedPrice - a.plannedPrice)[0];
  store.state.ui.selectedId = target.id;
  asta.render(noop); // primo giro: avvia il calcolo
  await new Promise((r) => setTimeout(r, 400));
  html = asta.render(noop);
  check('pannello del giocatore aperto', html.includes(target.name));
  check("mostra l'offerta massima", html.includes('fin qui conviene'));
  check('mostra le alternative se lo perdo', html.includes('Se lo perdo'));
  // Il divario fra prezzo di mercato e offerta massima va motivato, non lasciato li': un
  // portiere di riserva caro e' il caso tipico, e il ripiego non deve essere gia' in rosa.
  const titolare = store.state.plan.picks.filter((x) => x.role === 'P').sort((a, b) => b.score - a.score)[0];
  const riserva = store.state.players
    .filter((x) => x.role === 'P' && x.id !== titolare.id && x.expectedPrice > 8)
    .sort((a, b) => a.score - b.score)[0];
  if (riserva) {
    store.state.ui.selectedId = riserva.id;
    asta.render(noop);
    await new Promise((r) => setTimeout(r, 900));
    const conRiserva = asta.render(noop);
    check('il divario col mercato viene motivato', /mercato lo paga/.test(conRiserva), riserva.name);
    const rip = conRiserva.match(/(?:se lo superi, meglio|se ti serve il ruolo,) <b>([^<]+)<\/b>/);
    const inPiano = new Set(store.state.plan.picks.map((x) => x.name));
    check('il ripiego non e\' uno che prendo comunque', !rip || !inPiano.has(rip[1]), rip ? rip[1] : 'nessun ripiego');
    store.state.ui.selectedId = target.id;
    asta.render(noop);
    await new Promise((r) => setTimeout(r, 900));
  }

  check('mostra i pulsanti di assegnazione', html.includes('data-action="take-mine"') && html.includes('data-action="take-other"'));
  check('le alternative sono spiegate a parole, non con un delta', /praticamente uguale|poco sotto|sensibilmente sotto|ripiego|meglio di lui/.test(html));

  // La schermata iniziale deve dire cosa e' impostato e cosa manca.
  store.state.ui.selectedId = null;
  const home = asta.render(noop);
  check('la schermata iniziale riepiloga la configurazione', home.includes('Prima di cominciare'));
  check('riepiloga la lega impostata', home.includes(`${store.state.settings.participants} squadre`));
  check('i passi portano alle altre schede', home.includes('data-action="goto"'));
  store.state.ui.selectedId = target.id;

  // --- compro un giocatore ---------------------------------------------------------
  const prezzo = 40;
  store.assign(target.id, 'mine', prezzo);
  check('crediti scalati', store.creditsLeft() === 500 - prezzo, `restano ${store.creditsLeft()}`);
  // Ogni operazione deve essere raccontata: chi e' entrato, chi esce, dove vanno i crediti.
  // Nell'app il pannello del giocatore si chiude da solo dopo l'assegnazione: qui lo replichiamo,
  // altrimenti si sta guardando il dettaglio e non la schermata che vede l'utente.
  store.state.ui.selectedId = null;
  const dopoAcquisto = asta.render(noop);
  check('l\'acquisto viene raccontato', dopoAcquisto.includes(target.name) && /tuo a \d+/.test(dopoAcquisto), 'card della mossa');
  check('il racconto dice cosa ne consegue', /piano|crediti|obiettiv/i.test(dopoAcquisto));
  check('il giocatore entra in rosa', store.state.plan.owned.some((p) => p.id === target.id));
  check('il piano si ricalcola su 24 slot', store.state.plan.picks.length === 24);
  check('il budget totale resta rispettato', store.state.plan.cost <= 500, `${store.state.plan.cost}`);

  // --- un avversario mi soffia un obiettivo ----------------------------------------
  const perso = store.state.plan.picks.filter((p) => p.role === 'D').sort((a, b) => b.plannedPrice - a.plannedPrice)[0];
  const puntiPrima = store.state.plan.score;
  store.assign(perso.id, 'other', 0);
  store.state.ui.selectedId = null;
  const dopoPerdita = asta.render(noop);
  check('la perdita viene raccontata', /va a un avversario/.test(dopoPerdita), 'card della mossa');
  check('chi va agli altri esce dal piano', !store.state.plan.picks.some((p) => p.id === perso.id));
  check('il piano resta valido', store.state.plan.ok && store.state.plan.picks.length === 24);
  check('perdere un obiettivo non migliora la rosa', store.state.plan.score <= puntiPrima + 1e-6);

  // --- annullo -----------------------------------------------------------------------
  store.undo();
  check("l'annulla riporta il giocatore disponibile", store.state.auction.taken[perso.id] === undefined);
  check('la rosa comprata resta', store.state.plan.owned.some((p) => p.id === target.id));

  // --- altre schermate ---------------------------------------------------------------
  store.state.ui.selectedId = null;
  store.state.ui.tab = 'piano';
  html = piano.render(noop);
  check('il piano elenca i quattro reparti', ['Portieri','Difensori','Centrocampisti','Attaccanti'].every((r) => html.includes(r)));
  check('il piano mostra il budget per fascia', html.includes('Budget per fascia'));
  check("il piano mostra l'esposizione per club", html.includes('Esposizione per club'));

  store.state.ui.tab = 'listone';
  html = listone.render(noop);
  check('il listone mostra la fonte caricata', html.includes('prova') && html.includes('Creators caricati'));

  store.state.ui.tab = 'setup';
  html = setup.render(noop);
  check('le impostazioni mostrano i modificatori', html.includes('Modificatore di difesa') && html.includes('Imbattibilita'));
  check('le impostazioni mostrano il tetto per club', html.includes('Concentrazione per club'));

  // --- persistenza -------------------------------------------------------------------
  const primaDelReload = store.creditsLeft();
  store.state.roster = [];
  store.state.players = [];
  store.state.plan = null;
  const ok = store.load();
  check('lo stato si ricarica dal telefono', ok && store.state.players.length === 540 && store.creditsLeft() === primaDelReload);
  check("l'asta in corso sopravvive alla chiusura", store.state.auction.owned[target.id] === prezzo);

  // --- cancella tutto ----------------------------------------------------------------
  // Il tasto usava confirm(), che dentro un iframe con sandbox viene ignorato in silenzio:
  // la conferma deve stare nella pagina, e l'azzeramento deve ripulire anche le memorie
  // delle viste, che vivono fuori dallo stato.
  piano.render(noop);
  store.state.ui.tab = 'setup';
  setup.onAction('reset', { dataset: {} }, null, noop);
  const conConferma = setup.render(noop);
  check('la conferma sta dentro la pagina', conConferma.includes('reset-conferma') && conConferma.includes('Annulla'));

  setup.onAction('reset-annulla', { dataset: {} }, null, noop);
  check('si puo\' annullare', !setup.render(noop).includes('reset-conferma') && store.state.players.length === 540);

  setup.onAction('reset', { dataset: {} }, null, noop);
  setup.onAction('reset-conferma', { dataset: {} }, null, noop);
  check('il listone e\' sparito', store.state.players.length === 0 && store.state.sources.length === 0);
  check('l\'asta in corso e\' sparita', Object.keys(store.state.auction.owned).length === 0 && store.state.auction.log.length === 0);
  check('la memoria del telefono e\' vuota', localStorage.getItem('astahelper:v1') === null);
  check('non si ricarica piu\' niente', store.load() === false);
  const astaDopo = asta.render(noop);
  check('l\'asta torna alla schermata iniziale', astaDopo.includes('Nessun listone caricato'));
  check('il mercato e\' vuoto', mercato.render(noop).includes('Nessun listone caricato'));

  // Il caso che conta davvero per le memorie delle viste: azzero e reimporto un listone
  // diverso. Se la scheda d'asta calcolata prima sopravvive, restano a schermo giocatori
  // di un listone che non esiste piu'.
  store.addSource({ name: 'prova', players, headers: [], mapping: {}, warnings: [], fileName: 'prova.xlsx' });
  const nomeVecchio = target.name;
  piano.onAction('scheda', { dataset: {} }, null, noop);
  await new Promise((r) => setTimeout(r, 400));
  const conScheda = piano.render(noop);
  check('la scheda d\'asta si calcola', conScheda.includes("Scheda d'asta") && conScheda.includes('Ricalcola'));

  setup.onAction('reset', { dataset: {} }, null, noop);
  setup.onAction('reset-conferma', { dataset: {} }, null, noop);
  // Nomi che non contengono i vecchi nemmeno come sottostringa, altrimenti il controllo mente.
  store.addSource({
    name: 'altro',
    players: players.slice(0, 200).map((p, i) => ({ ...p, id: 'nuovo' + i, name: 'Nuovo' + i })),
    headers: [],
    mapping: {},
    warnings: [],
    fileName: 'altro.xlsx',
  });
  const dopoReimport = piano.render(noop);
  check(
    'la scheda del listone cancellato non sopravvive',
    !dopoReimport.includes('Ricalcola') && !dopoReimport.includes(nomeVecchio),
    'memoria della vista ripulita'
  );

  localStorage.clear();
} catch (err) {
  lines.push(`FAIL eccezione :: ${err && err.stack ? err.stack.split('\n').slice(0, 2).join(' | ') : err}`);
}

document.getElementById('out').textContent = lines.join('\n');
document.title = lines.some((l) => l.startsWith('FAIL')) ? 'ROSSO' : 'VERDE';
</script>
